<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zimpra Ocean Freight Platform</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0E1B2E; --ink2:#33465F; --muted:#6E7F94; --faint:#95A3B5;
  --line:#D9E0E9; --line2:#EAEFF4; --bg:#EBEFF3; --surface:#FFFFFF;
  --brand:#16305B; --brand2:#24457B;
  --ok:#0E9F5C; --okbg:#E6F5ED;
  --warn:#E0A100; --warnbg:#FDF4DF;
  --bad:#E0362A; --badbg:#FCEBE9;
  --info:#6B7EF0; --infobg:#EDEFFE;
  --rail:230px;
}
html,body{height:100%}
body{
  font-family:"Segoe UI",Inter,-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:13.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2);text-decoration:none}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;background:
  radial-gradient(900px 500px at 15% -10%,#F6F8FA,transparent),var(--bg);padding:24px}
.loginbox{width:min(760px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:6px;overflow:hidden}
.loginhead{padding:26px 30px 20px;border-bottom:1px solid var(--line2)}
.mark{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.mark svg{display:block}
.mark b{font-size:16.5px;font-weight:600;letter-spacing:-.2px}
.loginhead h1{font-size:22px;font-weight:600;letter-spacing:-.3px}
.loginhead p{color:var(--muted);margin-top:5px;max-width:60ch}
.pickgrid{display:flex}
.pickcol{flex:1 1 50%}
.pickcol{padding:22px 30px 28px}
.pickcol+.pickcol{border-left:1px solid var(--line2);background:#FBFCFD}
.pickcol h2{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:12px}
.acct{width:100%;text-align:left;display:flex;gap:11px;align-items:center;padding:10px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:5px;cursor:pointer;margin-bottom:8px}
.acct:hover{border-color:var(--brand2);background:#F7F9FC}
.avatar{width:30px;height:30px;border-radius:4px;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff;flex:none}
.acct .nm{font-weight:600;font-size:13px}
.acct .rl{font-size:11.5px;color:var(--muted)}

/* ---------- frame ---------- */
#app{display:none;min-height:100vh}
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);background:var(--brand);
  display:flex;flex-direction:column;z-index:20}
.railtop{padding:16px 18px 14px;display:flex;align-items:center;gap:9px;color:#fff}
.railtop b{font-size:15px;font-weight:600;letter-spacing:-.1px}
.railsub{padding:0 18px 14px;color:#9FB2D0;font-size:11px;border-bottom:1px solid #24457B}
.nav{padding:10px 10px;overflow:auto;flex:1}
.navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 10px;
  border:0;background:transparent;color:#C6D3E6;border-radius:4px;cursor:pointer;font-size:13px}
.navitem:hover{background:#1D3A69;color:#fff}
.navitem.on{background:#FFFFFF;color:var(--brand);font-weight:600}
.navitem .ct{margin-left:auto;font-size:11px;background:#24457B;color:#C6D3E6;
  padding:1px 6px;border-radius:9px;min-width:20px;text-align:center}
.navitem.on .ct{background:var(--brand);color:#fff}
.navitem .dotwarn{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.railfoot{padding:12px;border-top:1px solid #24457B}
.railfoot button{width:100%;padding:7px;background:#1D3A69;border:1px solid #2C5089;color:#C6D3E6;
  border-radius:4px;cursor:pointer;font-size:12px}
.railfoot button:hover{background:#24457B;color:#fff}

.main{margin-left:var(--rail);min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:14px;z-index:15}
.top h1{font-size:17px;font-weight:600;letter-spacing:-.2px}
.top .crumb{color:var(--muted);font-size:12.5px}
.topright{margin-left:auto;display:flex;align-items:center;gap:10px}
.topright>*{margin-left:2px}
.who{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--line);
  border-radius:20px;background:#fff}
.who .nm{font-size:12px;font-weight:600}
.who .rl{font-size:11px;color:var(--muted)}
.wrap{padding:22px 26px 60px;max-width:1500px;width:100%}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.card>h3{font-size:13px;font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:8px}
.card>h3 .sub{font-weight:400;color:var(--muted);font-size:12px;margin-left:2px}
.card .pad{padding:16px}
.grid{display:flex;flex-wrap:wrap;gap:14px}
.grid>*{min-width:0}
.g2>*{flex:1 1 calc(50% - 7px)}
.g3>*{flex:1 1 calc(33.33% - 10px)}
.g4>*{flex:1 1 calc(25% - 11px)}
@media(max-width:1100px){.g4>*{flex:1 1 calc(50% - 7px)}.g3>*,.g2>*{flex:1 1 100%}}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mt{margin-top:14px}.mt8{margin-top:8px}.mb{margin-bottom:14px}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11.5px}
.right{text-align:right}.center{text-align:center}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-.1px}
.sect{font-size:12px;font-weight:600;color:var(--muted);margin:20px 0 8px}
.hr{height:1px;background:var(--line2);margin:14px 0}

.btn{padding:6px 13px;border:1px solid var(--line);background:#fff;border-radius:4px;
  cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:#F4F7FA;border-color:#BFCBDA}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{filter:brightness(1.07)}
.btn.bad{background:#fff;border-color:#E8B4AF;color:var(--bad)}
.btn.bad:hover{background:var(--badbg)}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:3px;
  font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.t-ok{background:var(--okbg);color:#0A7845;border-color:#BCE5CF}
.t-warn{background:var(--warnbg);color:#8A6400;border-color:#F0DCA6}
.t-bad{background:var(--badbg);color:#B32419;border-color:#F2C4BF}
.t-info{background:var(--infobg);color:#3B4CC0;border-color:#CDD3FA}
.t-grey{background:#F0F3F7;color:var(--ink2);border-color:var(--line)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);
  padding:9px 12px;border-bottom:1px solid var(--line);background:#F8FAFC;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}
tr.clk:hover td{background:#F6F9FC}
tr.sel td{background:#EDF2FA}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}

label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:3px}
label.f>span em{font-style:normal;color:var(--muted);font-weight:400}
input.i,select.i,textarea.i{width:100%;padding:6px 9px;border:1px solid var(--line);
  border-radius:4px;background:#fff;font-size:13px}
input.i:focus,select.i:focus{border-color:var(--brand2);outline:none}
input.i[readonly]{background:#F5F7FA;color:var(--ink2)}
.chk{display:flex;align-items:center;gap:7px;padding:5px 8px;border:1px solid var(--line);
  border-radius:4px;background:#fff;cursor:pointer;font-size:12.5px}
.chk input{margin:0}
.chk.on{border-color:var(--brand2);background:#F2F6FC}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:500;text-align:right}

.metric .v{font-size:21px;font-weight:600;letter-spacing:-.6px;line-height:1.15}
.metric .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.metric .d{font-size:11.5px;margin-top:5px}

.bar{height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand2)}

.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px;font-weight:600}

.modal{position:fixed;inset:0;background:rgba(14,27,46,.42);z-index:60;display:grid;
  place-items:start center;padding:34px 18px;overflow:auto}
.sheet{background:#fff;border-radius:7px;width:min(1080px,100%);border:1px solid var(--line)}
.sheet>header{padding:15px 20px;border-bottom:1px solid var(--line2);display:flex;
  align-items:center;gap:10px;position:sticky;top:0;background:#fff;border-radius:7px 7px 0 0;z-index:2}
.sheet>header h2{font-size:16px;font-weight:600}
.sheet>.body{padding:20px}
.sheet>footer{padding:13px 20px;border-top:1px solid var(--line2);display:flex;gap:9px;
  justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 7px 7px}
.x{margin-left:auto;background:transparent;border:0;font-size:16.5px;cursor:pointer;color:var(--muted);line-height:1}
.x:hover{color:var(--ink)}

.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:11px 16px;
  border-radius:5px;font-size:13px;z-index:80;max-width:380px;box-shadow:0 6px 22px rgba(14,27,46,.28)}
.toast b{display:block;font-weight:600;margin-bottom:1px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:8px 14px;border:0;background:transparent;cursor:pointer;font-size:13px;
  color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand);font-weight:600;border-bottom-color:var(--brand)}

.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.filters select.i,.filters input.i{width:auto;min-width:130px}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-size:12px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
</style>
<body>
<div id="login"></div>
<div id="app">
  <nav class="rail" id="rail"></nav>
  <div class="main">
    <div class="top" id="top"></div>
    <div class="wrap" id="view"></div>
  </div>
</div>
<div id="layer"></div>
<script>
/* ======================= brand mark ======================= */
function logo(size,light){

  '<g fill="none" stroke="'+c+'" stroke-width="6">'+
  '<rect x="30" y="30" width="40" height="40" rx="11" transform="rotate(12 50 50)"/>'+
  '<path d="M28 18 A40 40 0 0 1 82 28"/><path d="M82 28 A40 40 0 0 1 72 82"/>'+
  '<path d="M72 82 A40 40 0 0 1 18 72"/><path d="M18 72 A40 40 0 0 1 28 18"/></g>'+
  '<circle cx="50" cy="14" r="9" fill="#F5C400"/><circle cx="86" cy="50" r="9" fill="#EF3B2D"/>'+
  '<circle cx="50" cy="86" r="9" fill="#00A053"/><circle cx="14" cy="50" r="9" fill="#7B8CF4"/></svg>';
}
</script>

function usd(n){ if(n==null||isNaN(n))return '-';

function inr(n){ if(n==null||isNaN(n))return '-';
  return '\u20B9'+Math.round(Number(n)).toLocaleString('en-IN'); }
function money(n,cur){ return cur==='INR'?inr(n):usd(n); }
function pct(n){ return (Math.round(n*10)/10)+'%'; }
function d2(n){ return n<10?'0'+n:''+n; }
function iso(dt){ if(!dt)return null; var d=new Date(dt);
  return d.getFullYear()+'-'+d2(d.getMonth()+1)+'-'+d2(d.getDate())+'T'+d2(d.getHours())+':'+d2(d.getMinutes()); }
function fdate(dt){ if(!dt)return '\u2014'; var d=new Date(dt);
  var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d2(d.getDate())+' '+m[d.getMonth()]+' '+String(d.getFullYear()).slice(2); }
function fdt(dt){ if(!dt)return '\u2014'; var d=new Date(dt);
  return fdate(dt)+' '+d2(d.getHours())+':'+d2(d.getMinutes()); }
function addD(dt,n){ var d=new Date(dt); d.setDate(d.getDate()+n); return d; }
function addH(dt,n){ var d=new Date(dt); d.setHours(d.getHours()+n); return d; }
function days(a,b){ if(!a||!b)return null; return Math.round((new Date(b)-new Date(a))/864e5*10)/10; }
function daysUp(a,b){ if(!a||!b)return null; return Math.max(0,Math.ceil((new Date(b)-new Date(a))/864e5)); }
function hoursUp(a,b){ if(!a||!b)return null; return Math.max(0,Math.ceil((new Date(b)-new Date(a))/36e5)); }
function ym(dt){ var d=new Date(dt); return d.getFullYear()+'-'+d2(d.getMonth()+1); }
function sum(a){ return a.reduce(function(x,y){return x+y;},0); }
function by(id){ return function(x){return x.id===id;}; }

/* build the shipment file: ocean order plus every applicable rate contract, snapshotted */
function buildFile(oc){
  var f={id:'SF-'+(S.seq.sf++),ocId:oc.id,plant:oc.plant,origin:oc.origin,destination:oc.destination,
    qty:oc.qty,equip:oc.equip,commodity:oc.commodity,imo:oc.imo,un:oc.un,pkg:oc.pkg,
    incoterm:oc.incoterm,createdAt:oc.issuedAt,shipmentId:null,status:'open',services:[]};
  /* ocean leg from the awarded order */
  f.services.push({cat:'ocean',vendorId:oc.vendorId,contractId:oc.id,contractType:'order',cur:'USD',
    items:oc.rateCard.map(function(r){return {code:r.code,amt:r.amt,qty:oc.qty,cls:r.cls,basis:'per container'};}),
    status:'awaited',invoiceIds:[]});
  /* ancillary categories from live rate contracts */
  ['cha','trans','cfs','tank','survey'].forEach(function(cat){
    var c=liveContract(cat,oc);
    if(!c){ f.services.push({cat:cat,vendorId:null,contractId:null,contractType:'none',cur:'INR',
      items:[],status:'uncontracted',invoiceIds:[]}); return; }
    var items=c.lines.map(function(l){
      var q = l.basis==='per container'||l.basis==='per tank' ? oc.qty
            : l.basis==='per trip' ? oc.qty : 1;
      if(l.code==='EXAMAT') q=0;                       /* only if an examination happens */
      return {code:l.code,amt:l.amt,qty:q,cls:CH[l.code].cls,basis:l.basis};
    });
    f.services.push({cat:cat,vendorId:c.vendorId,contractId:c.id,contractType:'contract',cur:c.cur,
      items:items,status:'awaited',invoiceIds:[],
      snapshot:{free:c.free,slabs:c.slabs,handlingPct:c.handlingPct,handlingCap:c.handlingCap,
                notApplicable:c.notApplicable.slice()}});
  });
  S.files.push(f); return f;
}
function liveContract(cat,oc){
  var c=S.contracts.filter(function(x){
    if(x.cat!==cat||x.status!=='live') return false;
    if(x.scope==='global') return true;
    if(x.scope==='port') return x.port===oc.origin;
    if(x.scope==='ports') return (x.ports||[]).indexOf(oc.origin)>=0;
    if(x.scope==='plantPort') return x.plant===oc.plant&&x.port===oc.origin;
    return false; });
  return c.length?c[0]:null;
}
function fileOfOC(id){ var r=S.files.filter(function(f){return f.ocId===id;}); return r.length?r[0]:null; }
function fileOf(id){ return find(S.files,id); }
function shipOfFile(f){ return f.shipmentId?find(S.shipments,f.shipmentId):null; }
function ocOf(id){ return find(S.orders,id); }
function vend(id){ return find(S.vendors,id); }
function bidOf(id){ return find(S.bids,id); }
function svcOf(f,cat){ var r=f.services.filter(function(s){return s.cat===cat;}); return r.length?r[0]:null; }
function svcExpected(s){ return sum(s.items.map(function(i){return i.amt*i.qty;})); }
function fileExpectedINR(f){ return sum(f.services.map(function(s){
  var v=svcExpected(s); return s.cur==='USD'?v*FX:v; })); }
function quoteTotal(q){ return q.base+sum(Object.keys(q.sc).map(function(c){return q.sc[c];})); }
function ocTotal(oc){ return sum(oc.rateCard.map(function(r){return r.amt;})); }

<script>
/* ===================== clocks ===================== */
function slabAmt(n,slabs){ if(!slabs||!slabs.length) return 0; var t=0;
  for(var d=1;d<=n;d++){ for(var i=0;i<slabs.length;i++){
    if(d>=slabs[i].f&&d<=slabs[i].t){ t+=slabs[i].r; break; } } } return t; }
function clockState(sh,key,free,slabs,qty){
  var c=CLOCKS[key], out={key:key,name:c.n,unit:c.unit,free:free||0,used:0,charge:0,
    running:false,amount:0,na:true,from:null,to:null};
  if(!sh||!sh.ev[c.from]) return out;
  out.na=false; out.from=sh.ev[c.from].at;
  out.to = sh.ev[c.to]?sh.ev[c.to].at:iso(NOW);
  out.running = !sh.ev[c.to];
  out.used = c.unit==='hour'?hoursUp(out.from,out.to):daysUp(out.from,out.to);
  out.charge = Math.max(0,out.used-out.free);
  out.amount = slabAmt(out.charge,slabs)*(qty||1);
  return out;
}
function clocksFor(f){
  var sh=shipOfFile(f), oc=ocOf(f.ocId), out=[];
  if(!sh) return out;
  var cfs=svcOf(f,'cfs'), tr=svcOf(f,'trans'), tk=svcOf(f,'tank');
  if(cfs&&cfs.snapshot) out.push(clockState(sh,'grent',cfs.snapshot.free.grent,cfs.snapshot.slabs.grent,f.qty));
  if(tr&&tr.snapshot)  out.push(clockState(sh,'halt', tr.snapshot.free.halt, tr.snapshot.slabs.halt, f.qty));
  if(tk&&tk.snapshot&&f.equip.indexOf('Tank')>=0)
    out.push(clockState(sh,'lease',tk.snapshot.free.lease,tk.snapshot.slabs.lease,f.qty));
  out.push(clockState(sh,'dem',oc.ftDem,oc.slabs,f.qty));
  out.push(clockState(sh,'det',oc.ftDet,oc.slabs,f.qty));
  return out.filter(function(c){return !c.na||c.key==='dem'||c.key==='det';});
}
function clockByCode(f,code){
  var k=null; Object.keys(CLOCKS).forEach(function(x){ if(CLOCKS[x].code===code) k=x; });
  if(!k) return null;
  var all=clocksFor(f), r=all.filter(function(c){return c.key===k;});
  return r.length?r[0]:null;
}

/* ===================== rule engine ===================== */
function expectedFor(line,ctx){
  var f=ctx.file, svc=ctx.svc, oc=ctx.oc, sh=ctx.sh, q=line.qty||1;
  if(!svc) return {v:null,basis:'No service line on the shipment file'};
  if(!svc.contractId) return {v:null,basis:'No live contract for this category',code:'R13'};
  switch(line.cls){
    case 'base': {
      var it=svc.items.filter(function(i){return i.code===line.code;})[0];
      return it? {v:it.amt*q,basis:'Contracted '+money(it.amt,svc.cur)+' '+it.basis+' \u00D7 '+q}
               : {v:null,basis:'Not on the contracted rate card'};
    }
    case 'index': {
      var m=sh&&sh.ev.ATD?ym(sh.ev.ATD.at):ym(NOW);
      var ref=(INDEX_REF[m]||INDEX_REF['2026-09'])[line.code];
      return {v:(ref||0)*q,basis:'Published reference for '+m+', '+usd(ref||0)+' \u00D7 '+q};
    }
    case 'tariff': {
      var t=null;
      if(line.code==='THCO') t=TARIFF.THCO[oc.origin];
      else if(line.code==='THCD') t=TARIFF.THCD[oc.destination];
      else if(line.code==='ISPS') t=TARIFF.ISPS._;
      else if(line.code==='DG') t=TARIFF.DG[oc.imo];
      if(t==null){ var it2=svc.items.filter(function(i){return i.code===line.code;})[0]; t=it2?it2.amt:null; }
      return {v:t==null?null:t*q,basis:'Effective tariff '+usd(t||0)+' \u00D7 '+q};
    }
    case 'scope': {
      var na = svc.snapshot?svc.snapshot.notApplicable:(oc?oc.incl:[]);
      var inclusions = svc.cat==='ocean'?oc.incl:na;
      if((inclusions||[]).indexOf(line.code)>=0)
        return {v:0,basis:'Declared as included or not applicable at bid stage',included:true};
      var it3=svc.items.filter(function(i){return i.code===line.code;})[0];
      return it3? {v:it3.amt*q,basis:'Contracted as an excluded charge'}
                : {v:null,basis:'Not declared at bid stage'};
    }
    case 'event': {
      var ck=clockByCode(f,line.code);
      if(!ck||ck.na) return {v:0,basis:'The clock for this charge has not started'};
      return {v:ck.amount,days:ck.charge,
        basis:ck.charge+' chargeable '+ck.unit+'s ('+ck.used+' used, '+ck.free+' free) on the contracted slabs'};
    }
    case 'disb': {
      if(!line.evidence) return {v:null,basis:'No third-party document attached',code:'R11'};
      return {v:line.evidence.amount,basis:'Matched to '+line.evidence.doc};
    }
    case 'handling': {
      var snap=svc.snapshot||{handlingPct:0,handlingCap:0};
      var base=ctx.disbTotal||0;
      var calc=Math.round(base*snap.handlingPct/100);
      var capped=snap.handlingCap?Math.min(calc,snap.handlingCap):calc;
      return {v:capped,cap:snap.handlingCap,
        basis:snap.handlingPct+'% of '+money(base,svc.cur)+' validated disbursements, capped at '+money(snap.handlingCap,svc.cur)};
    }
    case 'statutory': {
      var p=TAX[vend(ctx.inv.vendorId).tax];
      return {v:Math.round((ctx.taxable||0)*p.rate/100),basis:p.n+' recomputed on '+money(ctx.taxable||0,svc.cur)};
    }
    default: return {v:null,basis:'One-off charge, no contracted reference exists'};
  }
}

function runValidation(inv){
  var v=vend(inv.vendorId), res=[], worst='match';
  var dup=S.invoices.filter(function(i){
    return i!==inv&&i.vendorId===inv.vendorId&&i.vendorRef===inv.vendorRef;}).length>0;

  /* validated disbursements first, so the handling fee can be checked against them */
  var disbTotal=0;
  var sameFile=S.invoices.filter(function(x){
    return x.vendorId===inv.vendorId&&x.fileId&&x.fileId===inv.fileId; });
  if(sameFile.indexOf(inv)<0) sameFile.push(inv);
  sameFile.forEach(function(x){ x.lines.forEach(function(l){
    if(l.cls==='disb'&&l.evidence) disbTotal+=Math.min(l.amount,l.evidence.amount); }); });

  var taxable=sum(inv.lines.filter(function(l){
    return l.cls!=='statutory'&&l.cls!=='disb'; }).map(function(l){return l.amount;}));

  inv.lines.forEach(function(l){
    var f=l.fileId?fileOf(l.fileId):(inv.fileId?fileOf(inv.fileId):null);
    var r={code:l.code,desc:l.desc,cls:l.cls,claimed:l.amount,expected:null,basis:'',
           status:'match',reason:null,delta:0,fileId:l.fileId||inv.fileId||null};
    if(!f){ r.status='exception'; r.reason='R14'; r.basis='No shipment file reference on this line';
      res.push(r); worst='exception'; return; }
    var svc=svcOf(f,v.cat), oc=ocOf(f.ocId), sh=shipOfFile(f);
    var ex=expectedFor(l,{file:f,svc:svc,oc:oc,sh:sh,inv:inv,disbTotal:disbTotal,taxable:taxable});
    r.expected=ex.v; r.basis=ex.basis;
    var t=TOL[l.cls]||{p:0,a:0};
    if(ex.v==null){ r.status='exception'; r.reason=ex.code||(l.cls==='oneoff'?'R10':'R01'); }
    else{
      r.delta=l.amount-ex.v;
      var lim=Math.max(t.a,ex.v*t.p/100);
      if(ex.included&&l.amount>0){ r.status='exception'; r.reason='R01'; }
      else if(Math.abs(r.delta)<=0.009) r.status='match';
      else if(Math.abs(r.delta)<=lim) r.status='tolerance';
      else { r.status='exception';
        r.reason = l.cls==='event'?'R05' : l.cls==='handling'?'R12'
                 : l.cls==='statutory'?'R15' : l.cls==='disb'?'R16' : 'R02'; }
    }
    if(l.cls==='event'&&ex.days!=null&&l.days!=null&&l.days>ex.days){ r.status='exception'; r.reason='R05'; }
    if(dup){ r.status='exception'; r.reason='R04'; }
    if(oc&&sh&&sh.ev.ATD&&oc.validTo&&l.cls==='base'&&v.cat==='ocean'
       && new Date(sh.ev.ATD.at)>new Date(oc.validTo)){ r.status='exception'; r.reason='R09'; }
    if(r.status==='exception') worst='exception';
    else if(r.status==='tolerance'&&worst==='match') worst='tolerance';
    res.push(r);
  });

  inv.results=res;
  inv.expectedTotal=sum(res.map(function(r){return r.expected||0;}));
  inv.variance=inv.total-inv.expectedTotal;
  if(['submitted','exception','validating','approved'].indexOf(inv.status)>=0)
    inv.status = worst==='exception'?'exception':'approved';
  if(inv.status==='approved') inv.approvedAmt=inv.total;
  linkInvoice(inv);
  return inv;
}
function exCount(i){ return i.results.filter(function(r){return r.status==='exception';}).length; }
function linkInvoice(inv){
  var ids={}; inv.lines.forEach(function(l){ if(l.fileId) ids[l.fileId]=1; });
  if(inv.fileId) ids[inv.fileId]=1;
  Object.keys(ids).forEach(function(fid){
    var f=fileOf(fid); if(!f) return;
    var svc=svcOf(f,vend(inv.vendorId).cat); if(!svc) return;
    if(svc.invoiceIds.indexOf(inv.id)<0) svc.invoiceIds.push(inv.id);
    if(svc.contractId) svc.status = inv.status==='paid'?'settled':'received';
  });
}
/* completeness: which categories are still awaiting an invoice */
function awaiting(f){
  return f.services.filter(function(s){
    return s.status==='awaited'&&s.items.length>0; }); }
function accrualINR(f){
  return sum(awaiting(f).map(function(s){
    var v=svcExpected(s); return s.cur==='USD'?v*FX:v; })); }

/* ===================== invoice construction ===================== */
function taxOf(inv){
  var p=TAX[vend(inv.vendorId).tax];
  var taxable=sum(inv.lines.filter(function(l){
    return l.cls!=='statutory'&&l.cls!=='disb'; }).map(function(l){return l.amount;}));
  return {profile:p,taxable:taxable,amount:Math.round(taxable*p.rate/100)};
}
function recompute(inv){
  inv.subtotal=sum(inv.lines.map(function(l){return l.amount;}));
  var t=taxOf(inv);
  inv.taxAmount=t.amount; inv.taxRcm=t.profile.rcm;
  inv.total = t.profile.rcm ? inv.subtotal : inv.subtotal+t.amount;
  return inv;
}
function newInvoice(o){
  var inv={id:'INV-'+(S.seq.inv++),type:o.type||'shipment',vendorId:o.vendorId,
    cat:vend(o.vendorId).cat,cur:vend(o.vendorId).cur,vendorRef:o.ref,fileId:o.fileId||null,
    lines:o.lines,status:'submitted',submittedAt:o.at||iso(NOW),results:[],
    docs:o.docs||['Vendor invoice PDF'],approvedAmt:0,paymentId:null,history:[]};
  recompute(inv); S.invoices.push(inv); runValidation(inv); return inv;
}
function linesFromService(f,cat,mods){
  var svc=svcOf(f,cat); if(!svc) return [];
  mods=mods||{};
  return svc.items.filter(function(i){return i.qty>0;}).map(function(i){
    var rate=mods[i.code]!==undefined?mods[i.code]:i.amt;
    return {code:i.code,desc:CH[i.code].l,cls:i.cls,qty:i.qty,rate:rate,
            amount:rate*i.qty,fileId:f.id,days:null,evidence:null};
  });
}
function L(code,amt,fileId,extra){
  var o={code:code,desc:CH[code].l,cls:CH[code].cls,qty:1,rate:amt,amount:amt,
    fileId:fileId,days:null,evidence:null};
  return Object.assign(o,extra||{});
}
</script>
<script>
/* ===================== seeded invoices ===================== */
function seedInvoices(){
  var f1=S.files[0], f2=S.files[1], f3=S.files[2], f4=S.files[3];

  /* --- SF for oc2: clean, fully settled --- */
  var i2a=newInvoice({vendorId:'V4',fileId:f2.id,ref:'BAL-2026-4471',at:iso(addD(NOW,-17)),
    lines:linesFromService(f2,'ocean'),docs:['Vendor invoice PDF','Bill of lading']});
  var i2b=newInvoice({vendorId:'V5',fileId:f2.id,ref:'SCF/26-27/0881',at:iso(addD(NOW,-16)),
    lines:linesFromService(f2,'cha').concat([L('DOCHDL',0,f2.id)]),docs:['Service invoice PDF']});
  var i2c=newInvoice({type:'disbursement',vendorId:'V5',fileId:f2.id,ref:'SCF/DISB/26-27/0881',
    at:iso(addD(NOW,-16)),docs:['Disbursement statement','Port receipts'],
    lines:[L('WHARF',6840,f2.id,{evidence:{doc:'JNPT wharfage receipt 88401',amount:6840}}),
           L('SCAN',2400,f2.id,{evidence:{doc:'Scanning receipt 22119',amount:2400}})]});
  /* handling fee correctly recomputed on the disbursement statement */
  i2b.lines[i2b.lines.length-1].rate=Math.round((6840+2400)*0.05);
  i2b.lines[i2b.lines.length-1].amount=i2b.lines[i2b.lines.length-1].rate;
  recompute(i2b); runValidation(i2b);
  newInvoice({vendorId:'V7',fileId:f2.id,ref:'MLP-26-1190',at:iso(addD(NOW,-15)),

  newInvoice({vendorId:'V9',fileId:f2.id,ref:'KIB-3312',at:iso(addD(NOW,-15)),
    lines:linesFromService(f2,'survey')});

  /* --- SF for oc3: the exception showcase, seven documents --- */
  var oceanLines=linesFromService(f3,'ocean',{BAF:402});      /* index variance */
  oceanLines.push(L('DOC',95,f3.id));                          /* declared included */
  oceanLines.push(L('DEM',7175,f3.id,{days:11}));              /* overclaimed days */
  oceanLines.push(L('RERT',340,f3.id));                        /* one-off, no evidence */
  newInvoice({vendorId:'V3',fileId:f3.id,ref:'CTG-INV-8842',at:iso(addD(NOW,-2)),
    lines:oceanLines,docs:['Vendor invoice PDF','Bill of lading']});

  var chaLines=linesFromService(f3,'cha');
  chaLines.push(L('EXAMAT',1500,f3.id));                       /* examination did happen */
  chaLines.push(L('DOCHDL',4200,f3.id));                       /* above the contracted cap */
  newInvoice({vendorId:'V5',fileId:f3.id,ref:'SCF/26-27/0912',at:iso(addD(NOW,-2)),
    lines:chaLines,docs:['Service invoice PDF']});

  newInvoice({type:'disbursement',vendorId:'V5',fileId:f3.id,ref:'SCF/DISB/26-27/0912',
    at:iso(addD(NOW,-2)),docs:['Disbursement statement'],
    lines:[L('WHARF',9200,f3.id,{evidence:{doc:'Hazira wharfage receipt 51120',amount:9200}}),
           L('EXAMFE',7400,f3.id),                             /* no evidence attached */
           L('PORTDU',3100,f3.id,{evidence:{doc:'Port dues receipt 7741',amount:2800}})]});

  var cfsLines=linesFromService(f3,'cfs');
  var gr=clockByCode(f3,'GRENT');
  cfsLines.push(L('GRENT',gr?gr.amount:0,f3.id,{days:gr?gr.charge:0}));
  newInvoice({vendorId:'V7',fileId:f3.id,ref:'MLP-26-1244',at:iso(addD(NOW,-3)),lines:cfsLines});

  newInvoice({vendorId:'V8',fileId:f3.id,ref:'GTS-8902',at:iso(addD(NOW,-3)),
    lines:linesFromService(f3,'tank')});
  newInvoice({vendorId:'V9',fileId:f3.id,ref:'KIB-3390',at:iso(addD(NOW,-3)),
    lines:linesFromService(f3,'survey')});

  /* --- periodic transport invoice spanning two shipment files --- */
  var per=[];
  [f1,f2,f3].forEach(function(f){
    linesFromService(f,'trans').forEach(function(l){ per.push(l); });
  });
  per.push(L('HALT',42000,f3.id,{days:28}));                    /* overclaimed waiting hours */
  per.push(L('TOLL',2400,f1.id));                              /* declared not applicable */
  newInvoice({type:'periodic',vendorId:'V6',fileId:null,ref:'BRL/AUG26/117',
    at:iso(addD(NOW,-1)),lines:per,docs:['Consolidated invoice','Trip sheets']});

  /* --- SF for oc1: ocean only submitted, everything else still awaited --- */
  newInvoice({vendorId:'V1',fileId:f1.id,ref:'OLL-2026-7719',at:iso(addD(NOW,-1)),
    lines:linesFromService(f1,'ocean'),docs:['Vendor invoice PDF','Bill of lading']});

  /* settle the clean file */
  var clean=S.invoices.filter(function(i){return i.fileId===f2.id&&i.status==='approved';});
  var pay={id:'PAY-'+(S.seq.pay++),at:iso(addD(NOW,-12)),invoiceIds:clean.map(function(i){return i.id;}),
    totalINR:sum(clean.map(function(i){return i.cur==='USD'?i.total*FX:i.total;})),
    status:'posted',ack:'ERP document 5100048821'};
  S.payments.push(pay);
  clean.forEach(function(i){ i.status='paid'; i.paymentId=pay.id; linkInvoice(i); });
}

<script>
/* ===================== shell ===================== */
var NAV_INT=[['overview','Overview'],['bids','Bids'],['contracts','Contracts'],
  ['files','Shipment files'],['tracking','Tracking'],['sla','SLA'],['invoices','Invoices'],
  ['payments','Payments'],['vendors','Vendors'],['analytics','Analytics']];
function navVendor(){
  var v=vend(myVid()), n=[['v_overview','Overview']];
  if(v.cat==='ocean') n.push(['v_rfq','Requests to quote']);
  else n.push(['v_contract','My contract']);

function pushEx(sh,c,t,sev){ sh.exceptions.push({c:c,t:t,at:iso(NOW),sev:sev||'warn'}); }
function nextMilestone(sh){
  for(var i=0;i<MSEQ.length;i++){ var m=MILESTONES[i];
    if(m.ts&&!sh.tsPort) continue;
    if(m.opt&&!sh.ev[m.c]&&Math.random()>0.15) continue;
    if(!sh.ev[m.c]) return m.c; }
  return null;
}
function fireEvent(sh,code,src){
  sh.ev[code]={at:iso(NOW),src:src||'Carrier API'};
  if(code==='ATD') sh.status='intransit';
  if(code==='ATA') sh.status='arrived';
  if(code==='ERT') sh.status='delivered';
  S.invoices.filter(function(i){
    return i.lines.some(function(l){ var f=l.fileId?fileOf(l.fileId):null; return f&&f.shipmentId===sh.id; });
  }).forEach(runValidation);
}
function advanceWorld(){
  NOW=addD(NOW,1);
  S.shipments.forEach(function(sh){
    if(sh.status==='delivered') return;
    var oc=ocOf(sh.ocId), nx=nextMilestone(sh); if(!nx) return;
    var due=sh.ev.ATD?new Date(addD(sh.ev.ATD.at,oc.transit)):null;
    var fire = (nx==='ATA'||nx==='DIS') ? (due&&NOW>=due) : Math.random()<0.55;
    if(fire) fireEvent(sh,nx,'Carrier API');
    var f=fileOfOC(sh.ocId);
    clocksFor(f).forEach(function(ck){
      if(ck.running&&ck.charge>0&&!sh.exceptions.filter(function(e){return e.c===ck.key;}).length)
        pushEx(sh,ck.key,ck.name+' free allowance exceeded',ck.key==='dem'||ck.key==='det'?'bad':'warn');
    });
  });
  S.invoices.forEach(function(i){ if(i.status!=='paid') runValidation(i); });
  render(); toast('Advanced to '+fdate(NOW),'Events fired and every clock recomputed.');
}

    var sp=lo/quoteTotal(q)*100, st=lt/q.transit*100, ss=vend(q.vendorId).sc.sla;

    commodity:val('bc'),imo:val('bm'),un:val('bu'),pkg:val('bpk'),weight:numval('bw'),special:val('bs'),

      '<td>'+(c.scope==='global'?'All plants':c.scope==='ports'?(c.ports||[]).map(pn).join(', '):c.scope==='port'?'Port '+c.port:'Plant and port')+'</td>'+

};

     '<td>'+tag('grey',CLSNAME[CH[l.code].cls])+'</td><td class="small">'+esc(l.basis)+'</td>'+
     '<td class="num">'+money(l.amt,c.cur)+'</td></tr>';}).join('')+'</tbody></table></div></div>'+
   '<div class="card"><h3>Allowances, handling and exclusions</h3><div class="pad">'+
   (Object.keys(c.free).length?'<p class="small muted">Free allowances, which drive the event-derived charges.</p>'+
     '<div class="tw mt8"><table><thead><tr><th>Clock</th><th class="num">Free</th><th>Slabs</th></tr></thead><tbody>'+
     Object.keys(c.free).map(function(k){
       return '<tr><td>'+CLOCKS[k].n+'</td><td class="num">'+c.free[k]+' '+CLOCKS[k].unit+'s</td>'+
        '<td class="small">'+(c.slabs[k]||[]).map(function(s){
          return (s.t>900?s.f+'+':s.f+'\u2013'+s.t)+' at '+money(s.r,c.cur);}).join(', ')+'</td></tr>';
     }).join('')+'</tbody></table></div>':'<p class="small muted">No free allowances under this contract.</p>')+
   '<div class="hr"></div>'+
   (c.handlingPct?'<p class="small muted">Disbursement handling: <b>'+c.handlingPct+'%</b> of validated '+
     'third-party costs, capped at <b>'+inr(c.handlingCap)+'</b> per shipment. Anything above the cap is rejected as R12.</p>'
     :'<p class="small muted">This vendor does not pass through third-party disbursements.</p>')+
   '<div class="hr"></div><p class="small muted">Declared not applicable at tender \u2014 these are rejected '+
   'automatically if they appear on an invoice.</p><div class="row mt8" style="flex-wrap:wrap">'+
   (c.notApplicable.length?c.notApplicable.map(function(x){return tag('ok',CH[x].l);}).join(' ')
     :'<span class="muted small">Nothing declared.</span>')+'</div>'+
   '<div class="hr"></div><p class="small muted">Tax profile: <b>'+TAX[vend(c.vendorId).tax].n+'</b>'+
   (TAX[vend(c.vendorId).tax].rcm?' \u2014 payable by Gulbrandsen under reverse charge, not to the vendor.':'')+
   '</p></div></div></div>';
  html+='<div class="card mt"><h3>Shipment files using this contract</h3><div class="tw"><table><thead><tr>'+
   '<th>File</th><th>Lane</th><th class="num">Snapshotted value</th><th>Invoice status</th></tr></thead><tbody>'+
   (used.length?used.map(function(f){ var s=svcOf(f,c.cat);
     return '<tr class="clk" onclick="go(\'files:'+f.id+'\')"><td><b>'+f.id+'</b></td>'+
      '<td>'+pn(f.origin)+' \u2192 '+pn(f.destination)+'</td>'+
      '<td class="num">'+money(svcExpected(s),s.cur)+'</td><td>'+stag(s.status)+'</td></tr>';
   }).join(''):'<tr><td colspan="4" class="empty">Not yet used.</td></tr>')+'</tbody></table></div></div>';
  $('view').innerHTML=html;
}
</script>
<script>
/* ===================== shipment files ===================== */
VIEWS.files=function(id){
  if(id) return fileDetail(id);
  renderTop('Shipment files','One file per consignment, binding the ocean order to every service contract');
  $('view').innerHTML='<div class="card"><div class="tw"><table><thead><tr><th>File</th><th>Plant</th>'+
   '<th>Lane</th><th class="num">Qty</th><th class="num">Expected cost</th><th>Services</th>'+
   '<th class="num">Awaited</th><th class="num">Accrual</th><th>Shipment</th></tr></thead><tbody>'+
   S.files.map(function(f){
     var act=f.services.filter(function(s){return s.items.length>0;});
     var unc=f.services.filter(function(s){return s.status==='uncontracted';}).length;
     return '<tr class="clk" onclick="go(\'files:'+f.id+'\')"><td><b>'+f.id+'</b><br>'+
      '<span class="tiny muted">'+f.ocId+'</span></td><td>'+esc(PLANTS[f.plant].n)+'</td>'+
      '<td>'+pn(f.origin)+' \u2192 '+pn(f.destination)+'</td><td class="num">'+f.qty+'</td>'+
      '<td class="num">'+inr(fileExpectedINR(f))+'</td>'+
      '<td>'+act.length+' of 6'+(unc?' '+tag('bad',unc+' uncontracted'):'')+'</td>'+
      '<td class="num">'+awaiting(f).length+'</td>'+
      '<td class="num">'+(accrualINR(f)?inr(accrualINR(f)):'\u2014')+'</td>'+
      '<td>'+(f.shipmentId?f.shipmentId:'<span class="muted">not booked</span>')+'</td></tr>';
   }).join('')+'</tbody></table></div></div>'+
   '<div class="card mt"><h3>How the expected cost is built</h3><div class="pad small muted">'+
   'On award, the ocean rate card and every applicable annual contract are snapshotted onto the file. '+
   'A contract renegotiated later does not retrospectively change how an earlier invoice was judged. '+
   'Ocean values are converted at a single reference rate of '+FX+' INR per USD.</div></div>';
};
function fileDetail(id){
  var f=fileOf(id); if(!f) return go('files');
  var oc=ocOf(f.ocId), sh=shipOfFile(f), sla=find(SLA_PROFILES,oc.slaId);
  renderTop(f.id,'Shipment file \u00B7 '+esc(PLANTS[f.plant].n)+' \u2192 '+pn(f.destination),
    '<button class="btn" onclick="go(\'files\')">Back</button>'+
    (sh?' <button class="btn pri" onclick="go(\'tracking:'+sh.id+'\')">Track '+sh.id+'</button>':''));

  var invs=S.invoices.filter(function(i){
    return i.fileId===f.id||i.lines.some(function(l){return l.fileId===f.id;}); });
  var claimed=sum(invs.map(function(i){
    var v=sum(i.lines.filter(function(l){return l.fileId===f.id;}).map(function(l){return l.amount;}));
    return i.cur==='USD'?v*FX:v; }));

  var m=function(v,l,d){ return '<div class="card metric"><div class="pad"><div class="v">'+v+'</div>'+
    '<div class="l">'+l+'</div>'+(d?'<div class="d muted">'+d+'</div>':'')+'</div></div>'; };
  var html='<div class="grid g4">'+
   m(inr(fileExpectedINR(f)),'Expected landed cost','Ocean plus every contracted service')+
   m(inr(claimed),'Claimed so far',invs.length+' invoice'+(invs.length===1?'':'s')+' received')+
   m(awaiting(f).length,'Categories still awaited',accrualINR(f)?inr(accrualINR(f))+' accrued':'Nothing outstanding')+
   m(f.qty+' \u00D7 '+f.equip.replace('20 ',''),'Equipment',esc(f.commodity))+'</div>';

  html+='<div class="card mt"><h3>Expected cost sheet <span class="sub">snapshotted at award</span></h3>'+
   '<div class="tw"><table><thead><tr><th>Category</th><th>Vendor</th><th>Source</th>'+
   '<th class="num">Lines</th><th class="num">Expected</th><th class="num">In INR</th>'+
   '<th>Invoices</th><th>Status</th></tr></thead><tbody>'+
   f.services.map(function(s){
     var e=svcExpected(s), einr=s.cur==='USD'?e*FX:e;
     return '<tr'+(s.contractId?' class="clk" onclick="go(\''+
       (s.contractType==='order'?'files:'+f.id:'contracts:'+s.contractId)+'\')"':'')+'>'+
      '<td><b>'+CAT[s.cat].n+'</b></td>'+
      '<td>'+(s.vendorId?esc(vend(s.vendorId).name):'<span style="color:var(--bad)">none appointed</span>')+'</td>'+
      '<td class="tiny mono">'+(s.contractId||'\u2014')+'</td>'+
      '<td class="num">'+s.items.length+'</td>'+
      '<td class="num">'+(s.items.length?money(e,s.cur):'\u2014')+'</td>'+
      '<td class="num">'+(s.items.length?inr(einr):'\u2014')+'</td>'+
      '<td class="tiny">'+(s.invoiceIds.length?s.invoiceIds.join(', '):'<span class="muted">\u2014</span>')+'</td>'+
      '<td>'+stag(s.status)+'</td></tr>';
   }).join('')+
   '<tr style="background:#F4F7FA"><td colspan="5"><b>Expected landed cost</b></td>'+
   '<td class="num"><b>'+inr(fileExpectedINR(f))+'</b></td><td colspan="2"></td></tr>'+
   '</tbody></table></div></div>';

  html+='<div class="grid g2 mt">'+
   '<div class="card"><h3>Ocean rate card <span class="sub">'+esc(vend(oc.vendorId).name)+'</span></h3>'+
   '<div class="tw"><table><thead><tr><th>Code</th><th>Charge</th><th>Class</th>'+
   '<th class="num">Per container</th></tr></thead><tbody>'+
   oc.rateCard.map(function(r){ return '<tr><td class="mono">'+r.code+'</td><td>'+esc(CH[r.code].l)+'</td>'+
     '<td>'+tag('grey',CLSNAME[r.cls])+'</td><td class="num">'+usd(r.amt)+'</td></tr>';}).join('')+
   '</tbody></table></div>'+
   '<div class="pad" style="border-top:1px solid var(--line2)">'+
   '<p class="small muted">Included in the ocean rate, so rejected if invoiced.</p>'+
   '<div class="row mt8" style="flex-wrap:wrap">'+(oc.incl.length?oc.incl.map(function(c){
     return tag('ok',CH[c].l);}).join(' '):'<span class="muted small">none</span>')+'</div>'+
   '<p class="small muted mt">Free time: <b>'+oc.ftDem+' days demurrage</b>, <b>'+oc.ftDet+
   ' days detention</b>. Separate clocks, separate allowances.</p></div></div>'+

   '<div class="card"><h3>Clocks on this file</h3><div class="tw"><table><thead><tr><th>Clock</th>'+
   '<th>Owner</th><th class="num">Used</th><th class="num">Free</th><th class="num">Chargeable</th>'+
   '<th class="num">Accrued</th></tr></thead><tbody>'+
   (sh?clocksFor(f).map(function(c){
     var cat=CLOCKS[c.key].cat, s=svcOf(f,cat);
     return '<tr><td>'+c.name+'</td><td class="small">'+CAT[cat].n+'</td>'+
      '<td class="num">'+(c.na?'\u2014':c.used+' '+c.unit+'s')+'</td>'+
      '<td class="num">'+c.free+'</td>'+
      '<td class="num" style="color:'+(c.charge>0?'var(--bad)':'var(--muted)')+'">'+
       (c.na?'\u2014':c.charge)+'</td>'+
      '<td class="num">'+(c.na?'\u2014':money(c.amount,s.cur))+
      (c.running?' <span class="tiny muted">running</span>':'')+'</td></tr>';
   }).join(''):'<tr><td colspan="6" class="empty">No shipment booked yet.</td></tr>')+
   '</tbody></table></div></div></div>';

  if(invs.length){
    html+='<div class="card mt"><h3>Invoices against this file</h3><div class="tw"><table><thead><tr>'+
     '<th>Invoice</th><th>Type</th><th>Vendor</th><th>Reference</th><th class="num">Claimed</th>'+
     '<th class="num">Authorised</th><th class="num">Variance</th><th>Status</th></tr></thead><tbody>'+
     invs.map(function(i){
       var cl=sum(i.lines.filter(function(l){return l.fileId===f.id;}).map(function(l){return l.amount;}));
       var ex=sum(i.results.filter(function(r){return r.fileId===f.id;}).map(function(r){return r.expected||0;}));
       return '<tr class="clk" onclick="go(\'invoices:'+i.id+'\')"><td><b>'+i.id+'</b></td>'+
        '<td>'+tag('grey',i.type)+'</td><td>'+esc(vend(i.vendorId).name)+'</td>'+
        '<td class="mono tiny">'+esc(i.vendorRef)+'</td>'+
        '<td class="num">'+money(cl,i.cur)+'</td><td class="num">'+money(ex,i.cur)+'</td>'+
        '<td class="num" style="color:'+(cl-ex>1?'var(--bad)':'var(--muted)')+'">'+
        (cl-ex>0?'+':'')+money(cl-ex,i.cur)+'</td><td>'+stag(i.status)+'</td></tr>';
     }).join('')+'</tbody></table></div></div>';
  }
  if(awaiting(f).length){
    html+='<div class="card mt"><h3>Still awaited <span class="sub">accrued for month-end close</span></h3>'+
     '<div class="tw"><table><thead><tr><th>Category</th><th>Vendor</th><th class="num">Accrual</th>'+
     '<th class="num">Days since award</th></tr></thead><tbody>'+
     awaiting(f).map(function(s){
       var e=svcExpected(s);
       return '<tr><td>'+CAT[s.cat].n+'</td><td>'+(s.vendorId?esc(vend(s.vendorId).name):'\u2014')+'</td>'+
        '<td class="num">'+money(e,s.cur)+'</td>'+
        '<td class="num">'+Math.round(days(f.createdAt,iso(NOW)))+'</td></tr>';
     }).join('')+'</tbody></table></div></div>';
  }
  $('view').innerHTML=html;
}

/* ===================== tracking ===================== */
VIEWS.tracking=function(id){
  if(id) return shipDetail(id);
  renderTop('Tracking','Origin through destination \u00B7 carrier API, ICEGATE and vendor portal',
    '<input class="i" id="shq" placeholder="Booking, MBL, HBL or container" style="width:250px" '+
    'oninput="S.shipQ=this.value;render()" value="'+esc(S.shipQ||'')+'">');
  var q=(S.shipQ||'').toLowerCase(), f=S.shipFilter;
  var list=S.shipments.filter(function(s){
    if(f==='live'&&s.status==='delivered') return false;
    if(f==='ex'&&!s.exceptions.length) return false;
    if(!q) return true;
    return (s.booking+' '+s.mbl+' '+s.hbl+' '+s.id+' '+
      s.containers.map(function(c){return c.no;}).join(' ')).toLowerCase().indexOf(q)>=0; });
  var seg=[['all','All'],['live','In flight'],['ex','With exceptions']].map(function(k){
    return '<button class="'+(f===k[0]?'on':'')+'" onclick="S.shipFilter=\''+k[0]+'\';render()">'+k[1]+'</button>';
  }).join('');
  $('view').innerHTML='<div class="filters"><div class="seg">'+seg+'</div>'+
   '<span class="muted small">'+list.length+' shipments</span></div>'+
   '<div class="card"><div class="tw"><table><thead><tr><th>Shipment</th><th>File</th><th>Lane</th>'+
   '<th>Carrier / vessel</th><th>Departed</th><th>Arrival</th><th class="num">Delay</th>'+
   '<th>Last event</th><th>Clocks</th></tr></thead><tbody>'+
   (list.length?list.map(function(s){
     var oc=ocOf(s.ocId), fl=fileOfOC(s.ocId), e=etaInfo(s);
     var run=clocksFor(fl).filter(function(c){return !c.na&&c.running;});
     return '<tr class="clk" onclick="go(\'tracking:'+s.id+'\')"><td><b>'+s.id+'</b><br>'+
      '<span class="tiny muted mono">'+esc(s.mbl)+'</span></td><td>'+fl.id+'</td>'+
      '<td>'+pn(s.origin)+' \u2192 '+pn(s.destination)+
       (s.tsPort?'<br><span class="tiny muted">via '+pn(s.tsPort)+'</span>':'')+'</td>'+
      '<td>'+esc(s.carrier)+'<br><span class="tiny muted">'+esc(s.vessel)+' '+esc(s.voyage)+'</span></td>'+
      '<td>'+(s.ev.ATD?fdate(s.ev.ATD.at):'<span class="muted">'+fdate(s.etd)+' plan</span>')+'</td>'+
      '<td>'+(s.ev.ATA?fdate(s.ev.ATA.at):fdate(e.actual)+' <span class="tiny muted">predicted</span>')+'</td>'+
      '<td class="num" style="color:'+(e.delay>0?'var(--bad)':'var(--ok)')+'">'+
       (e.delay>0?'+':'')+e.delay+' d</td>'+
      '<td>'+stageOf(s)+'</td>'+
      '<td>'+(run.length?run.map(function(c){return tag(c.charge>0?'bad':'ok',
        c.name.split(' ').slice(-1)[0]);}).join(' '):'<span class="muted tiny">none</span>')+'</td></tr>';
   }).join(''):'<tr><td colspan="9" class="empty"><b>Nothing matches</b>Try a booking, MBL or container number.</td></tr>')+
   '</tbody></table></div></div>';
};
function etaInfo(s){
  var oc=ocOf(s.ocId);
  var promised=s.ev.ATD?addD(s.ev.ATD.at,oc.transit):new Date(s.eta);
  var actual=s.ev.ATA?new Date(s.ev.ATA.at):new Date(s.eta);
  return {promised:promised,actual:actual,delay:Math.round(days(promised,actual))};
}
function shipDetail(id){
  var s=find(S.shipments,id); if(!s) return go('tracking');
  var f=fileOfOC(s.ocId), oc=ocOf(s.ocId), sla=find(SLA_PROFILES,oc.slaId), e=etaInfo(s);
  renderTop(s.id,'Tracking \u00B7 '+plabel(s.origin)+' \u2192 '+plabel(s.destination),

      '<td>'+(c.na?tag('grey','not started'):c.running?tag('warn','running'):tag('ok','closed'))+'</td></tr>';
   }).join('')+'</tbody></table></div></div>';

  html+='<div class="grid g2 mt">'+
   '<div class="card"><h3>Milestones <span class="sub">origin through destination</span></h3>'+

function journeyRail(s){
  var seq=MSEQ.filter(function(c){ var m=MILESTONES.filter(function(x){return x.c===c;})[0];
    return !(m.ts&&!s.tsPort)&&!(m.opt&&!s.ev[c])&&['TANKREL','DEPPLT','ARRCFS','LEO','GIN','ATD','TSL','ATA','DIS','GOU','ERT'].indexOf(c)>=0; });
  var done=seq.filter(function(c){return s.ev[c];}).length;
  var prog=seq.length>1?Math.max(0,done-1)/(seq.length-1)*100:0;
  var nodes=seq.map(function(c){ var ev=s.ev[c];
    return '<div style="flex:1;min-width:62px;text-align:center">'+
     '<div style="height:11px;display:flex;align-items:center;justify-content:center">'+
     '<span style="width:11px;height:11px;border-radius:50%;background:'+(ev?'var(--ok)':'var(--line)')+
     ';border:2px solid #fff;box-shadow:0 0 0 1px '+(ev?'var(--ok)':'var(--line)')+'"></span></div>'+
     '<div class="tiny" style="margin-top:6px;color:'+(ev?'var(--ink)':'var(--faint)')+';font-weight:'+
     (ev?'600':'400')+'">'+esc(msName(c).replace(' at origin','').replace(' at destination','')
       .replace('Transhipment ','T/S ').replace('Let Export Order','LEO'))+'</div>'+
     '<div class="tiny muted">'+(ev?fdate(ev.at):'\u2014')+'</div></div>';}).join('');
  return '<div style="position:relative;padding:4px 0 2px">'+
   '<div style="position:absolute;left:5%;right:5%;top:9px;height:2px;background:var(--line)"></div>'+
   '<div style="position:absolute;left:5%;top:9px;height:2px;background:var(--ok);width:'+(prog*0.9)+'%"></div>'+
   '<div style="display:flex;position:relative">'+nodes+'</div></div>'+
   '<div class="spread mt" style="border-top:1px solid var(--line2);padding-top:12px">'+
   '<div class="small"><b>'+esc(PLANTS[fileOfOC(s.ocId).plant].n)+'</b> \u2192 <b>'+pn(s.origin)+'</b>'+
   (s.tsPort?' <span class="muted">via '+pn(s.tsPort)+'</span>':'')+' \u2192 <b>'+pn(s.destination)+'</b></div>'+
   '<div class="small muted">Origin events from the vendor portal and ICEGATE, ocean events on the DCSA model</div></div>';
}
function slaRows(s,oc,sla){
  var out=[];
  function r(n,t,a,ok,u){ out.push('<tr><td>'+n+'</td><td class="num">'+t+(u||'')+'</td>'+
    '<td class="num">'+(a==null?'<span class="muted">pending</span>':a+(u||''))+'</td>'+
    '<td>'+(a==null?tag('grey','not measurable yet'):ok?tag('ok','met'):tag('bad','breached'))+'</td></tr>'); }
  var bkg=s.ev.BKG?Math.round(days(ocOf(s.ocId).issuedAt,s.ev.BKG.at)*24):null;
  r('Booking confirmation',sla.t.bkgTat,bkg,bkg!=null&&bkg<=sla.t.bkgTat,' h');
  var pl=(s.ev.BKG&&s.ev.VEHPLC)?days(s.ev.BKG.at,s.ev.VEHPLC.at):null;
  r('Container placement',sla.t.placement,pl,pl!=null&&pl<=sla.t.placement,' d');
  var p2p=(s.ev.ATD&&s.ev.ATA)?days(s.ev.ATD.at,s.ev.ATA.at):null;
  r('Port-to-port transit',sla.t.p2p,p2p,p2p!=null&&p2p<=sla.t.p2p+sla.tol.p2p,' d');
  var d2d=(s.ev.DEPPLT&&s.ev.GOU)?days(s.ev.DEPPLT.at,s.ev.GOU.at):null;
  r('Door-to-door transit',sla.t.d2d,d2d,d2d!=null&&d2d<=sla.t.d2d+sla.tol.d2d,' d');
  var vsc=vend(ocOf(s.ocId).vendorId).sc.doc;
  var doc=s.ev.ATD?(vsc>90?2:vsc>80?4:6):null;
  r('Document turnaround',sla.t.docTat,doc,doc!=null&&doc<=sla.t.docTat,' d');
  var need=MILESTONES.filter(function(m){return !(m.ts&&!s.tsPort)&&!m.opt;}).length;
  var mc=s.status==='delivered'?Math.round(Object.keys(s.ev).length/need*100):null;
  r('Milestone compliance',sla.t.milestone,mc,mc!=null&&mc>=sla.t.milestone,'%');
  return out.join('');
}
function simNext(id){
  var s=find(S.shipments,id), nx=nextMilestone(s);
  if(!nx) return toast('Shipment complete','Every milestone has been received.');
  var m=MILESTONES.filter(function(x){return x.c===nx;})[0];
  fireEvent(s,nx,m.own==='ocean'?'Carrier API':(m.own==='cha'?'ICEGATE':'Vendor portal'));
  render(); toast(m.n,'Recorded against '+s.mbl+'. Clocks recomputed.');
}

     var p2p=(s.ev.ATD&&s.ev.ATA)?days(s.ev.ATD.at,s.ev.ATA.at):null;
     return '<tr class="clk" onclick="go(\'tracking:'+s.id+'\')"><td><b>'+s.id+'</b></td>'+
      '<td>'+pn(s.origin)+' \u2192 '+pn(s.destination)+'</td><td>'+esc(vend(oc.vendorId).name)+'</td>'+
      '<td>'+sl.id+'</td><td class="num">'+oc.transit+' d</td>'+
      '<td class="num">'+sl.t.p2p+' \u00B1'+sl.tol.p2p+'</td>'+
      '<td class="num">'+(p2p==null?'<span class="muted">in transit</span>':p2p+' d')+'</td>'+
      '<td>'+(p2p==null?tag('grey','pending'):p2p<=sl.t.p2p+sl.tol.p2p?tag('ok','met'):tag('bad','breached'))+
      '</td></tr>';}).join('')+'</tbody></table></div></div>'+
   '<div class="card mt"><h3>Milestone update compliance by vendor category</h3><div class="tw"><table>'+
   '<thead><tr><th>Category</th><th>Vendor</th><th class="num">Events owned</th>'+

   CATS.map(function(cat){
     var owned=MILESTONES.filter(function(m){return m.own===cat&&!m.opt;});
     var tot=0, got=0;
     S.shipments.forEach(function(s){ owned.forEach(function(m){
       if(m.ts&&!s.tsPort) return; tot++; if(s.ev[m.c]) got++; }); });
     var v=S.vendors.filter(function(x){return x.cat===cat;});
     if(!tot) return '';
     var p=Math.round(got/tot*100);
     return '<tr><td><b>'+CAT[cat].n+'</b></td><td class="small">'+
      (cat==='ocean'?'various':esc(v[0].name))+'</td>'+

     return '<tr><td><b>'+CLSNAME[k]+'</b></td><td class="small">'+CLSRULE[k]+'</td></tr>';}).join('')+
   '</tbody></table></div></div>'+
   '<div class="card mt"><h3>Reason codes</h3><div class="pad row" style="flex-wrap:wrap;gap:7px">'+

      (line.evidence?'<br><span class="tiny muted">'+esc(line.evidence.doc)+'</span>':'')+'</td>'+
      '<td class="tiny">'+(r.fileId||'\u2014')+'</td>'+

function evidencePack(i){
  var out=[];
  i.lines.forEach(function(l,ix){
    var r=i.results[ix];
    if(l.cls==='event'){
      var f=fileOf(l.fileId||i.fileId), ck=f?clockByCode(f,l.code):null;
      if(ck&&!ck.na) out.push('<div class="mb"><b>'+CH[l.code].l+'</b><dl class="kv mt8">'+
        [['Clock starts',msName(CLOCKS[ck.key].from)+' \u00B7 '+fdate(ck.from)],
         ['Clock stops',(ck.running?'still running':msName(CLOCKS[ck.key].to)+' \u00B7 '+fdate(ck.to))],
         [ck.unit==='hour'?'Hours used':'Days used',ck.used],
         ['Free allowance',ck.free],['Chargeable',ck.charge],
         ['Computed on slabs',money(ck.amount,i.cur)],
         ['Claimed',money(l.amount,i.cur)]]
        .map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>';}).join('')+'</dl></div>');
    }
    if(l.cls==='disb'){
      out.push('<div class="mb"><b>'+CH[l.code].l+'</b><dl class="kv mt8">'+
        [['Third-party document',l.evidence?l.evidence.doc:'not attached'],
         ['Document value',l.evidence?money(l.evidence.amount,i.cur):'\u2014'],
         ['Claimed',money(l.amount,i.cur)],
         ['Result',r.status==='match'?'matches the attached document':REASONS[r.reason]||'variance']]
        .map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>';}).join('')+'</dl></div>');
    }
    if(l.cls==='handling'){
      out.push('<div class="mb"><b>'+CH[l.code].l+'</b><p class="small muted mt8">'+esc(r.basis)+
        '. Claimed '+money(l.amount,i.cur)+'.</p></div>');
    }
  });
  return out.length?out.join('<div class="hr"></div>')
    :'<div class="empty">No event-derived or disbursement lines on this invoice.</div>';
}

function makePayment(){
  var ids=[].slice.call(document.querySelectorAll('.paysel:checked')).map(function(e){return e.value;});
  if(!ids.length) return toast('Select at least one invoice');
  var tot=sum(ids.map(function(id){ var i=find(S.invoices,id);
    return i.cur==='USD'?i.approvedAmt*FX:i.approvedAmt; }));
  var p={id:'PAY-'+(S.seq.pay++),at:iso(NOW),invoiceIds:ids,totalINR:tot,status:'posted',
    ack:'ERP document 51000'+(48830+S.payments.length)};
  S.payments.push(p);
  ids.forEach(function(id){ var i=find(S.invoices,id); i.status='paid'; i.paymentId=p.id; linkInvoice(i); });
  render(); toast('Payment file posted',p.id+' \u00B7 '+inr(tot)+' delivered to the ERP.');
}

/* ===================== analytics ===================== */
VIEWS.analytics=function(){
  renderTop('Analytics','Outcomes rather than processing statistics');
  var stp=S.invoices.length?S.invoices.filter(function(i){return exCount(i)===0;}).length/S.invoices.length*100:0;
  var recov=sum(S.invoices.map(function(i){
    var v=i.results.filter(function(r){return r.status==='exception';})
      .reduce(function(a,r){return a+Math.max(0,r.delta);},0);
    return i.cur==='USD'?v*FX:v; }));
  var spend=sum(S.invoices.map(function(i){
    return i.cur==='USD'?i.expectedTotal*FX:i.expectedTotal; }));
  var clockTot=sum(S.files.map(function(f){
    return sum(clocksFor(f).map(function(c){
      var s=svcOf(f,CLOCKS[c.key].cat); return s.cur==='USD'?c.amount*FX:c.amount; })); }));
  var covered=0, total=0;
  S.files.forEach(function(f){ f.services.forEach(function(s){
    total++; if(s.contractId) covered++; }); });
  var m=function(v,l,d){ return '<div class="card metric"><div class="pad"><div class="v">'+v+'</div>'+
    '<div class="l">'+l+'</div>'+(d?'<div class="d muted">'+d+'</div>':'')+'</div></div>'; };
  var html='<div class="grid g4">'+
   m(pct(stp),'Straight-through processing','No human intervention')+
   m(inr(recov),'Recovery value','Charges rejected against contract')+
   m(pct(covered/total*100),'Contract coverage','Service lines with a live rate card')+
   m(inr(clockTot),'Event-derived charges','Across all five clocks')+'</div>';

  html+='<div class="grid g2 mt">'+
   '<div class="card"><h3>Spend by service category</h3><div class="tw"><table><thead><tr>'+
   '<th>Category</th><th class="num">Expected</th><th class="num">Claimed</th><th class="num">Variance</th>'+
   '<th class="num">Share</th></tr></thead><tbody>'+
   CATS.map(function(cat){
     var exp=sum(S.files.map(function(f){ var s=svcOf(f,cat); if(!s) return 0;
       var v=svcExpected(s); return s.cur==='USD'?v*FX:v; }));
     var cl=sum(S.invoices.filter(function(i){return i.cat===cat;}).map(invINR));
     var tot2=sum(S.files.map(fileExpectedINR));
     return '<tr><td><b>'+CAT[cat].n+'</b></td><td class="num">'+inr(exp)+'</td>'+
      '<td class="num">'+inr(cl)+'</td>'+
      '<td class="num" style="color:'+(cl>exp+1?'var(--bad)':'var(--muted)')+'">'+
       (cl?(cl-exp>0?'+':'')+inr(cl-exp):'\u2014')+'</td>'+
      '<td class="num">'+pct(exp/tot2*100)+'</td></tr>';
   }).join('')+'</tbody></table></div></div>'+
   '<div class="card"><h3>Exception reasons</h3><div class="tw"><table><thead><tr><th>Code</th>'+
   '<th>Reason</th><th class="num">Hits</th><th class="num">Value</th></tr></thead><tbody>'+
   Object.keys(REASONS).map(function(k){
     var hits=[]; S.invoices.forEach(function(i){ i.results.forEach(function(r){
       if(r.reason===k) hits.push({r:r,cur:i.cur}); }); });
     if(!hits.length) return '';
     return '<tr><td class="mono">'+k+'</td><td class="small">'+REASONS[k]+'</td>'+
      '<td class="num">'+hits.length+'</td><td class="num">'+
      inr(sum(hits.map(function(h){ var v=Math.max(0,h.r.delta); return h.cur==='USD'?v*FX:v; })))+
      '</td></tr>';
   }).join('')+'</tbody></table></div></div></div>';

  html+='<div class="card mt"><h3>Invoice completeness across all files</h3><div class="tw"><table>'+
   '<thead><tr><th>Category</th><th class="num">Expected invoices</th><th class="num">Received</th>'+
   '<th class="num">Outstanding</th><th class="num">Accrued</th></tr></thead><tbody>'+
   CATS.map(function(cat){
     var exp=0,got=0,acc=0;
     S.files.forEach(function(f){ var s=svcOf(f,cat); if(!s||!s.items.length) return;
       exp++; if(s.status!=='awaited') got++; else acc+=s.cur==='USD'?svcExpected(s)*FX:svcExpected(s); });
     return '<tr><td><b>'+CAT[cat].n+'</b></td><td class="num">'+exp+'</td><td class="num">'+got+'</td>'+
      '<td class="num">'+(exp-got)+'</td><td class="num">'+(acc?inr(acc):'\u2014')+'</td></tr>';
   }).join('')+'</tbody></table></div></div>';
  $('view').innerHTML=html;
};

<script>
/* ============ v2.1 — actual GST, payment terms, approval matrix ============ */
var STATES=['Gujarat','Maharashtra','Delhi','Tamil Nadu','Karnataka','Outside India'];
var GULBRANDSEN_STATE='Gujarat';          /* place of supply for all three plants */
var GST_RATES={service:18,gta:5,exempt:0};
var APPROVAL_MATRIX=[
  {upto:50000,role:'Logistics operations'},
  {upto:500000,role:'Finance'},
  {upto:1e12,role:'Finance head'}
];
function approverFor(inr_){ for(var i=0;i<APPROVAL_MATRIX.length;i++)
  if(inr_<=APPROVAL_MATRIX[i].upto) return APPROVAL_MATRIX[i].role; return 'Finance head'; }
function roleOf(u){ return u.role; }

var VENDOR_STATE={V1:'Maharashtra',V2:'Maharashtra',V3:'Gujarat',V4:'Maharashtra',
  V5:'Gujarat',V6:'Gujarat',V7:'Gujarat',V8:'Gujarat',V9:'Gujarat'};
var VENDOR_TERMS={V1:30,V2:30,V3:45,V4:30,V5:15,V6:30,V7:15,V8:30,V9:30};

/* GST resolved by place of supply. Gulbrandsen's plants are in Gujarat, so a Gujarat
   vendor is intra-state (CGST + SGST) and anyone else is inter-state (IGST). */
function taxBreak(inv){
  var v=vend(inv.vendorId);
  var taxable=sum(inv.lines.filter(function(l){
    return l.cls!=='statutory'&&l.cls!=='disb'; }).map(function(l){return l.amount;}));
  var out={taxable:taxable,components:[],total:0,rcm:false,note:''};
  if(v.tax==='export_zero'){
    out.note='Export of service, zero rated. No GST charged.'; return out; }
  if(v.tax==='gta5'){
    out.rcm=true; out.total=Math.round(taxable*GST_RATES.gta/100);
    out.components.push({label:'IGST 5% (reverse charge)',rate:5,amount:out.total});
    out.note='Goods transport agency. Tax is paid directly by Gulbrandsen under reverse charge and withheld from the vendor.';
    return out; }
  var rate=GST_RATES.service;
  if((v.state||VENDOR_STATE[v.id])===GULBRANDSEN_STATE){
    var half=Math.round(taxable*rate/200);
    out.components.push({label:'CGST '+(rate/2)+'%',rate:rate/2,amount:half});
    out.components.push({label:'SGST '+(rate/2)+'%',rate:rate/2,amount:half});
    out.total=half*2; out.note='Intra-state supply, both vendor and place of supply in '+GULBRANDSEN_STATE+'.';
  } else {
    out.total=Math.round(taxable*rate/100);
    out.components.push({label:'IGST '+rate+'%',rate:rate,amount:out.total});
    out.note='Inter-state supply, vendor registered in '+(v.state||'another state')+'.';
  }
  return out;
}
function taxOf(inv){ var t=taxBreak(inv);
  return {profile:{n:t.components.map(function(c){return c.label;}).join(' + ')||'Zero rated',
    rate:0,rcm:t.rcm},taxable:t.taxable,amount:t.total,break:t}; }
function recompute(inv){
  inv.subtotal=sum(inv.lines.map(function(l){return l.amount;}));
  var t=taxBreak(inv);
  inv.taxAmount=t.total; inv.taxRcm=t.rcm; inv.taxBreak=t;
  inv.total=t.rcm?inv.subtotal:inv.subtotal+t.total;
  var v=vend(inv.vendorId);
  inv.terms=v.terms||30;
  inv.dueDate=iso(addD(inv.submittedAt||iso(NOW),inv.terms));
  return inv;
}
function dueInDays(i){ return i.dueDate?Math.round(days(iso(NOW),i.dueDate)):null; }

/* enrich the seed with state, payment terms and approval state */
var _seed=seed;
seed=function(){
  _seed();
  S.vendors.forEach(function(v){ v.state=VENDOR_STATE[v.id]||'Gujarat'; v.terms=VENDOR_TERMS[v.id]||30; });
  S.contracts.forEach(function(c){ c.terms=vend(c.vendorId).terms; c.version=1; });
  S.invoices.forEach(function(i){ i.approvals=i.approvals||[]; recompute(i); runValidation(i);
    if(i.status==='paid'&&!i.approvals.length)
      i.approvals.push({by:'Sanjay Rao',role:'Finance',at:iso(addD(NOW,-13))}); });
  S.payments.forEach(function(p){ p.scheduledFor=p.scheduledFor||p.at; });
  S.settings={fx:FX,gstService:GST_RATES.service,gstGta:GST_RATES.gta,matrix:APPROVAL_MATRIX};
};

/* approval is now explicit and role-gated */
function requiredApprover(i){ return approverFor(i.cur==='USD'?i.approvedAmt*FX:i.approvedAmt); }
function canApprove(i){
  var need=approverFor(i.cur==='USD'?i.total*FX:i.total);
  var r=roleOf(S.user);
  if(need==='Logistics operations') return r==='Logistics operations'||r==='Finance'||r==='Finance head';
  return r==='Finance'||r==='Finance head';
}
function recordApproval(i,note){
  i.approvals.push({by:S.user.name,role:roleOf(S.user),at:iso(NOW),note:note||''});
}
function approveInv(id){ var i=find(S.invoices,id);
  if(!canApprove(i)) return toast('Outside your approval limit',
    'This invoice needs '+approverFor(i.cur==='USD'?i.total*FX:i.total)+'.');
  i.status='approved'; i.approvedAmt=i.total; recordApproval(i,'Approved in full');
  render(); toast('Approved in full','Scheduled for payment on '+fdate(i.dueDate)+'.'); }
function partApprove(id){ var i=find(S.invoices,id);
  var clean=sum(i.results.filter(function(r){return r.status!=='exception';}).map(function(r){return r.claimed;}));
  if(!canApprove(i)) return toast('Outside your approval limit');
  if(!clean) return toast('Nothing to release',
    'Every line on this invoice failed validation. Dispute it or override.');
  i.status='partial'; i.approvedAmt=clean; recordApproval(i,'Approved the clean lines only');
  render(); toast('Part approved',money(clean,i.cur)+' released, due '+fdate(i.dueDate)+'.'); }
function disputeInv(id){ var i=find(S.invoices,id); i.status='disputed';

<script>

var BASES=['per shipment','per container','per trip','per tank','per event'];
function codesFor(cat){ return Object.keys(CH).filter(function(c){
  return CH[c].cat===cat&&['base','scope','tariff'].indexOf(CH[c].cls)>=0; }); }
function disbCodesFor(cat){ return Object.keys(CH).filter(function(c){
  return CH[c].cat===cat&&CH[c].cls==='disb'; }); }
function clocksForCat(cat){ return Object.keys(CLOCKS).filter(function(k){return CLOCKS[k].cat===cat;}); }

  var c=id?find(S.contracts,id):null;
  var cat=c?c.cat:(presetCat||'cha');
  var codes=codesFor(cat), disb=disbCodesFor(cat), cks=clocksForCat(cat);
  var vendors=S.vendors.filter(function(v){return v.cat===cat;});
  var lineRows=codes.map(function(code){
    var ex=c?c.lines.filter(function(l){return l.code===code;})[0]:null;

     'text-align:right" value="'+(ex?ex.amt:'')+'" placeholder="not offered"></td>'+
     '<td>'+sel('cb_'+code,BASES,ex?ex.basis:'per shipment')+'</td></tr>';}).join('');
  var clockRows=cks.map(function(k){

     'value="'+(fr===''?'':fr)+'" placeholder="0"> '+CLOCKS[k].unit+'s</td>'+
     '<td class="num"><input class="i cs1" data-k="'+k+'" type="number" style="width:90px;text-align:right" '+
     'value="'+(sl[0]?sl[0].r:'')+'"></td>'+
     '<td class="num"><input class="i cs2" data-k="'+k+'" type="number" style="width:90px;text-align:right" '+
     'value="'+(sl[1]?sl[1].r:'')+'"></td>'+

     'value="'+(sl[2]?sl[2].r:'')+'"></td></tr>';}).join('');

   '<span class="muted small">'+CAT[cat].n+'</span><button class="x" onclick="closeModal()">\u00D7</button></header>'+

function readContractForm(){

    lines:lines,free:free,slabs:slabs,

      : b.containers;
