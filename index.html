    return etaInfo(a).actual-etaInfo(b).actual; });
  var delayed=S.shipments.filter(function(s){ return etaInfo(s).delay>0&&s.status!=='delivered'; });
  var clockRows=[];
  S.files.forEach(function(f){ clocksFor(f).forEach(function(c){
    if(c.na||c.charge<=0) return;
    var svc=svcOf(f,CLOCKS[c.key].cat);
    clockRows.push({f:f,c:c,cur:svc.cur,inr:svc.cur==='USD'?c.amount*FX:c.amount}); }); });
  clockRows.sort(function(a,b){return b.inr-a.inr;});
  var exList=[];
  S.shipments.forEach(function(s){ s.exceptions.forEach(function(e){ exList.push({s:s,e:e}); }); });

  var m=function(v,l,d,col){ return '<div class="card metric"><div class="pad">'+
    '<div class="v"'+(col?' style="color:'+col+'"':'')+'>'+v+'</div><div class="l">'+l+'</div>'+
    (d?'<div class="d muted">'+d+'</div>':'')+'</div></div>'; };

  var html='<div class="grid g4">'+
   m(live.length,'Shipments in flight',S.files.length+' files open')+
   m(arriving.length,'Arriving in 14 days',arriving.length?'Next '+fdate(etaInfo(arriving[0]).actual):'None scheduled')+
   m(delayed.length,'Behind the awarded transit',delayed.length?'Longest '+
     Math.max.apply(null,delayed.map(function(s){return etaInfo(s).delay;}))+' days':'All on time',
     delayed.length?'var(--bad)':null)+
   m(exList.length,'Open exceptions','Across all shipments',exList.length?'var(--warn)':null)+
  '</div>';

  html+='<div class="card mt"><h3>Pipeline</h3><div class="pad">'+
   '<div class="row" style="gap:0;align-items:stretch">'+phases.map(function(p,i){
     var n=counts[p];
     return '<div style="flex:1;text-align:center;padding:10px 6px;border-right:'+
      (i<phases.length-1?'1px solid var(--line2)':'none')+'">'+
      '<div style="font-size:20px;font-weight:600;color:'+(n?'var(--ink)':'var(--faint)')+'">'+n+'</div>'+
      '<div class="tiny muted">'+p+'</div></div>';}).join('')+'</div></div></div>';

  html+='<div class="grid g2 mt">'+
   '<div class="card"><h3>Arrivals next 14 days</h3><div class="tw"><table><thead><tr><th>Shipment</th>'+
   '<th>Lane</th><th>Vessel</th><th>ETA</th><th class="num">Delay</th><th class="num">Containers</th>'+
   '</tr></thead><tbody>'+
   (arriving.length?arriving.map(function(s){ var e=etaInfo(s);
     return '<tr class="clk" onclick="go(\'tracking:'+s.id+'\')"><td><b>'+s.id+'</b></td>'+
      '<td>'+pn(s.origin)+' \u2192 '+pn(s.destination)+'</td>'+
      '<td>'+esc(s.vessel)+'</td><td>'+fdate(e.actual)+'</td>'+
      '<td class="num" style="color:'+(e.delay>0?'var(--bad)':'var(--ok)')+'">'+
      (e.delay>0?'+':'')+e.delay+' d</td><td class="num">'+s.containers.length+'</td></tr>';
   }).join(''):'<tr><td colspan="6" class="empty">No arrivals scheduled.</td></tr>')+
   '</tbody></table></div></div>'+
   '<div class="card"><h3>Exceptions</h3><div class="tw"><table><thead><tr><th></th><th>Shipment</th>'+
   '<th>Issue</th><th>Raised</th></tr></thead><tbody>'+
   (exList.length?exList.slice(0,10).map(function(x){
     return '<tr class="clk" onclick="go(\'tracking:'+x.s.id+'\')"><td style="width:14px">'+
      '<span class="dot" style="background:var(--'+(x.e.sev==='bad'?'bad':'warn')+')"></span></td>'+
      '<td><b>'+x.s.id+'</b></td><td>'+esc(x.e.t)+'</td><td>'+fdate(x.e.at)+'</td></tr>';
   }).join(''):'<tr><td colspan="4" class="empty">Nothing open.</td></tr>')+
   '</tbody></table></div></div></div>';

  html+='<div class="card mt"><h3>Clocks running against free time</h3><div class="tw"><table><thead><tr>'+
   '<th>File</th><th>Shipment</th><th>Clock</th><th>Owner</th><th class="num">Used</th>'+
   '<th class="num">Free</th><th class="num">Chargeable</th><th class="num">Accrued</th><th>State</th>'+
   '</tr></thead><tbody>'+
   (clockRows.length?clockRows.map(function(r){
     return '<tr class="clk" onclick="go(\'files:'+r.f.id+'\')"><td><b>'+r.f.id+'</b></td>'+
      '<td>'+(r.f.shipmentId||'\u2014')+'</td><td>'+r.c.name+'</td>'+
      '<td class="small">'+CAT[CLOCKS[r.c.key].cat].n+'</td>'+
      '<td class="num">'+r.c.used+' '+r.c.unit+'s</td><td class="num">'+r.c.free+'</td>'+
      '<td class="num" style="color:var(--bad)">'+r.c.charge+'</td>'+
      '<td class="num">'+money(r.c.amount,r.cur)+'</td>'+
      '<td>'+(r.c.running?tag('warn','running'):tag('grey','closed'))+'</td></tr>';
   }).join(''):'<tr><td colspan="9" class="empty">No clock is past its free allowance.</td></tr>')+
   '</tbody></table></div></div>';

  html+='<div class="card mt"><h3>Shipments</h3><div class="tw"><table><thead><tr><th>Shipment</th>'+
   '<th>File</th><th>Plant</th><th>Lane</th><th>Carrier</th><th>Phase</th><th>Last event</th>'+
   '<th>ETA</th><th>Status</th></tr></thead><tbody>'+
   S.shipments.map(function(s){ var f=fileOfOC(s.ocId), e=etaInfo(s);
     return '<tr class="clk" onclick="go(\'tracking:'+s.id+'\')"><td><b>'+s.id+'</b><br>'+
      '<span class="tiny muted mono">'+esc(s.mbl)+'</span></td><td>'+f.id+'</td>'+
      '<td>'+esc(PLANTS[f.plant].n)+'</td>'+
      '<td>'+pn(s.origin)+' \u2192 '+pn(s.destination)+'</td><td>'+esc(s.carrier)+'</td>'+
      '<td>'+phaseOf(s)+'</td><td>'+stageOf(s)+'</td>'+
      '<td>'+(s.ev.ATA?fdate(s.ev.ATA.at):fdate(e.actual))+'</td>'+
      '<td>'+stag(s.status)+'</td></tr>';}).join('')+'</tbody></table></div></div>';
  $('view').innerHTML=html;
}
function dashFinance(){
  var stp=S.invoices.length?S.invoices.filter(function(i){return exCount(i)===0;}).length/S.invoices.length*100:0;
  var recov=sum(S.invoices.map(function(i){
    var v=i.results.filter(function(r){return r.status==='exception';})
      .reduce(function(a,r){return a+Math.max(0,r.delta);},0);
    return i.cur==='USD'?v*FX:v; }));
  var held=S.invoices.filter(function(i){return i.status==='exception';});
  var accrual=sum(S.files.map(accrualINR));
  var ready=S.invoices.filter(function(i){return i.status==='approved'||i.status==='partial';});
  var covered=0,total=0;
  S.files.forEach(function(f){ f.services.forEach(function(s){ total++; if(s.contractId) covered++; }); });
  var m=function(v,l,d,col){ return '<div class="card metric"><div class="pad"><div class="v"'+
    (col?' style="color:'+col+'"':'')+'>'+v+'</div><div class="l">'+l+'</div>'+
    (d?'<div class="d muted">'+d+'</div>':'')+'</div></div>'; };
  var html='<div class="grid g4">'+
   m(pct(stp),'Straight-through processing','No human touch')+
   m(inr(recov),'Recovery value','Rejected against contract','var(--ok)')+
   m(held.length,'Invoices held',inr(sum(held.map(invINR))),held.length?'var(--bad)':null)+
   m(inr(accrual),'Not yet invoiced','Accrued from rate cards')+'</div>';
  html+='<div class="grid g4 mt">'+
   m(pct(covered/total*100),'Contract coverage','Service lines with a rate card')+
   m(ready.length,'Approved and unpaid',inr(sum(ready.map(function(i){
     return i.cur==='USD'?i.approvedAmt*FX:i.approvedAmt;}))))+
   m(ready.filter(function(i){return dueInDays(i)<0;}).length,'Overdue','Past contracted terms')+
   m(S.contracts.filter(function(c){return c.status==='live';}).length,'Live contracts',
     S.bids.filter(function(b){return b.status==='open';}).length+' events open')+'</div>';

  html+='<div class="grid g2 mt">'+
   '<div class="card"><h3>Spend by service category</h3><div class="tw"><table><thead><tr>'+
   '<th>Category</th><th class="num">Expected</th><th class="num">Claimed</th>'+
   '<th class="num">Variance</th><th class="num">Share</th></tr></thead><tbody>'+
   CATS.map(function(cat){
     var exp=sum(S.files.map(function(f){ var s=svcOf(f,cat); if(!s) return 0;
       var v=svcExpected(s); return s.cur==='USD'?v*FX:v; }));
     var cl=sum(S.invoices.filter(function(i){return i.cat===cat;}).map(invINR));
     var tot=sum(S.files.map(fileExpectedINR));
     return '<tr><td><b>'+CAT[cat].n+'</b></td><td class="num">'+inr(exp)+'</td>'+
      '<td class="num">'+inr(cl)+'</td>'+
      '<td class="num" style="color:'+(cl>exp+1?'var(--bad)':'var(--muted)')+'">'+
      (cl?(cl-exp>0?'+':'')+inr(cl-exp):'\u2014')+'</td><td class="num">'+pct(exp/tot*100)+'</td></tr>';
   }).join('')+'</tbody></table></div></div>'+
   '<div class="card"><h3>Exception reasons</h3><div class="tw"><table><thead><tr><th>Code</th>'+
   '<th>Reason</th><th class="num">Hits</th><th class="num">Value</th></tr></thead><tbody>'+
   Object.keys(REASONS).map(function(k){
     var hits=[]; S.invoices.forEach(function(i){ i.results.forEach(function(r){
       if(r.reason===k) hits.push({r:r,cur:i.cur}); }); });
     if(!hits.length) return '';
     return '<tr><td class="mono">'+k+'</td><td class="small">'+REASONS[k]+'</td>'+
      '<td class="num">'+hits.length+'</td><td class="num">'+
      inr(sum(hits.map(function(h){var v=Math.max(0,h.r.delta);return h.cur==='USD'?v*FX:v;})))+'</td></tr>';
   }).join('')+'</tbody></table></div></div></div>';

  html+='<div class="grid g2 mt">'+
   '<div class="card"><h3>Payables ageing</h3><div class="tw"><table><thead><tr><th>Bucket</th>'+
   '<th class="num">Invoices</th><th class="num">Value</th></tr></thead><tbody>'+
   [['Overdue',function(d){return d<0;}],['Due within 7 days',function(d){return d>=0&&d<=7;}],
    ['8 to 30 days',function(d){return d>7&&d<=30;}],['Beyond 30 days',function(d){return d>30;}]]
   .map(function(b){ var set=ready.filter(function(i){return b[1](dueInDays(i));});
     return '<tr><td>'+b[0]+'</td><td class="num">'+set.length+'</td><td class="num">'+
      inr(sum(set.map(function(i){return i.cur==='USD'?i.approvedAmt*FX:i.approvedAmt;})))+'</td></tr>';
   }).join('')+'</tbody></table></div></div>'+
   '<div class="card"><h3>Vendor performance</h3><div class="tw"><table><thead><tr><th>Vendor</th>'+
   '<th>Category</th><th class="num">Invoices</th><th class="num">Rejected lines</th>'+
   '<th class="num">SLA</th></tr></thead><tbody>'+
   S.vendors.map(function(v){
     var iv=S.invoices.filter(function(i){return i.vendorId===v.id;});
     if(!iv.length) return '';
     var bad=sum(iv.map(exCount)), all=sum(iv.map(function(i){return i.lines.length;}));
     return '<tr><td><b>'+esc(v.name)+'</b></td><td class="small">'+CAT[v.cat].n+'</td>'+
      '<td class="num">'+iv.length+'</td>'+
      '<td class="num" style="color:'+(bad?'var(--bad)':'var(--muted)')+'">'+bad+' of '+all+'</td>'+
      '<td class="num">'+v.sc.sla+'</td></tr>';
   }).join('')+'</tbody></table></div></div></div>';

  html+='<div class="card mt"><h3>Invoice completeness</h3><div class="tw"><table><thead><tr>'+
   '<th>Category</th><th class="num">Expected</th><th class="num">Received</th>'+
   '<th class="num">Outstanding</th><th class="num">Accrued</th></tr></thead><tbody>'+
   CATS.map(function(cat){ var exp=0,got=0,acc=0;
     S.files.forEach(function(f){ var s=svcOf(f,cat); if(!s||!s.items.length) return;
       exp++; if(s.status!=='awaited') got++; else acc+=s.cur==='USD'?svcExpected(s)*FX:svcExpected(s); });
     return '<tr><td><b>'+CAT[cat].n+'</b></td><td class="num">'+exp+'</td><td class="num">'+got+'</td>'+
      '<td class="num">'+(exp-got)+'</td><td class="num">'+(acc?inr(acc):'\u2014')+'</td></tr>';
   }).join('')+'</tbody></table></div></div>';
  $('view').innerHTML=html;
}
delete VIEWS.analytics;
</script>
<script>
/* ============ sourcing: clarifications, auction, split award, approval ============ */
function clarifications(b){ b.qa=b.qa||[]; return b.qa; }
function askQuestion(bid){
  var b=bidOf(bid);
  modal('<header><h2>Ask a question</h2><button class="x" onclick="closeModal()">\u00D7</button></header>'+
   '<div class="body"><label class="f"><span>Your question to Gulbrandsen</span>'+
   '<textarea class="i" id="qaText" rows="4" placeholder="e.g. Is destination THC prepaid or collect on this lane?"></textarea></label>'+
   '<label class="chk on" onclick="this.classList.toggle(\'on\')"><input type="checkbox" id="qaPriv" checked> '+
   'Keep my identity private from other bidders</label>'+
   '<p class="small muted mt8">Answers are published to every invited vendor so nobody bids on different '+
   'assumptions. Your name is hidden unless you untick the box above.</p></div>'+
   '<footer><button class="btn" onclick="closeModal()">Cancel</button>'+
   '<button class="btn pri" onclick="postQuestion(\''+bid+'\')">Post question</button></footer>');
}
function postQuestion(bid){
  var b=bidOf(bid), t=val('qaText');
  if(!t) return toast('Write a question first');
  clarifications(b).push({id:uid('QA'),by:myVid(),anon:$('qaPriv').checked,q:t,a:null,
    at:iso(NOW),answeredAt:null,answeredBy:null});
  closeModal(); render(); toast('Question posted','Gulbrandsen will publish the answer to all bidders.');
}
function answerQuestion(bid,qid){
  var b=bidOf(bid), q=clarifications(b).filter(by(qid))[0];
  modal('<header><h2>Answer, published to all bidders</h2>'+
   '<button class="x" onclick="closeModal()">\u00D7</button></header><div class="body">'+
   '<p class="small muted">'+esc(q.q)+'</p>'+
   '<label class="f mt"><span>Your answer</span><textarea class="i" id="qaAns" rows="4"></textarea></label>'+
   '<p class="small muted">Answering extends the same information to every invited vendor, which is what '+
   'keeps the comparison like for like.</p></div>'+
   '<footer><button class="btn" onclick="closeModal()">Cancel</button>'+
   '<button class="btn pri" onclick="saveAnswer(\''+bid+'\',\''+qid+'\')">Publish</button></footer>');
}
function saveAnswer(bid,qid){
  var b=bidOf(bid), q=clarifications(b).filter(by(qid))[0];
  q.a=val('qaAns'); q.answeredAt=iso(NOW); q.answeredBy=S.user.name;
  closeModal(); render(); toast('Answer published to all bidders');
}
function qaPanel(b,asVendor){
  var qa=clarifications(b);
  return '<div class="card mt"><h3>Clarifications'+
   (asVendor&&b.status==='open'?'<button class="btn sm pri" style="margin-left:auto" onclick="askQuestion(\''+
     b.id+'\')">Ask a question</button>':'')+'</h3><div class="tw"><table><thead><tr>'+
   '<th>Asked</th><th>Question</th><th>Answer</th><th></th></tr></thead><tbody>'+
   (qa.length?qa.map(function(q){
     return '<tr><td>'+fdate(q.at)+'<br><span class="tiny muted">'+
      (q.anon?'anonymous':esc(vend(q.by).name))+'</span></td>'+
      '<td>'+esc(q.q)+'</td>'+
      '<td>'+(q.a?esc(q.a)+'<br><span class="tiny muted">'+esc(q.answeredBy)+' \u00B7 '+
        fdate(q.answeredAt)+'</span>':'<span class="muted">awaiting an answer</span>')+'</td>'+
      '<td class="right">'+(!asVendor&&!q.a?'<button class="btn sm pri" onclick="answerQuestion(\''+
        b.id+'\',\''+q.id+'\')">Answer</button>':'')+'</td></tr>';
   }).join(''):'<tr><td colspan="4" class="empty">No questions raised.</td></tr>')+
   '</tbody></table></div></div>';
}
/* ---------- reverse auction ---------- */
function openAuction(bid){
  var b=bidOf(bid);
  var lo=Math.min.apply(null,b.quotes.map(quoteTotal));
  modal('<header><h2>Open a reverse auction</h2><button class="x" onclick="closeModal()">\u00D7</button></header>'+
   '<div class="body"><p class="small muted">An English reverse auction. Every invited vendor sees the '+
   'current best landed cost and their own rank, but never a competitor\u2019s name. Bids must improve on '+
   'the leading price by at least the decrement.</p><div class="grid g3 mt">'+
   fld('','Ceiling <em>USD per container</em>','<input class="i" id="auCeil" type="number" value="'+
     Math.round(lo)+'">')+
   fld('','Minimum decrement <em>USD</em>','<input class="i" id="auDec" type="number" value="25">')+
   fld('','Rounds allowed','<input class="i" id="auRounds" type="number" value="3">')+
   '</div><label class="chk on" onclick="this.classList.toggle(\'on\')">'+
   '<input type="checkbox" id="auRank" checked> Show each vendor their rank</label>'+
   '</div><footer><button class="btn" onclick="closeModal()">Cancel</button>'+
   '<button class="btn pri" onclick="startAuction(\''+bid+'\')">Open the auction</button></footer>');
}
function startAuction(bid){
  var b=bidOf(bid);
  b.auction={open:true,ceiling:numval('auCeil'),decrement:numval('auDec')||25,
    rounds:numval('auRounds')||3,showRank:$('auRank').checked,history:[],openedAt:iso(NOW)};
  b.status='open'; closeModal(); render();
  toast('Auction open','Invited vendors can now improve their landed cost.');
}
function closeAuction(bid){ var b=bidOf(bid); b.auction.open=false; b.status='evaluating';
  render(); toast('Auction closed','Ready to award.'); }
function auctionRank(b,vid){
  var sorted=b.quotes.slice().sort(function(x,y){return quoteTotal(x)-quoteTotal(y);});
  for(var i=0;i<sorted.length;i++) if(sorted[i].vendorId===vid) return i+1;
  return null;
}
function bestPrice(b){ return b.quotes.length?Math.min.apply(null,b.quotes.map(quoteTotal)):null; }
function auctionBidForm(bid){
  var b=bidOf(bid), q=b.quotes.filter(function(x){return x.vendorId===myVid();})[0];
  if(!q) return toast('Quote first','Submit a full quote before bidding in the auction.');
  var best=bestPrice(b), mine=quoteTotal(q);
  var target=Math.max(0,best-b.auction.decrement);
  modal('<header><h2>Reverse auction \u2014 '+b.ref+'</h2><button class="x" onclick="closeModal()">\u00D7</button></header>'+
   '<div class="body"><div class="grid g3">'+
   '<div class="card metric"><div class="pad"><div class="v">'+usd(best)+'</div>'+
   '<div class="l">Current best landed cost</div></div></div>'+
   '<div class="card metric"><div class="pad"><div class="v">'+usd(mine)+'</div>'+
   '<div class="l">Your landed cost</div></div></div>'+
   '<div class="card metric"><div class="pad"><div class="v">'+
   (b.auction.showRank?'#'+auctionRank(b,myVid()):'hidden')+'</div>'+
   '<div class="l">Your rank</div></div></div></div>'+
   '<p class="small muted mt">Reduce your base ocean freight to improve your landed cost. '+
   'A new bid must be at least '+usd(b.auction.decrement)+' below '+usd(best)+
   ', so your landed cost must not exceed '+usd(target)+'. Surcharges, free time and service terms '+
   'stay as quoted.</p>'+
   '<label class="f mt"><span>New base ocean freight <em>USD per container</em></span>'+
   '<input class="i" id="auBase" type="number" value="'+Math.max(0,q.base-(mine-target))+'"></label>'+
   '<div id="auMsg"></div>'+
   (b.auction.history.length?'<div class="sect">Auction history</div><div class="tw"><table><thead><tr>'+
     '<th>Time</th><th>Vendor</th><th class="num">Landed cost</th></tr></thead><tbody>'+
     b.auction.history.slice().reverse().map(function(h){
       return '<tr><td>'+fdt(h.at)+'</td><td>'+(h.vendorId===myVid()?'<b>you</b>'
        :'<span class="muted">another bidder</span>')+'</td>'+
        '<td class="num">'+usd(h.total)+'</td></tr>';}).join('')+'</tbody></table></div>':'')+
   '</div><footer><button class="btn" onclick="closeModal()">Cancel</button>'+
   '<button class="btn pri" onclick="placeAuctionBid(\''+bid+'\')">Place bid</button></footer>');
}
function placeAuctionBid(bid){
  var b=bidOf(bid), q=b.quotes.filter(function(x){return x.vendorId===myVid();})[0];
  var newBase=numval('auBase');
  var surcharges=sum(Object.keys(q.sc).map(function(c){return q.sc[c];}));
  var newTotal=newBase+surcharges, best=bestPrice(b);
  if(newTotal>best-b.auction.decrement)
    return toast('Bid not accepted','Your landed cost must be at or below '+
      usd(best-b.auction.decrement)+'.');
  q.base=newBase;
  b.auction.history.push({vendorId:myVid(),total:newTotal,at:iso(NOW)});
  closeModal(); render(); toast('Bid accepted',usd(newTotal)+' is the new leading price.');
}
/* ---------- split award and award approval ---------- */
function splitForm(bid){
  var b=bidOf(bid), scored=scoreQuotes(b);
  modal('<header><h2>Award '+b.ref+'</h2><button class="x" onclick="closeModal()">\u00D7</button></header>'+
   '<div class="body"><p class="small muted">Allocate the '+b.qty+' containers across one or more vendors. '+
   'Each allocation issues its own order and its own shipment file, so a split is tracked and invoiced '+
   'separately rather than merged.</p>'+
   '<div class="tw mt"><table><thead><tr><th>Vendor</th><th class="num">Landed cost</th>'+
   '<th class="num">Transit</th><th class="num">Score</th><th class="num">Containers</th>'+
   '</tr></thead><tbody>'+scored.map(function(s,ix){
     return '<tr><td><b>'+esc(vend(s.q.vendorId).name)+'</b></td>'+
      '<td class="num">'+usd(quoteTotal(s.q))+'</td><td class="num">'+s.q.transit+' d</td>'+
      '<td class="num">'+(Math.round(s.total*10)/10)+'</td>'+
      '<td class="num"><input class="i alloc" data-q="'+s.q.id+'" type="number" min="0" max="'+b.qty+
      '" value="'+(ix===0?b.qty:0)+'" style="width:90px;text-align:right" oninput="allocSum('+b.qty+')"></td></tr>';
   }).join('')+'</tbody></table></div>'+
   '<div id="allocMsg" class="mt"></div>'+
   '<label class="f mt"><span>Award rationale <em>recorded on the approval trail</em></span>'+
   '<input class="i" id="awNote" value="Lowest weighted score on price, transit and SLA history"></label>'+
   '</div><footer><button class="btn" onclick="closeModal()">Cancel</button>'+
   '<button class="btn pri" onclick="submitAward(\''+bid+'\')">Submit for approval</button></footer>');
  allocSum(b.qty);
}
function allocSum(total){
  var els=[].slice.call(document.querySelectorAll('.alloc'));
  var t=sum(els.map(function(e){return parseFloat(e.value)||0;}));
  var used=els.filter(function(e){return (parseFloat(e.value)||0)>0;}).length;
  $('allocMsg').innerHTML='<div class="card" style="border-color:'+(t===total?'#BCE5CF':'#E8B4AF')+'">'+
   '<div class="pad spread"><div>'+t+' of '+total+' containers allocated across '+used+' vendor'+
   (used===1?'':'s')+'</div><div>'+(t===total?tag('ok','balanced'):tag('bad','must equal '+total))+
   '</div></div></div>';
}
function submitAward(bid){
  var b=bidOf(bid), allocs=[];
  [].slice.call(document.querySelectorAll('.alloc')).forEach(function(e){
    var n=parseFloat(e.value)||0; if(n>0) allocs.push({quoteId:e.getAttribute('data-q'),qty:n}); });
  var t=sum(allocs.map(function(a){return a.qty;}));
  if(t!==b.qty) return toast('Allocation must equal '+b.qty+' containers');
  var value=sum(allocs.map(function(a){
    var q=b.quotes.filter(by(a.quoteId))[0]; return quoteTotal(q)*a.qty*FX; }));
  b.award={allocs:allocs,note:val('awNote'),by:S.user.name,at:iso(NOW),
    value:value,needs:approverFor(value),approvals:[]};
  b.status='pending';
  closeModal(); render();
  toast('Submitted for approval','Needs '+b.award.needs+' before the orders are issued.');
}
function approveAward(bid){
  var b=bidOf(bid);
  var r=roleOf(S.user);
  var need=b.award.needs;
  var ok = need==='Logistics operations' ? true : (r==='Finance'||r==='Finance head');
  if(!ok) return toast('Outside your approval limit','This award needs '+need+'.');
  b.award.approvals.push({by:S.user.name,role:r,at:iso(NOW)});
  var files=[];
  b.award.allocs.forEach(function(a){
    var q=b.quotes.filter(by(a.quoteId))[0];
    var rcd=[{code:'OFR',amt:q.base,cls:'base'}];
    Object.keys(q.sc).forEach(function(c){ if(q.sc[c]>0) rcd.push({code:c,amt:q.sc[c],cls:CH[c].cls}); });
    var oc={id:'OC-'+(S.seq.oc++),bidId:b.id,quoteId:q.id,vendorId:q.vendorId,plant:b.plant,
      origin:b.origin,destination:b.destination,incoterm:b.incoterm,equip:b.equip,qty:a.qty,
      commodity:b.commodity,imo:b.imo,un:b.un,pkg:b.pkg,weight:b.weight,rateCard:rcd,
      incl:q.incl.slice(),ftDem:q.ftDem,ftDet:q.ftDet,slabs:q.slabs,transit:q.transit,
      routing:q.routing,carrier:q.carrier,freq:q.freq,cutoff:q.cutoff,
      slaId:resolveSLA(b.origin,b.destination).id,cur:'USD',basis:q.basis,validTo:q.validTo,
      anchor:q.anchor,status:'issued',issuedAt:iso(NOW)};
    S.orders.push(oc); files.push(buildFile(oc));
  });
  b.awardQuoteId=b.award.allocs[0].quoteId; b.status='awarded';
  go(files.length===1?'files:'+files[0].id:'files');
  toast('Award approved',files.length+' order'+(files.length>1?'s':'')+
    ' issued and '+files.length+' shipment file'+(files.length>1?'s':'')+' opened.');
}
function rejectAward(bid){ var b=bidOf(bid); b.status='evaluating'; b.award=null;
  render(); toast('Award sent back','The allocation can be revised.'); }
</script>

<script>
/* ============ v2.3 — operations data table ============ */
S = S || {};
var DTCFG={};
function dtState(id){
  S.dt=S.dt||{};
  if(!S.dt[id]) S.dt[id]={tab:null,chips:[],q:'',page:1,size:50,sort:null,dir:'asc',
    hidden:[],colf:{},view:'table',sel:[]};
  return S.dt[id];
}
function icoSearch(){ return '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>'; }
function dtRows(cfg,st){
  var rows=cfg.rows.slice();
  if(st.tab){ var t=cfg.tabs.filter(function(x){return x.k===st.tab;})[0];
    if(t&&t.f) rows=rows.filter(t.f); }
  if(st.chips.length){
    var preds=[]; (cfg.chipGroups||[]).forEach(function(g){ g.chips.forEach(function(c){
      if(st.chips.indexOf(c.k)>=0) preds.push(c.f); }); });
    if(preds.length) rows=rows.filter(function(r){ return preds.some(function(p){return p(r);}); });
  }
  Object.keys(st.colf).forEach(function(k){
    var vals=st.colf[k]; if(!vals||!vals.length) return;
    var col=cfg.columns.filter(function(c){return c.k===k;})[0]; if(!col) return;
    rows=rows.filter(function(r){ return vals.indexOf(String(dtVal(col,r)))>=0; });
  });
  if(st.q){ var q=st.q.toLowerCase();
    rows=rows.filter(function(r){ return cfg.columns.some(function(c){
      return String(dtVal(c,r)).toLowerCase().indexOf(q)>=0; }); }); }
  if(st.sort){ var col=cfg.columns.filter(function(c){return c.k===st.sort;})[0];
    if(col) rows.sort(function(a,b){
      var x=dtSortVal(col,a), y=dtSortVal(col,b);
      if(x<y) return st.dir==='asc'?-1:1; if(x>y) return st.dir==='asc'?1:-1; return 0; }); }
  return rows;
}
function dtVal(c,r){ return c.val?c.val(r):(c.render?String(c.render(r)).replace(/<[^>]*>/g,' ').trim():''); }
function dtSortVal(c,r){ var v=c.sortVal?c.sortVal(r):dtVal(c,r);
  if(typeof v==='number') return v;
  var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  return isNaN(n)?String(v).toLowerCase():n; }

function buildTable(cfg){
  DTCFG[cfg.id]=cfg;
  var st=dtState(cfg.id);
  if(st.tab===null&&cfg.tabs&&cfg.tabs.length) st.tab=cfg.tabs[0].k;
  var rows=dtRows(cfg,st);
  var total=rows.length, pages=Math.max(1,Math.ceil(total/st.size));
  if(st.page>pages) st.page=pages;
  var page=rows.slice((st.page-1)*st.size,st.page*st.size);
  var cols=cfg.columns.filter(function(c){return st.hidden.indexOf(c.k)<0;});
  var q="'"+cfg.id+"'";

  var tabs=cfg.tabs?'<div class="dttabs">'+cfg.tabs.map(function(t){
    var n=t.f?cfg.rows.filter(t.f).length:cfg.rows.length;
    return '<button class="dttab'+(st.tab===t.k?' on':'')+'" onclick="dtSetTab('+q+',\''+t.k+'\')">'+
      esc(t.label)+' <span class="n">('+n+')</span></button>';}).join('')+'</div>':'';

  var chips=(cfg.chipGroups||[]).map(function(g){
    return '<div class="chipgrp '+(g.tone||'ok')+'"><span class="lg">'+esc(g.label)+'</span><div class="chips">'+
     g.chips.map(function(c){
       var n=cfg.rows.filter(function(r){
         if(st.tab){ var t=cfg.tabs.filter(function(x){return x.k===st.tab;})[0];
           if(t&&t.f&&!t.f(r)) return false; }
         return c.f(r); }).length;
       return '<button class="chip'+(st.chips.indexOf(c.k)>=0?' on':'')+'" onclick="dtChip('+q+',\''+c.k+'\')">'+
        '<span class="cd" style="background:'+(c.col||'var(--muted)')+'"></span>'+esc(c.label)+
        '<span class="cn">'+n+'</span></button>';}).join('')+'</div></div>';}).join('');

  var tools='<div class="dttool"><div class="dtsearch">'+icoSearch()+
   '<input placeholder="Search" value="'+esc(st.q)+'" oninput="dtSearch('+q+',this.value)"></div>'+
   '<div class="dttools">'+
   '<button class="tbtn" onclick="dtExport('+q+')">&#8593; Export</button>'+
   (cfg.onImport?'<button class="tbtn" onclick="dtImport('+q+')">&#8595; Import</button>':'')+
   '<button class="tbtn" onclick="dtCustomize('+q+')">&#9707; Customize</button>'+
   '<button class="tbtn'+(Object.keys(st.colf).some(function(k){return st.colf[k].length;})?' on':'')+
     '" onclick="dtFilter('+q+')">&#9776; Filter</button>'+
   '</div></div>';

  var head='<tr><th class="stick" style="width:34px"><input type="checkbox" onchange="dtAll('+q+',this.checked)"'+
   (st.sel.length&&st.sel.length===page.length?' checked':'')+'></th>'+
   cols.map(function(c,ix){
     var on=st.colf[c.k]&&st.colf[c.k].length;
     return '<th class="'+(c.num?'num ':'')+(c.wrap?'wrap ':'')+(ix===0?'stick':'')+'"'+
      (ix===0?' style="left:34px"':'')+'><span class="thi">'+
      '<span style="cursor:pointer" onclick="dtSort('+q+',\''+c.k+'\')">'+esc(c.label)+
      (st.sort===c.k?(st.dir==='asc'?' \u2191':' \u2193'):'')+'</span>'+
      (c.nofilter?'':'<span class="fic'+(on?' on':'')+'" onclick="dtColFilter('+q+',\''+c.k+'\')">&#9776;</span>')+
      '</span></th>';}).join('')+
   (cfg.rowActions?'<th style="width:110px"></th>':'')+'</tr>';

  var body=page.length?page.map(function(r,ri){
    var rid=cfg.rowId(r);
    return '<tr'+(cfg.onRow?' style="cursor:pointer"':'')+'>'+
     '<td class="stick"><input type="checkbox" class="dtsel" value="'+esc(rid)+'"'+
     (st.sel.indexOf(rid)>=0?' checked':'')+' onchange="dtSel('+q+',\''+esc(rid)+'\',this.checked)"></td>'+
     cols.map(function(c,ix){
       var v=c.render?c.render(r):esc(dtVal(c,r));
       return '<td class="'+(c.num?'num ':'')+(c.wrap?'wrap ':'')+(ix===0?'stick':'')+'"'+
        (ix===0?' style="left:34px"':'')+
        (cfg.onRow?' onclick="dtGo('+q+',\''+esc(rid)+'\')"':'')+'>'+v+'</td>';}).join('')+
     (cfg.rowActions?'<td><div class="rowact">'+cfg.rowActions.map(function(a){
       return '<button title="'+esc(a.title)+'" onclick="dtAct('+q+',\''+esc(rid)+'\',\''+a.k+'\')">'+
        a.icon+'</button>';}).join('')+'</div></td>':'')+'</tr>';
  }).join(''):'<tr><td colspan="'+(cols.length+2)+'"><div class="empty"><b>Nothing matches</b>'+
    'Clear a filter or widen the search.</div></td></tr>';

  var listView=page.map(function(r){
    var rid=cfg.rowId(r);
    return '<div class="lcard"'+(cfg.onRow?' onclick="dtGo('+q+',\''+esc(rid)+'\')"':'')+'>'+
     '<div style="font-weight:600">'+(cols[0].render?cols[0].render(r):esc(dtVal(cols[0],r)))+'</div>'+
     '<div class="lrow">'+cols.slice(1).map(function(c){
       return '<div class="lf"><b>'+esc(c.label)+'</b>'+(c.render?c.render(r):esc(dtVal(c,r)))+'</div>';
     }).join('')+'</div></div>';}).join('');

  var foot='<div class="dtfoot"><span>Rows per page</span>'+
   '<select class="i" style="width:auto;padding:3px 6px" onchange="dtSize('+q+',this.value)">'+
   [25,50,100,200].map(function(n){return '<option'+(st.size===n?' selected':'')+'>'+n+'</option>';}).join('')+
   '</select><span>Showing '+(total?((st.page-1)*st.size+1):0)+' \u2013 '+
   Math.min(total,st.page*st.size)+' of '+total+'</span>'+
   (st.sel.length?'<span style="color:var(--brand);font-weight:600">'+st.sel.length+' selected</span>':'')+
   '<div class="pager"><button onclick="dtPage('+q+',1)"'+(st.page===1?' disabled':'')+'>&#8676;</button>'+
   '<button onclick="dtPage('+q+','+(st.page-1)+')"'+(st.page===1?' disabled':'')+'>&#8592;</button>'+
   '<input value="'+st.page+'" onchange="dtPage('+q+',this.value)"><span>/ '+pages+'</span>'+
   '<button onclick="dtPage('+q+','+(st.page+1)+')"'+(st.page>=pages?' disabled':'')+'>&#8594;</button>'+
   '<button onclick="dtPage('+q+','+pages+')"'+(st.page>=pages?' disabled':'')+'>&#8677;</button></div></div>';

  return '<div class="dtwrap">'+tabs+chips+tools+
   (st.view==='table'
     ? '<div class="dtscroll"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'
     : '<div style="border-top:1px solid var(--line)">'+(page.length?listView:
        '<div class="empty"><b>Nothing matches</b></div>')+'</div>')+
   foot+'</div>';
}
function viewToggle(id){
  var st=dtState(id);
  return '<div class="vtoggle"><button class="'+(st.view==='table'?'on':'')+
   '" onclick="dtView(\''+id+'\',\'table\')">&#9707; Table view</button>'+
   '<button class="'+(st.view==='list'?'on':'')+
   '" onclick="dtView(\''+id+'\',\'list\')">&#9776; List view</button></div>';
}
function dtSetTab(id,k){ var s=dtState(id); s.tab=k; s.page=1; s.sel=[]; render(); }
function dtChip(id,k){ var s=dtState(id); var i=s.chips.indexOf(k);
  if(i>=0) s.chips.splice(i,1); else s.chips.push(k); s.page=1; render(); }
function dtSearch(id,v){ var s=dtState(id); s.q=v; s.page=1; render();
  var el=document.querySelector('.dtsearch input'); if(el){ el.focus(); el.setSelectionRange(v.length,v.length);} }
function dtSort(id,k){ var s=dtState(id);
  if(s.sort===k) s.dir=s.dir==='asc'?'desc':'asc'; else { s.sort=k; s.dir='asc'; } render(); }
function dtPage(id,n){ var s=dtState(id); n=parseInt(n,10)||1; s.page=Math.max(1,n); render(); }
function dtSize(id,n){ var s=dtState(id); s.size=parseInt(n,10)||50; s.page=1; render(); }
function dtView(id,v){ dtState(id).view=v; render(); }
function dtSel(id,rid,on){ var s=dtState(id); var i=s.sel.indexOf(rid);
  if(on&&i<0) s.sel.push(rid); if(!on&&i>=0) s.sel.splice(i,1); render(); }
function dtAll(id,on){ var s=dtState(id), cfg=DTCFG[id];
  var rows=dtRows(cfg,s).slice((s.page-1)*s.size,s.page*s.size);
  s.sel=on?rows.map(cfg.rowId):[]; render(); }
function dtGo(id,rid){ var cfg=DTCFG[id]; if(cfg.onRow) cfg.onRow(rid); }
function dtAct(id,rid,k){ var cfg=DTCFG[id];
  var a=cfg.rowActions.filter(function(x){return x.k===k;})[0]; if(a) a.fn(rid); }
function dtExport(id){
  var cfg=DTCFG[id], st=dtState(id), rows=dtRows(cfg,st);
  var cols=cfg.columns.filter(function(c){return st.hidden.indexOf(c.k)<0;});
  var out=[cols.map(function(c){return '"'+c.label+'"';}).join(',')];
  rows.forEach(function(r){ out.push(cols.map(function(c){
    return '"'+String(dtVal(c,r)).replace(/"/g,'""')+'"'; }).join(',')); });
  var b=new Blob([out.join('\n')],{type:'text/csv'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download=id+'.csv'; a.click();
  toast('Exported',rows.length+' rows as CSV.');
}
function dtCustomize(id){
  var cfg=DTCFG[id], st=dtState(id);
  modal('<header><h2>Customize columns</h2><button class="x" onclick="closeModal()">\u00D7</button></header>'+
   '<div class="body"><p class="small muted">Hidden columns are excluded from the view and from exports.</p>'+
   '<div class="row mt" style="flex-wrap:wrap">'+cfg.columns.map(function(c){
     var on=st.hidden.indexOf(c.k)<0;
     return '<label class="chk'+(on?' on':'')+'" onclick="this.classList.toggle(\'on\')">'+
      '<input type="checkbox" class="colc" value="'+c.k+'"'+(on?' checked':'')+'> '+esc(c.label)+'</label>';
   }).join('')+'</div></div><footer><button class="btn" onclick="closeModal()">Cancel</button>'+
   '<button class="btn pri" onclick="saveCols(\''+id+'\')">Apply</button></footer>');
}
function saveCols(id){
  var cfg=DTCFG[id], st=dtState(id), on=picked('colc');
  st.hidden=cfg.columns.map(function(c){return c.k;}).filter(function(k){return on.indexOf(k)<0;});
  closeModal(); render();
}
function dtColFilter(id,k){
  var cfg=DTCFG[id], st=dtState(id);
  var col=cfg.columns.filter(function(c){return c.k===k;})[0];
  var vals=[]; cfg.rows.forEach(function(r){ var v=String(dtVal(col,r));
    if(vals.indexOf(v)<0) vals.push(v); });
  vals.sort();
  var cur=st.colf[k]||[];
  modal('<header><h2>Filter by '+esc(col.label)+'</h2><button class="x" onclick="closeModal()">\u00D7</button></header>'+
   '<div class="body"><div class="row" style="flex-wrap:wrap">'+vals.map(function(v){
     var on=cur.indexOf(v)>=0;
     return '<label class="chk'+(on?' on':'')+'" onclick="this.classList.toggle(\'on\')">'+
      '<input type="checkbox" class="cfv" value="'+esc(v)+'"'+(on?' checked':'')+'> '+
      esc(v.length>44?v.slice(0,44)+'\u2026':v)+'</label>';}).join('')+'</div></div>'+
   '<footer><button class="btn" onclick="clearColFilter(\''+id+'\',\''+k+'\')">Clear</button>'+
   '<button class="btn pri" onclick="applyColFilter(\''+id+'\',\''+k+'\')">Apply</button></footer>');
}
function applyColFilter(id,k){ var st=dtState(id); st.colf[k]=picked('cfv'); st.page=1;
  closeModal(); render(); }
function clearColFilter(id,k){ var st=dtState(id); delete st.colf[k]; closeModal(); render(); }
function dtFilter(id){
  var cfg=DTCFG[id], st=dtState(id);
  modal('<header><h2>Filters</h2><button class="x" onclick="closeModal()">\u00D7</button></header>'+
   '<div class="body">'+cfg.columns.filter(function(c){return !c.nofilter;}).map(function(c){
     var n=(st.colf[c.k]||[]).length;
     return '<div class="spread" style="padding:8px 0;border-bottom:1px solid var(--line2)">'+
      '<div><b>'+esc(c.label)+'</b>'+(n?' <span class="tag t-info">'+n+' selected</span>':
        ' <span class="muted small">all</span>')+'</div>'+
      '<button class="btn sm" onclick="closeModal();dtColFilter(\''+id+'\',\''+c.k+'\')">Choose</button></div>';
   }).join('')+'</div><footer><button class="btn" onclick="clearAllFilters(\''+id+'\')">Clear all</button>'+
   '<button class="btn pri" onclick="closeModal()">Done</button></footer>');
}
function clearAllFilters(id){ var st=dtState(id); st.colf={}; st.chips=[]; st.q='';
  closeModal(); render(); toast('Filters cleared'); }
function dtImport(id){ var cfg=DTCFG[id]; if(cfg.onImport) cfg.onImport(); }

function terms2Of(c){ c.terms2=c.terms2||JSON.parse(JSON.stringify(DEFAULT_TERMS2)); return c.terms2; }
var SLA_PARAMS=[['p2p','Port-to-port transit'],['d2d','Door-to-door transit'],
  ['bkgTat','Booking confirmation'],['placement','Container placement'],['docTat','Document turnaround']];

/* snapshot the obligations onto the file so they cannot be rewritten later */
var _buildFile=buildFile;
buildFile=function(oc){
  var f=_buildFile(oc);
  f.services.forEach(function(s){
    if(!s.contractId||s.contractType!=='contract') return;
    var c=find(S.contracts,s.contractId); if(!c) return;
    s.snapshot=s.snapshot||{};
    s.snapshot.terms2=JSON.parse(JSON.stringify(terms2Of(c)));
  });
  var ocv=vend(oc.vendorId);
  var os=svcOf(f,'ocean');
  os.snapshot={terms2:JSON.parse(JSON.stringify(DEFAULT_TERMS2))};
  os.snapshot.terms2.credits=[{param:'p2p',pct:2,cap:10},{param:'docTat',pct:1,cap:5}];
  return f;
};
/* escalation applies to contracted base rates */
var _expectedFor=expectedFor;
expectedFor=function(line,ctx){
  var ex=_expectedFor(line,ctx);
  if(line.cls==='base'&&ex.v!=null&&ctx.svc&&ctx.svc.snapshot&&ctx.svc.snapshot.terms2){
    var e=ctx.svc.snapshot.terms2.escalation;
    if(e&&e.on&&e.base>0){
      var move=(e.current-e.base)/e.base*100;
      if(Math.abs(move)>=e.threshold){
        var applied=Math.max(-e.cap,Math.min(e.cap,move));
        ex.v=Math.round(ex.v*(1+applied/100));
        ex.basis=ex.basis+', escalated '+(applied>0?'+':'')+(Math.round(applied*10)/10)+'% on the '+e.index;
      }
    }
  }
  return ex;
};
/* service credits computed from tracked events against the snapshotted SLA */
function creditsFor(f){
  var sh=shipOfFile(f); if(!sh) return [];
  var oc=ocOf(f.ocId), sla=find(SLA_PROFILES,oc.slaId), out=[];
  var svc=svcOf(f,'ocean');
  var cfg=(svc.snapshot&&svc.snapshot.terms2&&svc.snapshot.terms2.credits)||[];
  cfg.forEach(function(cr){
    var actual=null,target=sla.t[cr.param],tol=0;
    if(cr.param==='p2p'){ actual=(sh.ev.ATD&&sh.ev.ATA)?days(sh.ev.ATD.at,sh.ev.ATA.at):null; tol=sla.tol.p2p; }
    if(cr.param==='d2d'){ actual=(sh.ev.DEPPLT&&sh.ev.GOU)?days(sh.ev.DEPPLT.at,sh.ev.GOU.at):null; tol=sla.tol.d2d; }
    if(cr.param==='bkgTat'){ actual=sh.ev.BKG?Math.round(days(oc.issuedAt,sh.ev.BKG.at)*24):null; }
    if(cr.param==='placement'){ actual=(sh.ev.BKG&&sh.ev.VEHPLC)?days(sh.ev.BKG.at,sh.ev.VEHPLC.at):null; }
    if(cr.param==='docTat'){ var d=vend(oc.vendorId).sc.doc; actual=sh.ev.ATD?(d>90?2:d>80?4:6):null; }
    if(actual==null) return;
    var over=actual-(target+tol);
    if(over<=0) return;
    var units=Math.ceil(over);
    var pct=Math.min(cr.cap,units*cr.pct);
    var base=ocTotal(oc)*oc.qty;
    out.push({param:cr.param,label:(SLA_PARAMS.filter(function(p){return p[0]===cr.param;})[0]||[,cr.param])[1],
      target:target+tol,actual:actual,over:units,pct:pct,amount:Math.round(base*pct/100),cur:'USD',
      vendorId:oc.vendorId});
  });
  return out;
}

     t.escalation.threshold+'">')+

     t.escalation.cap+'">')+
   fld('','Review frequency',sel('t2rev',['Monthly','Quarterly','Half yearly','Annually'],t.escalation.review))+
   fld('','Volume commitment <em>containers a year</em>','<input class="i" id="t2vol" type="number" value="'+
     t.volume.commit+'">')+
   fld('','Shortfall charge <em>% of committed value</em>','<input class="i" id="t2short" type="number" value="'+
     t.volume.shortfallPct+'">')+
   '</div>'+
   '<div class="sect">Service credits <span class="muted" style="font-weight:400">\u2014 a breach becomes a debit, not a note</span></div>'+
   '<div class="tw"><table><thead><tr><th>Parameter</th><th class="num">Credit rate</th>'+

   fld('','Liability cap','<input class="i" id="t2liab" value="'+esc(t.liabilityCap)+'">')+
   fld('','Minimum insurance cover','<input class="i" id="t2ins" value="'+esc(t.insurance.cover)+'">')+
   fld('','Insurance expiry','<input class="i" id="t2insx" type="date" value="'+
     (t.insurance.expiry||'')+'">')+

     t.terminationDays+'">')+
   fld('','Renewal',sel('t2ren',['manual','auto'],t.autoRenew?'auto':'manual',null,function(k){
     return k==='auto'?'Auto-renew unless notified':'Manual renewal';}))+
   fld('','Renewal notice <em>days</em>','<input class="i" id="t2rnot" type="number" value="'+
     t.renewNotice+'">')+
   fld('','Dispute forum','<input class="i" id="t2forum" value="'+esc(t.disputeForum)+'">')+
   '</div><div class="row" style="flex-wrap:wrap">'+
   '<label class="chk'+(t.indemnity?' on':'')+'" onclick="this.classList.toggle(\'on\')">'+

   '<label class="chk'+(t.forceMajeure?' on':'')+'" onclick="this.classList.toggle(\'on\')">'+
   '<input type="checkbox" id="t2fm"'+(t.forceMajeure?' checked':'')+'> Force majeure clause</label>'+

function raiseCredit(fid,ix){

      amount:-cr.amount,fileId:f.id,days:null,evidence:null}],
    status:'approved',submittedAt:iso(NOW),results:[],docs:['SLA measurement extract'],
    approvedAmt:-cr.amount,paymentId:null,history:[],
    approvals:[{by:S.user.name,role:roleOf(S.user),at:iso(NOW),note:'Service credit raised from tracked events'}]};
  d.subtotal=-cr.amount; d.taxAmount=0; d.total=-cr.amount; d.expectedTotal=-cr.amount; d.variance=0;
  d.terms=vend(cr.vendorId).terms; d.dueDate=iso(addD(NOW,d.terms));

<script>
/* ============ bid response import, ERP export mapping ============ */
function importResponses(){
  var open=S.bids.filter(function(b){return b.status==='open'&&b.mode==='spot';});
  if(!open.length) return toast('No open spot bids','Import applies to an open request.');
  modal('<header><h2>Import quotes from a spreadsheet</h2><button class="x" onclick="closeModal()">\u00D7</button></header>'+
   '<div class="body"><label class="f"><span>Bid</span><select class="i" id="impBid">'+
   open.map(function(b){return '<option value="'+b.id+'">'+b.ref+' \u00B7 '+pn(b.origin)+
     ' \u2192 '+pn(b.destination)+'</option>';}).join('')+'</select></label>'+
   '<p class="small muted">Paste comma-separated rows. Header: '+
   '<span class="mono">vendor_code, base, baf, thco, thcd, transit, carrier, free_dem, free_det</span>. '+
   'Anything omitted falls back to the published tariff or zero.</p>'+
   '<label class="f mt"><span>Rows</span><textarea class="i" id="impCsv" rows="7">'+
   'vendor_code,base,baf,thco,thcd,transit,carrier,free_dem,free_det\n'+
   'OLL,1655,331,186,398,33,Maersk,7,5\n'+
   'CTG,1590,331,186,398,37,ONE,5,4</textarea></label>'+
   '<div id="impPrev"></div></div>'+
   '<footer><button class="btn" onclick="closeModal()">Cancel</button>'+
   '<button class="btn" onclick="previewImport()">Preview</button>'+
   '<button class="btn pri" onclick="runImport()">Import quotes</button></footer>');
}
function parseImport(){
  var raw=val('impCsv').trim().split(/\r?\n/).filter(function(l){return l.trim();});
  if(!raw.length) return [];
  var head=raw[0].split(',').map(function(h){return h.trim().toLowerCase();});
  return raw.slice(1).map(function(line){
    var cells=line.split(','), o={};
    head.forEach(function(h,i){ o[h]=(cells[i]||'').trim(); });
    return o; });
}
function previewImport(){
  var rows=parseImport(), b=bidOf(val('impBid'));
  $('impPrev').innerHTML='<div class="card mt"><h3>Preview</h3><div class="tw"><table><thead><tr>'+
   '<th>Vendor</th><th class="num">Base</th><th class="num">Landed</th><th class="num">Transit</th>'+
   '<th>Result</th></tr></thead><tbody>'+rows.map(function(r){
     var v=S.vendors.filter(function(x){return x.code===(r.vendor_code||'').toUpperCase();})[0];
     var landed=(parseFloat(r.base)||0)+(parseFloat(r.baf)||0)+(parseFloat(r.thco)||0)+
       (parseFloat(r.thcd)||0);
     return '<tr><td>'+(v?esc(v.name):'<span style="color:var(--bad)">unknown code</span>')+'</td>'+
      '<td class="num">'+usd(parseFloat(r.base)||0)+'</td><td class="num">'+usd(landed)+'</td>'+
      '<td class="num">'+(r.transit||'\u2014')+'</td>'+
      '<td>'+(!v?tag('bad','vendor not found'):
        b.invited.indexOf(v.id)<0?tag('warn','not invited'):tag('ok','will import'))+'</td></tr>';
   }).join('')+'</tbody></table></div></div>';
}
function runImport(){
  var b=bidOf(val('impBid')), rows=parseImport(), n=0;
  rows.forEach(function(r){
    var v=S.vendors.filter(function(x){return x.code===(r.vendor_code||'').toUpperCase();})[0];
    if(!v||b.invited.indexOf(v.id)<0) return;
    var q={id:uid('Q'),bidId:b.id,vendorId:v.id,base:parseFloat(r.base)||0,cur:'USD',
      basis:'Per container',validTo:iso(addD(NOW,30)),anchor:'Bill of lading date',
      sc:{BAF:parseFloat(r.baf)||0,CAF:0,LSS:0,PSS:0,WRS:0,
          THCO:parseFloat(r.thco)||TARIFF.THCO[b.origin]||0,
          THCD:parseFloat(r.thcd)||TARIFF.THCD[b.destination]||0,
          ISPS:38,DG:TARIFF.DG[b.imo]||0,DOC:0,SEAL:0,VGMF:0,BLAM:0},
      incl:['SEAL','VGMF'],transit:parseFloat(r.transit)||30,routing:'Transhipment',
      carrier:r.carrier||'Maersk',freq:'Weekly',cutoff:'CY 48h / SI 72h / VGM 24h before ETD',
      ftDem:parseFloat(r.free_dem)||7,ftDet:parseFloat(r.free_det)||5,slabs:OCEAN_SLABS,
      notes:'Imported from spreadsheet',at:iso(NOW)};
    b.quotes=b.quotes.filter(function(x){return x.vendorId!==v.id;});
    b.quotes.push(q); n++; });
  closeModal(); go('bids:'+b.id);
  toast(n+' quotes imported',n?'Compare them alongside portal responses.':'No rows matched an invited vendor.');
}
/* ---- ERP export mapping ---- */
var ERP={system:'Not configured',format:'csv',
  map:{invoice:'REFERENCE',vendor:'VENDOR_CODE',date:'DOC_DATE',due:'BASELINE_DATE',
    net:'NET_AMOUNT',tax:'TAX_AMOUNT',gross:'GROSS_AMOUNT',currency:'CURRENCY',
    cost:'COST_CENTER',gl:'GL_ACCOUNT',ref:'ASSIGNMENT'},
  costCentre:'LOG-OCEAN',glFreight:'5310010',glDuty:'5310020'};
function erpRows(p){
  return p.invoiceIds.map(function(id){ var i=find(S.invoices,id), v=vend(i.vendorId);
    var net=i.subtotal, tax=i.taxRcm?0:i.taxAmount;
    return {invoice:i.vendorRef,vendor:v.code,date:iso(i.submittedAt).slice(0,10),
      due:i.dueDate?i.dueDate.slice(0,10):'',net:Math.round(net),tax:Math.round(tax),
      gross:Math.round(i.approvedAmt),currency:i.cur,cost:ERP.costCentre,
      gl:i.cat==='ocean'?ERP.glFreight:ERP.glDuty,ref:i.fileId||'MULTI'}; });
}
function downloadPaymentFile(pid){
  var p=find(S.payments,pid), rows=erpRows(p);
  var keys=Object.keys(ERP.map);
  var out;
  if(ERP.format==='json') out=JSON.stringify({run:p.id,valueDate:p.scheduledFor,rows:rows},null,2);
  else { out=[keys.map(function(k){return ERP.map[k];}).join(',')]
    .concat(rows.map(function(r){ return keys.map(function(k){
      return '"'+String(r[k]).replace(/"/g,'""')+'"'; }).join(','); })).join('\n'); }
  var b=new Blob([out],{type:ERP.format==='json'?'application/json':'text/csv'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download=p.id+'.'+ERP.format; a.click();
  toast('Payment file downloaded',rows.length+' lines in '+ERP.format.toUpperCase()+' for '+ERP.system+'.');
}

      disb.forEach(function(d){ if(rnd()<0.9) d.evidence={doc:'Receipt '+ri(10000,99999),amount:d.amount}; });
      var okd=sum(disb.filter(function(d){return d.evidence;}).map(function(d){return d.amount;}));
      var hp=(s.snapshot&&s.snapshot.handlingPct)||5, hc=(s.snapshot&&s.snapshot.handlingCap)||2500;
      ln.push(L('DOCHDL',rnd()<0.1?Math.round(hc*1.6):Math.min(hc,Math.round(okd*hp/100)),f.id));

    newInvoice({vendorId:s.vendorId,fileId:f.id,ref:vv.code+'-'+refno(),
      at:iso(addD(NOW,-Math.max(0,age-22))),lines:ln});

function makePeriodicTransport(){
  var months=[[-1,'SEP26'],[-31,'AUG26'],[-61,'JUL26'],[-92,'JUN26']];
  S.vendors.filter(function(v){return v.cat==='trans';}).forEach(function(v){
    months.forEach(function(m){
      var files=S.files.filter(function(f){ var s=svcOf(f,'trans');
        return s&&s.vendorId===v.id&&s.items.length&&f.shipmentId&&
          Math.abs(days(f.createdAt,iso(addD(NOW,m[0]))))<32; });
      if(!files.length) return;
      var lines=[];
      files.forEach(function(f){ linesFromService(f,'trans').forEach(function(l){ lines.push(l); });
        var h=clockByCode(f,'HALT');
        if(h&&!h.na&&!h.running&&h.charge>0) lines.push(L('HALT',Math.round(h.amount*(rnd()<0.88?1:1.3)),f.id,
          {days:h.charge+(rnd()<0.8?0:ri(1,3))})); });
      if(rnd()<0.15) lines.push(L('TOLL',ri(1500,3200),files[0].id));
      newInvoice({type:'periodic',vendorId:v.id,fileId:null,ref:v.code+'/'+m[1]+'/'+refno(),
        at:iso(addD(NOW,m[0])),lines:lines,docs:['Consolidated invoice','Trip sheets']});
    }); });
}

function makePayments(){
  var paid=S.invoices.filter(function(i){ return i.status==='approved'&&
    (i.approvals||[]).length&&dueInDays(i)<0; });
  var per=Math.max(4,Math.ceil(paid.length/9));
  for(var i=0;i<paid.length;i+=per){
    var grp=paid.slice(i,i+per); if(!grp.length) continue;
    var tot=sum(grp.map(function(x){ return x.cur==='USD'?x.approvedAmt*FX:x.approvedAmt; }));
    var p={id:'PAY-'+(S.seq.pay++),at:grp[0].dueDate,scheduledFor:grp[0].dueDate,
      invoiceIds:grp.map(function(x){return x.id;}),totalINR:tot,status:'posted',
      ack:'ERP document 51000'+(48800+S.payments.length)};
    S.payments.push(p);
    grp.forEach(function(x){ x.status='paid'; x.paymentId=p.id; linkInvoice(x); });
  }
}

<script>
/* ============ v2.7 — live sync, activity feed ============ */
var BC=null; try{ BC=new BroadcastChannel('zimpra-gulbrandsen-ofmp'); }catch(e){ BC=null; }
var MUTING=false, LOCAL={lastSeen:0,feed:false};
function bump(type,text,refs){
  S.rev=(S.rev||0)+1;
  S.activity=S.activity||[];
  S.activity.unshift({id:uid('A'),rev:S.rev,at:iso(NOW),by:S.user?S.user.name:'System',
    org:S.user?S.user.org:'',type:type,text:text,ref:refs||null});
  if(S.activity.length>250) S.activity.pop();
  publish();
}
function publish(){
  if(!BC||MUTING) return;
  try{ BC.postMessage({rev:S.rev,now:NOW.toISOString(),state:JSON.parse(JSON.stringify(S))}); }catch(e){}
}
if(BC) BC.onmessage=function(e){
  var d=e.data; if(!d||!d.state) return;
  if((d.rev||0)<=(S.rev||0)) return;
  var keep={user:S.user?S.user.id:null,route:S.route,dt:S.dt,setTab:S.setTab,dashTab:S.dashTab,
    bidFilter:S.bidFilter,invFilter:S.invFilter,shipFilter:S.shipFilter,shipQ:S.shipQ};
  MUTING=true;
  NOW=new Date(d.now); S=d.state;
  S.user=keep.user?find(S.users,keep.user):null;
  S.route=keep.route; S.dt=keep.dt; S.setTab=keep.setTab; S.dashTab=keep.dashTab;
  S.bidFilter=keep.bidFilter; S.invFilter=keep.invFilter; S.shipFilter=keep.shipFilter; S.shipQ=keep.shipQ;
  MUTING=false;
  if(S.user){ render();
    var last=S.activity&&S.activity[0];
    if(last) toast('Updated by '+last.by,last.text); }
};
function unread(){ return (S.activity||[]).filter(function(a){return a.rev>LOCAL.lastSeen;}).length; }
function liveChip(){
  var n=unread();
  return '<button class="live" onclick="openFeed()"><span class="pulse"></span>Live'+
   (n?' <span class="bdg">'+n+'</span>':'')+'</button>';
}
function openFeed(){
  LOCAL.feed=true;
  var items=(S.activity||[]).slice(0,80).map(function(a){
    return '<div class="fitem'+(a.rev>LOCAL.lastSeen?' new':'')+'">'+
     '<div class="ft">'+esc(a.text)+'</div>'+
     '<div class="fm">'+esc(a.by)+(a.org?' \u00B7 '+esc(a.org):'')+' \u00B7 '+fdt(a.at)+
     (a.ref?' \u00B7 <a href="#" onclick="closeFeed();go(\''+a.ref+'\');return false">open</a>':'')+
     '</div></div>';}).join('');
  $('layer').innerHTML='<div class="modal" style="background:rgba(14,27,46,.25)" '+
   'onclick="if(event.target===this)closeFeed()"><div class="feed" onclick="event.stopPropagation()">'+
   '<header><b>Activity</b><span class="muted small">'+(S.activity||[]).length+' events</span>'+
   '<button class="x" onclick="closeFeed()">\u00D7</button></header>'+
   '<div class="body">'+(items||'<div class="empty">Nothing yet.</div>')+'</div>'+
   '<div class="pad" style="border-top:1px solid var(--line2)">'+
   '<button class="btn" style="width:100%" onclick="markSeen()">Mark all as read</button></div>'+
   '</div></div>';
}
function closeFeed(){ LOCAL.feed=false; LOCAL.lastSeen=S.rev||0; $('layer').innerHTML=''; render(); }
function markSeen(){ LOCAL.lastSeen=S.rev||0; openFeed(); }
/* every screen header carries the live chip */
var _rt=renderTop;
renderTop=function(t,c,a){ _rt(t,c,(a||'')+' '+liveChip()); };
/* list view removed */
viewToggle=function(){ return ''; };

/* ---- log every mutation ---- */
function wrap(name,fn,logger){
  var orig=window[name];
  window[name]=function(){ var r=orig.apply(this,arguments); try{ logger.apply(this,arguments); }catch(e){}
    return r; };
}
wrap('saveQuote',null,function(bidId){ var b=bidOf(bidId);
  var q=b.quotes.filter(function(x){return x.vendorId===myVid();})[0];
  bump('quote',vend(myVid()).name+' quoted '+usd(quoteTotal(q))+' on '+b.ref,'bids:'+b.id); });
wrap('saveTenderQuote',null,function(id){ var t=bidOf(id);
  bump('quote',vend(myVid()).name+' responded to tender '+t.ref,'bids:'+t.id); });
wrap('placeAuctionBid',null,function(bid){ var b=bidOf(bid);
  bump('auction','New leading bid on '+b.ref+' at '+usd(bestPrice(b)),'bids:'+b.id); });
wrap('postQuestion',null,function(bid){ var b=bidOf(bid);
  bump('qa','Question raised on '+b.ref,'bids:'+b.id); });
wrap('saveAnswer',null,function(bid){ var b=bidOf(bid);
  bump('qa','Answer published on '+b.ref,'bids:'+b.id); });
wrap('submitAward',null,function(bid){ var b=bidOf(bid);
  if(b.award) bump('award',b.ref+' submitted for approval, '+inr(b.award.value),'bids:'+b.id); });
wrap('approveAward',null,function(bid){ var b=bidOf(bid);
  bump('award',b.ref+' approved and orders issued','bids:'+b.id); });

<script>
/* ============ v2.8 — correcting invoices ============ */
/* a manually accepted line is treated as authorised, with the reason recorded */
var _runVal2=runValidation;
runValidation=function(inv){
  var r=_runVal2(inv);
  var changed=false;
  inv.results.forEach(function(res,ix){
    var l=inv.lines[ix];
    if(l&&l.override){
      res.status='tolerance'; res.reason=null; res.expected=l.override.amount;
      res.delta=l.amount-l.override.amount;
      res.basis='Manually accepted by '+l.override.by+' \u2014 '+l.override.note;
      changed=true;
    }
  });
  if(changed){
    inv.expectedTotal=sum(inv.results.map(function(x){return x.expected||0;}));
    inv.variance=inv.total-inv.expectedTotal;
    if(!inv.results.some(function(x){return x.status==='exception';})&&
       ['exception','submitted','validating'].indexOf(inv.status)>=0){
      inv.status='approved'; inv.approvedAmt=inv.total; maybeAutoRelease(inv);
    }
  }
  return r;
};
/* buyer: accept a line that failed, with a mandatory reason */
function overrideLine(invId,ix){
  var i=find(S.invoices,invId), l=i.lines[ix], r=i.results[ix];
  modal('<header><h2>Accept this line</h2><button class="x" onclick="closeModal()">\u00D7</button></header>'+
   '<div class="body"><dl class="kv">'+
   [['Charge',CH[l.code].l],['Claimed',money(l.amount,i.cur)],
    ['Authorised',r.expected==null?'no reference':money(r.expected,i.cur)],
    ['Why it failed',r.reason?REASONS[r.reason]:'\u2014']]
   .map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>';}).join('')+'</dl>'+
   '<label class="f mt"><span>Amount to accept</span><input class="i" id="ovAmt" type="number" value="'+
   l.amount+'"></label>'+
   '<label class="f"><span>Reason <em>recorded on the audit trail</em></span>'+
   '<input class="i" id="ovNote" placeholder="e.g. rate card missed the revised THC tariff"></label>'+
   '<p class="small muted">Accepting does not change the contract. If the contract is wrong, revise it '+
   'so future invoices validate correctly.</p></div>'+
   '<footer><button class="btn" onclick="closeModal()">Cancel</button>'+
   '<button class="btn ok" onclick="saveOverride(\''+invId+'\','+ix+')">Accept the line</button></footer>');
}
function saveOverride(invId,ix){
  var i=find(S.invoices,invId), note=val('ovNote');
  if(!note) return toast('A reason is required');
  i.lines[ix].override={amount:numval('ovAmt'),note:note,by:S.user.name,at:iso(NOW)};
  i.history.push({at:iso(NOW),by:S.user.name,what:'Accepted '+i.lines[ix].code+' \u2014 '+note});
  recompute(i); runValidation(i); closeModal(); render();
  bump('override',i.id+' \u00B7 '+i.lines[ix].code+' accepted manually','invoices:'+invId);
  toast('Line accepted',note);
}
/* buyer: query a line back to the vendor */
function queryLine(invId,ix){
  var i=find(S.invoices,invId), l=i.lines[ix];
  modal('<header><h2>Query this line</h2><button class="x" onclick="closeModal()">\u00D7</button></header>'+
   '<div class="body"><p class="small muted">'+esc(CH[l.code].l)+' \u00B7 '+money(l.amount,i.cur)+'</p>'+
   '<label class="f mt"><span>What the vendor needs to do</span>'+
   '<textarea class="i" id="qlNote" rows="3">'+
   (l.query?esc(l.query.note):'Attach the underlying receipt and resubmit.')+'</textarea></label></div>'+
   '<footer><button class="btn" onclick="closeModal()">Cancel</button>'+
   '<button class="btn bad" onclick="saveQuery(\''+invId+'\','+ix+')">Send the query</button></footer>');
}
function saveQuery(invId,ix){
  var i=find(S.invoices,invId);
  i.lines[ix].query={note:val('qlNote'),by:S.user.name,at:iso(NOW)};
  i.status='disputed';
  i.history.push({at:iso(NOW),by:S.user.name,what:'Queried '+i.lines[ix].code});
  closeModal(); render();
  bump('dispute',i.id+' \u00B7 '+i.lines[ix].code+' queried back to '+vend(i.vendorId).name,'invoices:'+invId);
  toast('Query sent','The vendor sees it against that line in their portal.');
}
/* invoice detail gains per-line actions and the revision history */
var _invD2=invDetail;
invDetail=function(id){
  _invD2(id);
  var i=find(S.invoices,id); if(!i) return;
  var internal=!isVendor();
  var tb=$('view').querySelector('table tbody'); if(!tb) return;
  var head=$('view').querySelector('table thead tr');
  if(head) head.insertAdjacentHTML('beforeend','<th></th>');
  [].slice.call(tb.querySelectorAll('tr')).forEach(function(tr,ix){
    if(ix>=i.lines.length){ tr.insertAdjacentHTML('beforeend','<td></td>'); return; }
    var r=i.results[ix], l=i.lines[ix];
    var cell='';
    if(internal&&r&&r.status==='exception')
      cell='<div class="rowact"><button title="Accept this line" onclick="overrideLine(\''+id+'\','+ix+')">\u2713</button>'+
        '<button title="Query the vendor" onclick="queryLine(\''+id+'\','+ix+')">\u2715</button></div>';
    if(l.override) cell='<span class="tag t-warn">accepted</span>';
    if(l.query) cell+=' <span class="tag t-bad">queried</span>';
    tr.insertAdjacentHTML('beforeend','<td class="right">'+cell+'</td>');
  });
  var canRevise=isVendor()&&i.vendorId===myVid()&&
    ['exception','disputed','submitted'].indexOf(i.status)>=0;
  if(canRevise) $('top').querySelector('.topright').insertAdjacentHTML('afterbegin',
    '<button class="btn pri" onclick="reviseForm(\''+id+'\')">Correct and resubmit</button> ');
  if(i.history&&i.history.length) $('view').insertAdjacentHTML('beforeend',
   '<div class="card mt"><h3>Revision history</h3><div class="tw"><table><thead><tr><th>When</th>'+
   '<th>Who</th><th>What changed</th></tr></thead><tbody>'+
   i.history.slice().reverse().map(function(h){
     return '<tr><td>'+fdt(h.at)+'</td><td>'+esc(h.by)+'</td><td>'+esc(h.what)+'</td></tr>';}).join('')+
   '</tbody></table></div></div>');
};
/* vendor: correct the rejected lines and resubmit */
var REVISE=null;
function reviseForm(id){
  var i=find(S.invoices,id); REVISE=id; EXTRA=[];
  var rows=i.lines.map(function(l,ix){
    var r=i.results[ix]||{};
    var bad=r.status==='exception';
    return '<tr'+(bad?' style="background:#FCEFEE"':'')+'><td class="mono">'+l.code+'</td>'+
     '<td>'+esc(l.desc)+(l.query?'<br><span class="tiny" style="color:var(--bad)">'+
       esc(l.query.note)+'</span>':'')+'</td>'+
     '<td>'+(bad?'<span class="tag t-bad">'+r.reason+' '+REASONS[r.reason]+'</span>'+
       '<br><span class="tiny muted">'+esc(r.basis||'')+'</span>':tag('ok','accepted'))+'</td>'+
     '<td class="num"><input class="i rrate" data-i="'+ix+'" type="number" value="'+l.rate+
       '" style="width:110px;text-align:right" oninput="revisePreview()"></td>'+
     '<td class="num">'+l.qty+'</td>'+
     '<td>'+(l.cls==='disb'
       ? '<input class="i rev" data-i="'+ix+'" placeholder="Receipt reference" value="'+
         (l.evidence?esc(l.evidence.doc):'')+'" style="width:170px" oninput="revisePreview()">'+
         '<input class="i reva" data-i="'+ix+'" type="number" placeholder="Receipt value" value="'+
         (l.evidence?l.evidence.amount:'')+'" style="width:130px;margin-top:4px" oninput="revisePreview()">'
       : '<span class="muted tiny">not applicable</span>')+'</td>'+
     '<td class="right"><label class="chk"><input type="checkbox" class="rdrop" value="'+ix+
       '" onchange="revisePreview()"> drop</label></td></tr>';
  }).join('');
  var addable=Object.keys(CH).filter(function(c){
    return (CH[c].cat===i.cat||CH[c].cat==='*')&&CH[c].cls!=='statutory'; });
  modal('<header><h2>Correct '+i.id+'</h2><span class="muted small">'+esc(i.vendorRef)+' \u00B7 '+
   (i.fileId||'multiple files')+'</span><button class="x" onclick="closeModal()">\u00D7</button></header>'+
   '<div class="body"><p class="small muted">Adjust the rejected lines, attach any missing receipt, '+
   'or drop a line entirely. Resubmitting revalidates against the same contract.</p>'+
   '<div class="tw mt"><table><thead><tr><th>Code</th><th>Charge</th><th>Validation</th>'+
   '<th class="num">Rate</th><th class="num">Qty</th><th>Evidence</th><th></th></tr></thead>'+
   '<tbody>'+rows+'</tbody></table></div>'+
   '<div class="sect">Add a line</div><div class="row" style="flex-wrap:wrap">'+
   '<select class="i" id="iadd" style="max-width:260px">'+addable.map(function(c){
     return '<option value="'+c+'">'+c+' \u00B7 '+esc(CH[c].l)+'</option>';}).join('')+'</select>'+
   '<input class="i" id="iaddv" type="number" placeholder="Amount" style="max-width:120px">'+
   '<input class="i" id="iaddd" type="number" placeholder="Days / hours" style="max-width:130px">'+
   '<input class="i" id="iadde" placeholder="Receipt reference" style="max-width:180px">'+
   '<input class="i" id="iaddea" type="number" placeholder="Receipt value" style="max-width:140px">'+
   '<button class="btn" onclick="addReviseLine()">Add</button></div>'+
   '<div id="xlines" class="mt"></div>'+
   '<label class="f mt"><span>Note to Gulbrandsen</span>'+
   '<input class="i" id="rNote" placeholder="e.g. documentation fee withdrawn, receipt attached for wharfage"></label>'+
   '<div id="ipreview" class="mt"></div></div>'+
   '<footer><button class="btn" onclick="closeModal()">Cancel</button>'+
   '<button class="btn pri" onclick="submitRevision()">Resubmit</button></footer>');
  revisePreview();
}
function addReviseLine(){
  var c=val('iadd'), a=numval('iaddv'), d=numval('iaddd');
  if(!a) return toast('Enter an amount');
  var ev=val('iadde')?{doc:val('iadde'),amount:numval('iaddea')||a}:null;
  EXTRA.push({code:c,amount:a,days:d||null,evidence:ev});
  $('xlines').innerHTML='<div class="card"><h3>Lines added</h3><div class="tw"><table><tbody>'+
   EXTRA.map(function(e,ix){ return '<tr><td class="mono">'+e.code+'</td><td>'+esc(CH[e.code].l)+'</td>'+
    '<td class="num">'+money(e.amount,vend(myVid()).cur)+'</td>'+
    '<td class="right"><button class="btn sm" onclick="EXTRA.splice('+ix+',1);addReviseLine.refresh()">Remove</button></td></tr>';
   }).join('')+'</tbody></table></div></div>';
  revisePreview();
}
addReviseLine.refresh=function(){ $('xlines').innerHTML=EXTRA.length?$('xlines').innerHTML:'';
  revisePreview(); };
function revisedLines(){
  var i=find(S.invoices,REVISE);
  var drop=picked('rdrop').map(Number);
  var lines=[];
  i.lines.forEach(function(l,ix){
    if(drop.indexOf(ix)>=0) return;
    var el=document.querySelector('.rrate[data-i="'+ix+'"]');
    var rate=el?(parseFloat(el.value)||0):l.rate;
    var nl=Object.assign({},l,{rate:rate,amount:rate*(l.qty||1)});
    var ev=document.querySelector('.rev[data-i="'+ix+'"]');
    if(ev){ var av=document.querySelector('.reva[data-i="'+ix+'"]');
      nl.evidence=ev.value?{doc:ev.value,amount:parseFloat(av.value)||nl.amount}:null; }
    lines.push(nl);
  });
  EXTRA.forEach(function(e){ lines.push({code:e.code,desc:CH[e.code].l,cls:CH[e.code].cls,qty:1,
    rate:e.amount,amount:e.amount,fileId:i.fileId,days:e.days,evidence:e.evidence}); });
  return lines;
}
function revisePreview(){
  var el=$('ipreview'); if(!el) return;
  var i=find(S.invoices,REVISE);
  var draft=Object.assign({},i,{id:'DRAFT',lines:revisedLines(),status:'validating',results:[]});
  recompute(draft);
  var keep=S.invoices; S.invoices=keep.filter(function(x){return x.id!==i.id;});
  runValidation(draft); S.invoices=keep;
  var bad=draft.results.filter(function(r){return r.status==='exception';});
  el.innerHTML='<div class="card" style="border-color:'+(bad.length?'#E8B4AF':'#BCE5CF')+'">'+
   '<h3>'+(bad.length?bad.length+' line'+(bad.length>1?'s':'')+' would still be rejected'
     :'This revision will pass')+'</h3><div class="pad"><div class="spread">'+
   '<div><b style="font-size:16.5px">'+money(draft.total,draft.cur)+'</b> against '+
   money(draft.expectedTotal,draft.cur)+' authorised</div>'+
   '<div>'+(bad.length?tag('bad',bad.length+' outstanding'):tag('ok','all lines match'))+'</div></div>'+
   (bad.length?'<div class="tw mt"><table><tbody>'+bad.map(function(r){
     return '<tr><td class="mono">'+r.code+'</td><td>'+esc(r.desc)+'</td>'+
      '<td><b style="color:var(--bad)">'+r.reason+'</b> '+REASONS[r.reason]+'</td>'+
      '<td class="num">'+money(r.claimed,draft.cur)+'</td>'+
      '<td class="num">'+(r.expected==null?'\u2014':money(r.expected,draft.cur))+'</td></tr>';
   }).join('')+'</tbody></table></div>':'')+'</div></div>';
}
function submitRevision(){
  var i=find(S.invoices,REVISE);
  var before=exCount(i);
  i.lines=revisedLines();
  i.version=(i.version||1)+1;
  i.status='submitted';
  i.approvals=[];
  i.history.push({at:iso(NOW),by:S.user.name,
    what:'Revision '+i.version+(val('rNote')?' \u2014 '+val('rNote'):'')});
  recompute(i); runValidation(i); EXTRA=[]; REVISE=null; closeModal(); render();
  bump('invoice',vend(i.vendorId).name+' resubmitted '+i.id+
    (exCount(i)?' \u2014 '+exCount(i)+' still rejected':' \u2014 now clean'),'invoices:'+i.id);
  toast(exCount(i)?exCount(i)+' lines still rejected':'Revision accepted',
    exCount(i)?'Correct them and resubmit again.':'It now matches the contract in full.');
}
/* vendor invoice table: a Correct action and clearer wording */
var _vinv=VIEWS.v_inv;
VIEWS.v_inv=function(){
  _vinv();
  var cfg=DTCFG['vinv'];
  cfg.rowActions=[
    {k:'o',title:'Open invoice',icon:ICO.open,fn:function(rid){ go('invoices:'+rid); }},
    {k:'fix',title:'Correct and resubmit',icon:ICO.add,fn:function(rid){
      var i=find(S.invoices,rid);
      if(['exception','disputed','submitted'].indexOf(i.status)<0)
        return toast('Nothing to correct','This invoice is already cleared.');
      reviseForm(rid); }}];
  $('view').innerHTML=buildTable(cfg);
};
/* vendors see plain language on their own service status */
var VSTATUS={awaited:['grey','Not raised'],received:['info','Submitted'],
  settled:['ok','Paid'],uncontracted:['bad','No contract']};
function vstag(s){ var m=VSTATUS[s]||['grey',s]; return tag(m[0],m[1]); }
var _vwork=VIEWS.v_work;
VIEWS.v_work=function(id){
  if(id) return vendorShipView(id);
  _vwork();
  var cfg=DTCFG['vwork'], v=vend(myVid());
  cfg.columns=cfg.columns.map(function(c){
    if(c.k!=='inv') return c;
    return {k:'inv',label:'Your invoice',render:function(f){ var s=svcOf(f,v.cat);
        return s?vstag(s.status):'\u2014';},
      val:function(f){ var s=svcOf(f,v.cat);
        return s?(VSTATUS[s.status]||[,s.status])[1]:'n/a';}};
  });
  $('view').innerHTML=buildTable(cfg);
};
seed(); renderLogin();
