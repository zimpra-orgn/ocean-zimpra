<style>
.docpill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:12px;
  font-size:11.5px;font-weight:600;border:1px solid transparent;cursor:pointer}
.docpill.ok{background:var(--okbg);color:#0A7845;border-color:#BCE5CF}
.docpill.warn{background:var(--warnbg);color:#8A6400;border-color:#F0DCA6}
.docpill.bad{background:var(--badbg);color:#B32419;border-color:#F2C4BF}
.docpill.na{background:#F0F3F7;color:var(--muted);border-color:var(--line)}
</style>
<script>
/* ============ v2.9 — documents, anchored on the bill of lading ============ */
var DOCS=[
 {k:'BOOKING',n:'Booking confirmation',own:'ocean',after:'BKG'},
 {k:'CLEANC', n:'Tank cleaning certificate',own:'tank',after:'TANKREL',
   when:function(f){ return f.equip.indexOf('Tank')>=0; }},
 {k:'DGDECL', n:'DG declaration',own:'cha',after:'GIN',
   when:function(f){ return f.imo!=='Non-hazardous'; }},
 {k:'VGMC',   n:'VGM certificate',own:'cfs',after:'VGM'},
 {k:'SB',     n:'Shipping bill with LEO',own:'cha',after:'LEO'},
 {k:'MBL',    n:'Master bill of lading',own:'ocean',after:'ATD',key:true},
 {k:'HBL',    n:'House bill of lading',own:'ocean',after:'ATD',
   when:function(f,sh){ return !!(sh&&sh.hbl); }},
 {k:'COO',    n:'Certificate of origin',own:'cha',after:'ATD'},
 {k:'ARRN',   n:'Arrival notice',own:'ocean',after:'ATA'},
 {k:'DO',     n:'Delivery order',own:'ocean',after:'CUS'}
];
var GRACE=3;
function docsFor(f){
  var sh=shipOfFile(f); f.docStore=f.docStore||{};
  return DOCS.filter(function(d){ return !d.when||d.when(f,sh); }).map(function(d){
    var ev=sh?sh.ev[d.after]:null;
    var got=f.docStore[d.k]||null;
    var age=ev?Math.floor(days(ev.at,iso(NOW))):null;
    var status = !ev ? 'notdue' : got ? 'received' : (age>GRACE?'overdue':'outstanding');
    return {d:d,due:!!ev,dueAt:ev?ev.at:null,got:got,age:age,status:status};
  });
}
function docSummary(f){
  var l=docsFor(f), due=l.filter(function(x){return x.due;});
  return {list:l,due:due.length,got:due.filter(function(x){return x.status==='received';}).length,
    overdue:due.filter(function(x){return x.status==='overdue';}).length,
    blMissing:l.some(function(x){return x.d.k==='MBL'&&x.due&&x.status!=='received';})};
}
function docPill(f){
  var s=docSummary(f);
  if(!s.due) return '<span class="docpill na">Docs</span>';
  var cls=s.overdue?'bad':(s.got===s.due?'ok':'warn');
  return '<span class="docpill '+cls+'" onclick="event.stopPropagation();docPanel(\''+f.id+
   '\')">Docs '+s.got+'/'+s.due+'</span>';
}
function docPanel(fid){
  var f=fileOf(fid), sh=shipOfFile(f), list=docsFor(f);
  var canUpload=function(x){
    if(!isVendor()) return true;
    var svc=svcOf(f,vend(myVid()).cat);
    return svc&&svc.vendorId===myVid()&&x.d.own===vend(myVid()).cat; };
  modal('<header><h2>Documents \u00B7 '+f.id+'</h2>'+
   '<span class="muted small">'+(sh?esc(sh.mbl):'not booked')+'</span>'+
   '<button class="x" onclick="closeModal()">\u00D7</button></header><div class="body">'+
   '<div class="tw"><table><thead><tr><th>Document</th><th>Owner</th><th>Due after</th>'+
   '<th>Reference</th><th>Status</th><th></th></tr></thead><tbody>'+
   list.map(function(x){
     var st = x.status==='received'?tag('ok','received'):
       x.status==='overdue'?tag('bad','overdue by '+(x.age-GRACE)+' d'):
       x.status==='outstanding'?tag('warn','outstanding'):tag('grey','not due yet');
     return '<tr'+(x.d.key?' style="background:#F4F7FA"':'')+'><td><b>'+esc(x.d.n)+'</b>'+
      (x.d.key?' <span class="tag t-info">key</span>':'')+'</td>'+
      '<td class="small">'+CAT[x.d.own].n+'</td>'+
      '<td class="small muted">'+esc(msName(x.d.after))+
       (x.dueAt?'<br>'+fdate(x.dueAt):'')+'</td>'+
      '<td class="mono small">'+(x.got?esc(x.got.ref)+'<br><span class="tiny muted">'+
        esc(x.got.by)+' \u00B7 '+fdate(x.got.at)+'</span>':'\u2014')+'</td>'+
      '<td>'+st+'</td>'+
      '<td class="right">'+(x.due&&canUpload(x)
        ? '<button class="btn sm '+(x.got?'':'pri')+'" onclick="uploadDoc(\''+f.id+'\',\''+x.d.k+
          '\')">'+(x.got?'Replace':'Attach')+'</button>':'')+'</td></tr>';
   }).join('')+'</tbody></table></div>'+
   '<p class="small muted mt">The master bill of lading is the key document. An ocean freight invoice '+
   'is held until it is on file, because the bill is what proves the carriage the invoice bills for.</p>'+
   '</div><footer><button class="btn pri" onclick="closeModal()">Done</button></footer>');
}
function uploadDoc(fid,k){
  var f=fileOf(fid), sh=shipOfFile(f), d=DOCS.filter(function(x){return x.k===k;})[0];
  var suggest = k==='MBL'&&sh ? sh.mbl : k==='HBL'&&sh ? sh.hbl :
    k==='BOOKING'&&sh ? sh.booking : k+'-'+ri(100000,999999);
  modal('<header><h2>Attach '+esc(d.n)+'</h2><button class="x" onclick="closeModal()">\u00D7</button></header>'+
   '<div class="body"><div class="grid g2">'+
   '<label class="f"><span>Document reference</span><input class="i" id="dref" value="'+
   esc(suggest)+'"></label>'+
   '<label class="f"><span>Issue date</span><input class="i" id="ddate" type="date" value="'+
   iso(NOW).slice(0,10)+'"></label></div>'+
   '<p class="small muted">The prototype records the reference and who filed it. A production build '+
   'would store the file itself against this shipment file.</p></div>'+
   '<footer><button class="btn" onclick="closeModal()">Cancel</button>'+
   '<button class="btn pri" onclick="saveDoc(\''+fid+'\',\''+k+'\')">Attach</button></footer>');
}
function saveDoc(fid,k){
  var f=fileOf(fid), ref=val('dref');
  if(!ref) return toast('A reference is required');
  f.docStore=f.docStore||{};
  f.docStore[k]={ref:ref,at:val('ddate')||iso(NOW),by:S.user.name};
  S.invoices.filter(function(i){ return i.fileId===f.id||
    i.lines.some(function(l){return l.fileId===f.id;}); }).forEach(runValidation);
  closeModal(); render();
  bump('document',DOCS.filter(function(x){return x.k===k;})[0].n+' attached to '+f.id,'files:'+f.id);
  toast('Document attached',ref);
}
/* an ocean invoice is held until the master bill is on file */
var _rv3=runValidation;
runValidation=function(inv){
  var r=_rv3(inv);
  if(inv.cat!=='ocean'||!inv.fileId) return r;
  var f=fileOf(inv.fileId); if(!f) return r;
  var s=docSummary(f);
  if(!s.blMissing) return r;
  var ix=inv.lines.findIndex(function(l){return l.code==='OFR';});
  if(ix<0) return r;
  var res=inv.results[ix]; if(!res) return r;
  res.status='exception'; res.reason='R07';
  res.basis='Master bill of lading not on file for '+f.id;
  inv.expectedTotal=sum(inv.results.map(function(x){return x.expected||0;}));
  inv.variance=inv.total-inv.expectedTotal;
  if(['submitted','approved','validating','exception'].indexOf(inv.status)>=0){
    inv.status='exception';
    inv.approvals=(inv.approvals||[]).filter(function(a){return a.role!=='Straight-through';});
  }
  return r;
};
/* seed documents against the generated history */
(function seedDocs(){
  var _s=seed;
  seed=function(){
    _s();
    RS=424242;
    S.files.forEach(function(f){
      f.docStore={};
      docsFor(f).forEach(function(x){
        if(!x.due) return;
        var p = x.d.key?0.9:0.84;
        if(rnd()<p) f.docStore[x.d.k]={ref:
          x.d.k==='MBL'?shipOfFile(f).mbl:
          x.d.k==='HBL'?(shipOfFile(f).hbl||'HBL'+ri(100000,999999)):
          x.d.k==='BOOKING'?shipOfFile(f).booking:x.d.k+'-'+ri(100000,999999),
          at:x.dueAt,by:vend(svcOf(f,x.d.own)&&svcOf(f,x.d.own).vendorId?
            svcOf(f,x.d.own).vendorId:ocOf(f.ocId).vendorId).name};
      });
    });
    S.invoices.forEach(function(i){ if(i.status!=='paid') runValidation(i); });
    makePayments();          /* sweep anything the document rule had been holding */
  };
})();
seed(); renderLogin();
</script>
<script>
/* ============ documents surfaced in the tables and detail screens ============ */
function addDocCols(cfgId,fileOfRow){
  var cfg=DTCFG[cfgId]; if(!cfg) return;
  cfg.columns.splice(1,0,
    {k:'docs',label:'Docs',nofilter:true,render:function(r){ return docPill(fileOfRow(r)); },
     sortVal:function(r){ var s=docSummary(fileOfRow(r));
       return s.due?(s.overdue?-1:s.got/s.due):2; },
     val:function(r){ var s=docSummary(fileOfRow(r));
       return !s.due?'none due':s.overdue?'overdue':s.got===s.due?'complete':'outstanding'; }},
    {k:'bl',label:'Master B/L',render:function(r){ var f=fileOfRow(r), sh=shipOfFile(f);
       var st=docsFor(f).filter(function(x){return x.d.k==='MBL';})[0];
       if(!sh) return '<span class="muted">not booked</span>';
       return '<span class="mono">'+esc(sh.mbl)+'</span><br>'+
        (st&&st.status==='received'?'<span class="tiny" style="color:var(--ok)">on file</span>'
         :st&&st.due?'<span class="tiny" style="color:var(--bad)">not filed</span>'
         :'<span class="tiny muted">not due</span>'); },
     val:function(r){ var f=fileOfRow(r), sh=shipOfFile(f);
       var st=docsFor(f).filter(function(x){return x.d.k==='MBL';})[0];
       return sh?(st&&st.status==='received'?'on file':st&&st.due?'not filed':'not due'):'not booked'; }});
  cfg.chipGroups=cfg.chipGroups||[];
  var g=cfg.chipGroups.filter(function(x){return x.tone==='warn';})[0];
  if(g){
    g.chips.push({k:'nobl',label:'B/L not filed',col:'#E0362A',
      f:function(r){ return docSummary(fileOfRow(r)).blMissing; }});
    g.chips.push({k:'docov',label:'Documents overdue',col:'#E0A100',
      f:function(r){ return docSummary(fileOfRow(r)).overdue>0; }});
  }
}
var _trk=VIEWS.tracking;
VIEWS.tracking=function(id){
  if(id) return shipDetail(id);
  _trk();
  addDocCols('tracking',function(s){ return fileOfOC(s.ocId); });
  $('view').innerHTML=buildTable(DTCFG['tracking']);
};
var _fls=VIEWS.files;
VIEWS.files=function(id){
  if(id) return fileDetail(id);
  _fls();
  addDocCols('files',function(f){ return f; });
  $('view').innerHTML=buildTable(DTCFG['files']);
};
var _vwk=VIEWS.v_work;
VIEWS.v_work=function(id){
  if(id) return vendorShipView(id);
  _vwk();
  var cfg=DTCFG['vwork'], v=vend(myVid());
  cfg.columns.splice(1,0,{k:'docs',label:'Your documents',nofilter:true,
    render:function(f){ var mine=docsFor(f).filter(function(x){return x.d.own===v.cat&&x.due;});
      if(!mine.length) return '<span class="docpill na">none</span>';
      var got=mine.filter(function(x){return x.status==='received';}).length;
      var ov=mine.filter(function(x){return x.status==='overdue';}).length;
      return '<span class="docpill '+(ov?'bad':got===mine.length?'ok':'warn')+
       '" onclick="event.stopPropagation();docPanel(\''+f.id+'\')">Docs '+got+'/'+mine.length+'</span>'; },
    val:function(f){ var mine=docsFor(f).filter(function(x){return x.d.own===v.cat&&x.due;});
      if(!mine.length) return 'none due';
      var got=mine.filter(function(x){return x.status==='received';}).length;
      return got===mine.length?'complete':'outstanding'; }});
  var g=(cfg.chipGroups||[])[0];
  if(g) g.chips.push({k:'docdue',label:'Document outstanding',col:'#E0362A',
    f:function(f){ return docsFor(f).some(function(x){
      return x.d.own===v.cat&&x.due&&x.status!=='received'; }); }});
  $('view').innerHTML=buildTable(cfg);
};
/* shipment detail */
var _shd=shipDetail;
shipDetail=function(id){
  _shd(id);
  var s=find(S.shipments,id); if(!s) return;
  var f=fileOfOC(s.ocId), list=docsFor(f), sum2=docSummary(f);
  $('top').querySelector('.topright').insertAdjacentHTML('afterbegin',
    '<button class="btn" onclick="docPanel(\''+f.id+'\')">Documents '+sum2.got+'/'+sum2.due+'</button> ');
  $('view').insertAdjacentHTML('beforeend',
   '<div class="card mt"><h3>Documents'+(sum2.blMissing?' '+tag('bad','master B/L not filed'):'')+
   '<button class="btn sm" style="margin-left:auto" onclick="docPanel(\''+f.id+
   '\')">Manage</button></h3><div class="tw"><table><thead><tr><th>Document</th><th>Owner</th>'+
   '<th>Due after</th><th>Reference</th><th>Filed</th><th>Status</th></tr></thead><tbody>'+
   list.map(function(x){
     return '<tr'+(x.d.key?' style="background:#F4F7FA"':'')+'><td><b>'+esc(x.d.n)+'</b>'+
      (x.d.key?' <span class="tag t-info">key</span>':'')+'</td>'+
      '<td class="small">'+CAT[x.d.own].n+'</td>'+
      '<td class="small muted">'+esc(msName(x.d.after))+'</td>'+
      '<td class="mono small">'+(x.got?esc(x.got.ref):'\u2014')+'</td>'+
      '<td class="small">'+(x.got?fdate(x.got.at)+'<br><span class="tiny muted">'+
        esc(x.got.by)+'</span>':'\u2014')+'</td>'+
      '<td>'+(x.status==='received'?tag('ok','received'):
        x.status==='overdue'?tag('bad','overdue by '+(x.age-GRACE)+' d'):
        x.status==='outstanding'?tag('warn','outstanding'):tag('grey','not due yet'))+'</td></tr>';
   }).join('')+'</tbody></table></div></div>');
};
/* shipment file detail */
var _fd2=fileDetail;
fileDetail=function(id){
  _fd2(id);
  var f=fileOf(id); if(!f) return;
  var sum2=docSummary(f);
  $('top').querySelector('.topright').insertAdjacentHTML('afterbegin',
    '<button class="btn" onclick="docPanel(\''+f.id+'\')">Documents '+sum2.got+'/'+sum2.due+'</button> ');
  var sh=shipOfFile(f);
  $('view').insertAdjacentHTML('beforeend',
   '<div class="card mt"><h3>Documents'+(sum2.blMissing?' '+tag('bad','master B/L not filed'):'')+
   '<button class="btn sm pri" style="margin-left:auto" onclick="docPanel(\''+f.id+
   '\')">Manage</button></h3><div class="tw"><table><thead><tr><th>Document</th><th>Owner</th>'+
   '<th>Reference</th><th>Status</th></tr></thead><tbody>'+
   docsFor(f).map(function(x){
     return '<tr><td>'+esc(x.d.n)+(x.d.key?' <span class="tag t-info">key</span>':'')+'</td>'+
      '<td class="small">'+CAT[x.d.own].n+'</td>'+
      '<td class="mono small">'+(x.got?esc(x.got.ref):'\u2014')+'</td>'+
      '<td>'+(x.status==='received'?tag('ok','received'):
        x.status==='overdue'?tag('bad','overdue'):
        x.status==='outstanding'?tag('warn','outstanding'):tag('grey','not due yet'))+'</td></tr>';
   }).join('')+'</tbody></table></div>'+
   (sh?'<div class="pad small muted" style="border-top:1px solid var(--line2)">Booking '+
     esc(sh.booking)+' \u00B7 Master B/L '+esc(sh.mbl)+
     (sh.hbl?' \u00B7 House B/L '+esc(sh.hbl):'')+'</div>':'')+'</div>');
};
/* dashboard: documents outstanding */
var _dops=dashOps;
dashOps=function(){
  _dops();
  var rows=[];
  S.files.forEach(function(f){ docsFor(f).forEach(function(x){
    if(x.due&&x.status!=='received') rows.push({f:f,x:x}); }); });
  rows.sort(function(a,b){ return (b.x.age||0)-(a.x.age||0); });
  $('view').insertAdjacentHTML('beforeend',
   '<div class="card mt"><h3>Documents outstanding</h3><div class="tw"><table><thead><tr>'+
   '<th>File</th><th>Shipment</th><th>Document</th><th>Owed by</th><th>Due after</th>'+
   '<th class="num">Days</th><th>Status</th></tr></thead><tbody>'+
   (rows.length?rows.slice(0,14).map(function(r){
     var svc=svcOf(r.f,r.x.d.own);
     return '<tr class="clk" onclick="go(\'files:'+r.f.id+'\')"><td><b>'+r.f.id+'</b></td>'+
      '<td>'+(r.f.shipmentId||'\u2014')+'</td>'+
      '<td>'+esc(r.x.d.n)+(r.x.d.key?' <span class="tag t-info">key</span>':'')+'</td>'+
      '<td>'+(svc&&svc.vendorId?esc(vend(svc.vendorId).name):CAT[r.x.d.own].n)+'</td>'+
      '<td class="small muted">'+esc(msName(r.x.d.after))+'</td>'+
      '<td class="num">'+(r.x.age||0)+'</td>'+
      '<td>'+(r.x.status==='overdue'?tag('bad','overdue'):tag('warn','outstanding'))+'</td></tr>';
   }).join(''):'<tr><td colspan="7" class="empty">Every due document is on file.</td></tr>')+
   '</tbody></table></div></div>');
};
seed(); renderLogin();
</script>

<script>
/* ============ v3.1 — real attachments, reference extraction, expiry ============ */
DOCS.push({k:'INSC',n:'Marine insurance certificate',own:'ocean',after:'ATD',expires:true,
  when:function(f){ return ['CIF','CIP'].indexOf(f.incoterm)>=0; }});
DOCS.filter(function(d){return d.k==='DGDECL';}).forEach(function(d){ d.expires=true; });
var EXPIRY_WARN=30;

/* pull a document reference out of a filename */
function refFromName(name){
  if(!name) return '';
  var base=name.replace(/\.[a-z0-9]{1,5}$/i,'').replace(/[_\s]+/g,'-');
  var m=base.match(/\b[A-Z]{3,4}[A-Z0-9]{0,4}\d{6,12}\b/i);      /* carrier style B/L */
  if(m) return m[0].toUpperCase();
  m=base.match(/\b[A-Z0-9]{8,20}\b/i);
  if(m) return m[0].toUpperCase();
  return base.slice(0,28);
}
function fmtBytes(n){ return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'; }

uploadDoc=function(fid,k){
  var f=fileOf(fid), sh=shipOfFile(f), d=DOCS.filter(function(x){return x.k===k;})[0];
  var cur=(f.docStore||{})[k];
  var suggest = cur?cur.ref : k==='MBL'&&sh?sh.mbl : k==='HBL'&&sh?sh.hbl :
    k==='BOOKING'&&sh?sh.booking : '';
  modal('<header><h2>'+(cur?'Replace':'Attach')+' \u00B7 '+esc(d.n)+'</h2>'+
   '<span class="muted small">'+f.id+(sh?' \u00B7 '+esc(sh.mbl):'')+'</span>'+
   '<button class="x" onclick="closeModal()">\u00D7</button></header><div class="body">'+
   '<label class="f"><span>Document file</span>'+
   '<input class="i" id="dfile" type="file" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff" '+
   'onchange="pickedFile()"></label>'+
   '<div id="dfileinfo" class="small muted"></div>'+
   '<div class="grid g2 mt">'+
   '<label class="f"><span>Document reference '+
   '<em>read from the filename, correct it if needed</em></span>'+
   '<input class="i" id="dref" value="'+esc(suggest)+'"></label>'+
   '<label class="f"><span>Issue date</span><input class="i" id="ddate" type="date" value="'+
   (cur&&cur.at?cur.at.slice(0,10):iso(NOW).slice(0,10))+'"></label>'+
   (d.expires?'<label class="f"><span>Valid until <em>required</em></span>'+
     '<input class="i" id="dexp" type="date" value="'+
     (cur&&cur.expiry?cur.expiry:iso(addD(NOW,180)).slice(0,10))+'"></label>':'')+
   '</div>'+
   (k==='MBL'&&sh?'<p class="small muted">The reference must match the master bill on the shipment, '+
     '<span class="mono">'+esc(sh.mbl)+'</span>. A mismatch is flagged rather than blocked, since '+
     'amended bills are common.</p>':'')+
   '</div><footer><button class="btn" onclick="closeModal()">Cancel</button>'+
   '<button class="btn pri" onclick="saveDoc(\''+fid+'\',\''+k+'\')">'+
   (cur?'Replace':'Attach')+'</button></footer>');
};
var PICKED=null;
function pickedFile(){
  var el=$('dfile'); PICKED=null;
  if(!el||!el.files||!el.files.length){ $('dfileinfo').innerHTML=''; return; }
  var file=el.files[0];
  PICKED={name:file.name,size:file.size,type:file.type||'application/octet-stream'};
  $('dfileinfo').innerHTML='<b>'+esc(file.name)+'</b> \u00B7 '+fmtBytes(file.size);
  var guess=refFromName(file.name);
  var r=$('dref');
  if(r&&guess&&!r.dataset.touched){ r.value=guess;
    $('dfileinfo').innerHTML+=' \u00B7 reference read as <span class="mono">'+esc(guess)+'</span>'; }
  if(r) r.onchange=function(){ this.dataset.touched='1'; };
  if(file.size<=400000&&window.FileReader){
    var fr=new FileReader();
    fr.onload=function(){ if(PICKED) PICKED.data=fr.result; };
    fr.readAsDataURL(file);
  }
}
saveDoc=function(fid,k){
  var f=fileOf(fid), ref=val('dref'), sh=shipOfFile(f);
  var d=DOCS.filter(function(x){return x.k===k;})[0];
  if(!ref) return toast('A reference is required');
  if(d.expires&&!val('dexp')) return toast('A validity date is required for this document');
  f.docStore=f.docStore||{};
  var rec={ref:ref,at:val('ddate')||iso(NOW),by:S.user.name};
  if(d.expires) rec.expiry=val('dexp');
  if(PICKED) rec.file={name:PICKED.name,size:PICKED.size,type:PICKED.type,data:PICKED.data||null};
  f.docStore[k]=rec; PICKED=null;
  var warn='';
  if(k==='MBL'&&sh&&ref.replace(/\s/g,'').toUpperCase()!==sh.mbl.toUpperCase())
    warn=' Reference differs from the master bill on the shipment.';
  S.invoices.filter(function(i){ return i.fileId===f.id||
    i.lines.some(function(l){return l.fileId===f.id;}); }).forEach(runValidation);
  closeModal(); render();
  bump('document',d.n+' attached to '+f.id+(rec.file?' ('+rec.file.name+')':''),'files:'+f.id);
  toast('Document attached',ref+(rec.file?' \u00B7 '+rec.file.name:'')+warn);
};
/* expiry folds into document status */
var _docsFor=docsFor;
docsFor=function(f){
  var list=_docsFor(f);
  list.forEach(function(x){
    if(!x.got||!x.d.expires||!x.got.expiry) return;
    var left=Math.floor(days(iso(NOW),x.got.expiry));
    x.daysLeft=left;
    if(left<0) x.status='expired';
    else if(left<=EXPIRY_WARN) x.status='expiring';
  });
  return list;
};
var _docSummary=docSummary;
docSummary=function(f){
  var s=_docSummary(f);
  var l=docsFor(f), due=l.filter(function(x){return x.due;});
  s.list=l;
  s.got=due.filter(function(x){return x.status==='received'||x.status==='expiring';}).length;
  s.overdue=due.filter(function(x){return x.status==='overdue'||x.status==='expired';}).length;
  s.expiring=due.filter(function(x){return x.status==='expiring';}).length;
  s.expired=due.filter(function(x){return x.status==='expired';}).length;
  return s;
};
function docTag(x){
  if(x.status==='received') return tag('ok','on file');
  if(x.status==='expiring') return tag('warn','expires in '+x.daysLeft+' d');
  if(x.status==='expired') return tag('bad','expired '+Math.abs(x.daysLeft)+' d ago');
  if(x.status==='overdue') return tag('bad','overdue by '+(x.age-GRACE)+' d');
  if(x.status==='outstanding') return tag('warn','outstanding');
  return tag('grey','not due yet');
}
/* rewrite the panel so it shows the attachment and the validity */
docPanel=function(fid){
  var f=fileOf(fid), sh=shipOfFile(f), list=docsFor(f);
  var canUpload=function(x){
    if(!isVendor()) return true;
    var svc=svcOf(f,vend(myVid()).cat);
    return svc&&svc.vendorId===myVid()&&x.d.own===vend(myVid()).cat; };
  modal('<header><h2>Documents \u00B7 '+f.id+'</h2>'+
   '<span class="muted small">'+(sh?esc(sh.mbl):'not booked')+'</span>'+
   '<button class="x" onclick="closeModal()">\u00D7</button></header><div class="body">'+
   '<div class="tw"><table><thead><tr><th>Document</th><th>Owner</th><th>Due after</th>'+
   '<th>Reference</th><th>File</th><th>Validity</th><th>Status</th><th></th></tr></thead><tbody>'+
   list.map(function(x){
     var att=x.got&&x.got.file;

/* an expired document is treated as not on file */
var _rv4=runValidation;
runValidation=function(inv){
  var r=_rv4(inv);
  if(inv.cat!=='ocean'||!inv.fileId) return r;
  var f=fileOf(inv.fileId); if(!f) return r;
  var bl=docsFor(f).filter(function(x){return x.d.k==='MBL';})[0];
  if(!bl||!bl.due||bl.status==='received') return r;
  var ix=inv.lines.findIndex(function(l){return l.code==='OFR';});

  res.status='exception'; res.reason='R07';
  res.basis='Master bill of lading not on file for '+f.id;
  inv.expectedTotal=sum(inv.results.map(function(x){return x.expected||0;}));
  inv.variance=inv.total-inv.expectedTotal;
  if(['submitted','approved','validating','exception'].indexOf(inv.status)>=0){
    inv.status='exception';
    inv.approvals=(inv.approvals||[]).filter(function(a){return a.role!=='Straight-through';});

};

<script>
/* ============ v3.2 — shared session across windows ============ */
var SYNC={key:'zimpra_ofmp_state',pkey:'zimpra_ofmp_windows',
  win:'W'+Math.random().toString(36).slice(2,8),ls:false,last:null,peers:1,adopted:false};
(function(){ try{ localStorage.setItem('__z','1'); localStorage.removeItem('__z'); SYNC.ls=true; }
  catch(e){ SYNC.ls=false; } })();

function packState(){ return JSON.stringify({rev:S.rev||0,now:NOW.toISOString(),
  by:S.user?S.user.name:'',win:SYNC.win,state:S}); }
function pushState(){
  if(!SYNC.ls) return;
  try{ localStorage.setItem(SYNC.key,packState()); SYNC.last=Date.now(); }
  catch(e){ if(String(e).indexOf('Quota')>=0) SYNC.ls=false; }
}
function applyRemote(d){
  var keep={user:S.user?S.user.id:null,route:S.route,dt:S.dt,setTab:S.setTab,dashTab:S.dashTab,
    bidFilter:S.bidFilter,invFilter:S.invFilter,shipFilter:S.shipFilter,shipQ:S.shipQ,
    payHorizon:S.payHorizon};
  MUTING=true;
  NOW=new Date(d.now); S=d.state;
  S.user=keep.user?find(S.users,keep.user):null;
  S.route=keep.route; S.dt=keep.dt; S.setTab=keep.setTab; S.dashTab=keep.dashTab;
  S.bidFilter=keep.bidFilter; S.invFilter=keep.invFilter; S.shipFilter=keep.shipFilter;
  S.shipQ=keep.shipQ; S.payHorizon=keep.payHorizon;
  MUTING=false;
}
function pullState(announce){
  if(!SYNC.ls) return false;
  var raw; try{ raw=localStorage.getItem(SYNC.key); }catch(e){ return false; }
  if(!raw) return false;
  var d; try{ d=JSON.parse(raw); }catch(e){ return false; }
  if(!d||!d.state) return false;
  if(d.win===SYNC.win) return false;
  if((d.rev||0)<=(S.rev||0)) return false;
  var last=d.state.activity&&d.state.activity[0];
  applyRemote(d);
  if(S.user){ render();
    if(announce&&last) toast(esc(d.by||'Another user')+' made a change',last.text); }
  return true;
}
/* presence, so the chip can say how many windows are joined */
function heartbeat(){
  if(!SYNC.ls) return;
  try{
    var m=JSON.parse(localStorage.getItem(SYNC.pkey)||'{}');
    m[SYNC.win]={t:Date.now(),who:S.user?S.user.name:'signed out'};
    var cut=Date.now()-9000;
    Object.keys(m).forEach(function(k){ if(m[k].t<cut) delete m[k]; });
    localStorage.setItem(SYNC.pkey,JSON.stringify(m));
    SYNC.peers=Object.keys(m).length;
    SYNC.who=Object.keys(m).map(function(k){return m[k].who;});
  }catch(e){}
}
/* every mutation stamps a monotonic revision and publishes everywhere */
bump=function(type,text,refs){
  S.rev=Math.max((S.rev||0)+1,Date.now());
  S.activity=S.activity||[];
  S.activity.unshift({id:uid('A'),rev:S.rev,at:iso(NOW),by:S.user?S.user.name:'System',
    org:S.user?S.user.org:'',type:type,text:text,ref:refs||null});
  if(S.activity.length>250) S.activity.pop();
  publish();
};
publish=function(){
  if(MUTING) return;
  if(BC){ try{ BC.postMessage({rev:S.rev,now:NOW.toISOString(),state:JSON.parse(JSON.stringify(S))}); }catch(e){} }
  pushState();
};
if(SYNC.ls){
  window.addEventListener('storage',function(e){ if(e.key===SYNC.key) pullState(true); });
  setInterval(function(){ pullState(true); heartbeat(); },1500);
  heartbeat();
}
/* the live chip reports the real state of the session */
liveChip=function(){
  var n=unread();
  var joined=SYNC.ls?SYNC.peers:1;
  var label=!SYNC.ls?'This window only':(joined>1?'Live \u00B7 '+joined+' windows':'Live');
  var col=!SYNC.ls?'var(--warn)':'var(--ok)';
  return '<button class="live" onclick="openFeed()" title="'+
   (SYNC.ls?'Shared session. Changes made in any window appear here.'
     :'This browser is blocking shared storage, so windows cannot sync.')+'">'+
   '<span class="pulse" style="background:'+col+'"></span>'+label+
   (n?' <span class="bdg">'+n+'</span>':'')+'</button>';
};
/* the feed explains and controls the session */
var _openFeed=openFeed;
openFeed=function(){
  _openFeed();
  var body=$('layer').querySelector('.feed .body');
  if(!body) return;
  var joined=SYNC.ls?SYNC.peers:1;
  body.insertAdjacentHTML('afterbegin',
   '<div style="padding:12px 18px;border-bottom:1px solid var(--line2);background:#F8FAFC">'+
   '<div class="spread"><div><b>'+(SYNC.ls?'Shared session':'Not shared')+'</b>'+
   '<div class="tiny muted">'+(SYNC.ls
     ? joined+' window'+(joined>1?'s':'')+' joined'+
       (SYNC.who&&SYNC.who.length?' \u2014 '+SYNC.who.join(', '):'')+
       '. Every change is published within a second or two.'
     : 'This browser blocks shared storage for local files, so a second window keeps its own copy. '+
       'Use one window and switch accounts with Sign out.')+'</div></div>'+
   '<div class="row">'+(SYNC.ls?'<button class="btn sm" onclick="syncNow()">Sync now</button>':'')+
   '<button class="btn sm bad" onclick="resetShared()">Reset session</button></div></div></div>');
};
function syncNow(){
  var got=pullState(false);
  if(!got) pushState();
  closeFeed();
  toast(got?'Pulled the latest changes':'This window is already current',
    got?'':'Your view has been published to the other windows.');
}
function resetShared(){
  try{ localStorage.removeItem(SYNC.key); localStorage.removeItem(SYNC.pkey); }catch(e){}
  closeModal(); seed(); S.user=find(S.users,'U1'); S.route='overview';
  S.rev=Date.now(); publish(); render();
  toast('Session reset','Every window will pick up the fresh data.');
}
/* resetting the demo resets the shared session too */
var _reset=resetDemo;
resetDemo=function(){ _reset(); S.rev=Date.now(); publish(); };
/* a window that opens after another adopts the shared state instead of its own seed */
(function boot(){
  if(!SYNC.ls) return;
  var raw; try{ raw=localStorage.getItem(SYNC.key); }catch(e){ return; }
  if(!raw) { S.rev=S.rev||Date.now(); pushState(); return; }
  try{
    var d=JSON.parse(raw);
    if(d&&d.state&&(d.rev||0)>(S.rev||0)){ applyRemote(d); SYNC.adopted=true; }
  }catch(e){}
})();
/* signing in publishes presence so the other window sees who joined */
var _signIn=signIn;
signIn=function(id){ _signIn(id); heartbeat(); pullState(false); render(); };
var _signOut=signOut;
signOut=function(){ _signOut(); heartbeat(); };
renderLogin();
</script>

function regionFor(code,given){
  if(given) return given;
  return CREG[code.slice(0,2)]||'Other';
}
function addPort(code,name,region,src){
  code=String(code).toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==5) return false;
  var r=regionFor(code,region);
  var existed=!!PORTS[code];
  PORTS[code]={n:name,r:r,src:src||(existed?PORTS[code].src:'built-in'),
    icd:/ICD$/i.test(name)||/ICD/.test(name)};
  if(TARIFF.THCD[code]==null) TARIFF.THCD[code]=THC_REGION[r]||THC_REGION.Other;
  return true;
}

function portFilePicked(){
  var el=$('pfile'); if(!el||!el.files||!el.files.length) return;
  var fr=new FileReader();
  fr.onload=function(){ $('pcsv').value=String(fr.result).slice(0,4000000); portPreview(); };
  fr.readAsText(el.files[0]);
}
function splitCsv(line){
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){ if(q&&line[i+1]==='"'){ cur+='"'; i++; } else q=!q; }
    else if(c===','&&!q){ out.push(cur); cur=''; }
    else cur+=c;
  }
  out.push(cur); return out.map(function(x){return x.trim();});
}
function parsePorts(){
  var raw=val('pcsv').split(/\r?\n/).filter(function(l){return l.trim();});
  var only=$('ponly')?$('ponly').checked:true;
  var out=[],skipped=0,bad=0;
  raw.forEach(function(line){
    var c=splitCsv(line);
    if(c.length>=11){                                   /* UNECE code list */
      var country=(c[1]||'').toUpperCase(), loc=(c[2]||'').toUpperCase();
      var name=c[3]||c[4]||'', fn=c[6]||'';
      if(!country||!loc||loc.length!==3){ bad++; return; }
      if(only&&fn.indexOf('1')<0){ skipped++; return; }
      out.push({code:country+loc,n:name,r:CREG[country]||'Other'});
    } else if(c.length>=2){                              /* simple list */
      var code=(c[0]||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(code.length!==5){ bad++; return; }
      out.push({code:code,n:c[1],r:c[2]||CREG[code.slice(0,2)]||'Other'});
    } else bad++;
  });
  return {rows:out,skipped:skipped,bad:bad};
}
function portPreview(){
  var r=parsePorts(), ow=$('poverwrite')&&$('poverwrite').checked;
  var neu=r.rows.filter(function(x){return !PORTS[x.code];}).length;
  var dup=r.rows.length-neu;
  $('pprev').innerHTML='<div class="card"><h3>Preview</h3><div class="pad">'+
   '<dl class="kv">'+
   [['Rows read',r.rows.length],['New ports',neu],
    ['Already in the master',dup+(ow?', will be overwritten':', will be skipped')],
    ['Skipped, not a seaport',r.skipped],['Unreadable rows',r.bad]]
   .map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>';}).join('')+'</dl>'+
   (r.rows.length?'<div class="tw mt"><table><thead><tr><th>Code</th><th>Port</th><th>Region</th>'+
     '</tr></thead><tbody>'+r.rows.slice(0,8).map(function(x){
       return '<tr><td class="mono">'+esc(x.code)+'</td><td>'+esc(x.n)+'</td>'+
        '<td>'+esc(x.r)+'</td></tr>';}).join('')+'</tbody></table></div>'+
     (r.rows.length>8?'<p class="tiny muted mt8">Showing the first 8 of '+r.rows.length+'.</p>':'')
     :'')+'</div></div>';
}
function portRunImport(){
  var r=parsePorts(), ow=$('poverwrite')&&$('poverwrite').checked, n=0;
  r.rows.forEach(function(x){
    if(PORTS[x.code]&&!ow) return;
    if(addPort(x.code,x.n,x.r,'UN/LOCODE import')) n++; });
  closeModal(); S.setTab='ports'; render();
  bump('master',n+' ports imported into the master');
  toast(n+' ports imported',
    'The master now holds '+Object.keys(PORTS).length+' ports.'+
    (r.skipped?' '+r.skipped+' non-seaport rows were skipped.':''));
}

function regionFor(country,lat,lon){
  if(country==='India'){
    if(lat>=17.5&&lon<74) return 'West India';
    if(lat<17.5) return 'South India';
    if(lon>=80) return 'East India';
    return 'North India';
  }
  if(country==='United States'){
    if(lon<=-114) return 'US West Coast';
    if(lat<=31&&lon<=-82) return 'US Gulf';
    return 'US East Coast';
  }
  return REGION_BY_COUNTRY[country]||country;
}

<script>
/* ============ v3.5 — single authoritative plant master ============ */
/* Verified against Gulbrandsen's published site information. Three Indian
   manufacturing sites, all in Gujarat, plus the group headquarters. */
PLANTS={
  P1:{n:'Dahej',entity:'Gulbrandsen Chemicals Pvt. Ltd.',
      addr:'GIDC Dahej III, Dahej \u2013 Amod Road, Tal. Vagra',
      dist:'Bharuch',state:'Gujarat',pin:'392130',
      port:'INHZA',alt:'INMUN',gstin:'24AAACG1234A1Z5',
      makes:'Aluminium alkyls, tin catalysts, polyethylene wax, functional polymers'},
  P2:{n:'Jhagadia',entity:'Gulbrandsen Technologies (India) Pvt. Ltd.',
      addr:'Plot No. 761/A, GIDC Estate, Jhagadia',
      dist:'Bharuch',state:'Gujarat',pin:'393110',
      port:'INHZA',alt:'INMUN',gstin:'24AAACG5678B1Z3',
      makes:'Aluminium chlorohydrate, poly-aluminium chloride, water treatment chemicals'},
  P3:{n:'Padra',entity:'Gulbrandsen Chemicals Pvt. Ltd.',
      addr:'On Coastal Highway, Village Mujpur, Tal. Padra',
      dist:'Vadodara',state:'Gujarat',pin:'391440',
      port:'INMUN',alt:'INNSA',gstin:'24AAACG1234A1Z5',
      makes:'Polyethylene wax, specialty polymers, tin products'}
};
HQ={n:'Orangeburg, South Carolina, United States',note:'Group headquarters'};

/* place of supply follows the plant, so a site outside Gujarat is inter-state */
function plantOfFile(f){ return f&&PLANTS[f.plant]?PLANTS[f.plant]:null; }
plantOfInvoice=function(inv){
  var f=inv.fileId?fileOf(inv.fileId):null;
  if(!f&&inv.lines&&inv.lines.length&&inv.lines[0].fileId) f=fileOf(inv.lines[0].fileId);
  return plantOfFile(f);
};
taxBreak=function(inv){
  var v=vend(inv.vendorId);
  var taxable=sum(inv.lines.filter(function(l){
    return l.cls!=='statutory'&&l.cls!=='disb'; }).map(function(l){return l.amount;}));
  var pl=plantOfInvoice(inv);
  var pos=pl?pl.state:GULBRANDSEN_STATE;
  var out={taxable:taxable,components:[],total:0,rcm:false,note:'',pos:pos,
    plant:pl?pl.n:null,gstin:pl?pl.gstin:null};
  if(v.tax==='export_zero'){
    out.note='Export of service, zero rated. No GST charged.'; return out; }
  if(v.tax==='gta5'){
    out.rcm=true; out.total=Math.round(taxable*GST_RATES.gta/100);
    out.components.push({label:'IGST '+GST_RATES.gta+'% (reverse charge)',
      rate:GST_RATES.gta,amount:out.total});
    out.note='Goods transport agency. Paid directly by Gulbrandsen under reverse charge '+
      'and withheld from the vendor.';
    return out; }
  var rate=GST_RATES.service;
  if((v.state||'')===pos){
    var half=Math.round(taxable*rate/200);
    out.components.push({label:'CGST '+(rate/2)+'%',rate:rate/2,amount:half});
    out.components.push({label:'SGST '+(rate/2)+'%',rate:rate/2,amount:half});
    out.total=half*2;
    out.note='Intra-state supply. Vendor and place of supply both in '+pos+
      (pl?', '+pl.n+' site':'')+'.';
  } else {
    out.total=Math.round(taxable*rate/100);
    out.components.push({label:'IGST '+rate+'%',rate:rate,amount:out.total});
    out.note='Inter-state supply. Vendor registered in '+(v.state||'another state')+
      ', place of supply '+pos+(pl?', '+pl.n+' site':'')+'.';
  }
  return out;
};
/* the plant record on the shipment file and the bid detail */
var _fdPlant=fileDetail;
fileDetail=function(id){
  _fdPlant(id);
  var f=fileOf(id); if(!f) return;
  var p=PLANTS[f.plant]; if(!p) return;
  $('view').insertAdjacentHTML('beforeend',
   '<div class="card mt"><h3>Origin site</h3><div class="pad"><dl class="kv">'+
   [['Site',p.n],['Legal entity',p.entity],
    ['Address',p.addr+', Dist. '+p.dist+', '+p.state+' '+p.pin],
    ['GSTIN',p.gstin],['Products',p.makes],
    ['Gateway port',plabel(p.port)+(p.alt?'  (alternate '+plabel(p.alt)+')':'')],
    ['Place of supply',p.state]]
   .map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>';}).join('')+
   '</dl></div></div>');
};
/* reseed so nothing references a site that no longer exists */
seed();
S.files.forEach(function(f){ if(!PLANTS[f.plant]) f.plant='P1'; });
S.bids.forEach(function(b){ if(b.plant&&!PLANTS[b.plant]) b.plant='P1'; });
S.orders.forEach(function(o){ if(o.plant&&!PLANTS[o.plant]) o.plant='P1'; });
S.invoices.forEach(function(i){ recompute(i); if(i.status!=='paid') runValidation(i); });
S.rev=Date.now();
renderLogin();
</script>
<script>
/* ============ v3.6 — merge the UN/LOCODE master into the existing port registry ============ */
(function mergePorts(){
  var mine={};
  PORT_RAW.split('\n').forEach(function(line){
    var p=line.split('|'); if(p.length<5) return;
    mine[p[0]]={n:p[1],country:p[2],lat:parseFloat(p[3]),lon:parseFloat(p[4]),
      r:regionFor2(p[2],parseFloat(p[3]),parseFloat(p[4]))};
  });
  PORTS={}; TARIFF.THCD=TARIFF.THCD||{};
  PORT_SEED.forEach(function(p){ addPort(p[0],p[1],p[2],'built-in'); });
  Object.keys(mine).forEach(function(code){
    var m=mine[code];
    var region=(THC_REGION[m.r]!=null)?m.r:regionFor(code);
    var had=PORTS[code];
    addPort(code,had?had.n:m.n,region,had?had.src:'UN/LOCODE master');
    PORTS[code].country=m.country; PORTS[code].lat=m.lat; PORTS[code].lon=m.lon;
  });
  PORTS.INHZA=PORTS.INHZA||{};
  addPort('INHZA','Hazira','West India','built-in');
  PORTS.INHZA.country='India'; PORTS.INHZA.lat=21.098; PORTS.INHZA.lon=72.646;
  ['INMUN','INNSA','INHZA','INIXY','INPAV','INDAH','INTKD','INDAD','INSNF','INPTP','INLDH']
    .forEach(function(c){ if(PORTS[c]&&TARIFF.THCO[c]==null) TARIFF.THCO[c]=186; });
})();
function regionFor2(country,lat,lon){
  if(country==='India'){
    if(lat>=17.5&&lon<74) return 'West India';
    if(lat<17.5) return 'South India';
    if(lon>=80) return 'East India';
    return 'North India';
  }
  if(country==='United States'){
    if(lon<=-114) return 'US West Coast';
    if(lat<=31&&lon<=-82) return 'US Gulf';
    return 'US East Coast';
  }
  return REGION_BY_COUNTRY[country]||'';
}
/* hand the ports tab back to the existing settings view and importer */
VIEWS.settings=_setPorts;
portForm=function(k){
  var p=k?PORTS[k]:{n:'',r:'West India',country:'',lat:0,lon:0};
  modal('<header><h2>'+(k?'Edit port \u00B7 '+k:'Add a port')+'</h2>'+
   '<button class="x" onclick="closeModal()">\u00D7</button></header><div class="body"><div class="grid g3">'+
   '<label class="f"><span>UN/LOCODE <em>five characters</em></span>'+
     '<input class="i" id="ok2" value="'+(k||'')+'"'+(k?' readonly':'')+'></label>'+
   '<label class="f"><span>Port name</span><input class="i" id="on2" value="'+esc(p.n)+'"></label>'+
   '<label class="f"><span>Country</span><input class="i" id="oc2" value="'+
     esc(p.country||'')+'"></label>'+
   '<label class="f"><span>Region <em>drives SLA and terminal tariff</em></span>'+
     '<input class="i" id="or2" list="reglist" value="'+esc(p.r)+'">'+

       return '<option value="'+esc(r)+'">';}).join('')+'</datalist></label>'+
   '<label class="f"><span>Latitude</span><input class="i" id="olat" type="number" step="0.001" value="'+
     (p.lat||0)+'"></label>'+
   '<label class="f"><span>Longitude</span><input class="i" id="olon" type="number" step="0.001" value="'+
     (p.lon||0)+'"></label>'+
   '</div></div><footer><button class="btn" onclick="closeModal()">Cancel</button>'+
   '<button class="btn pri" onclick="savePort()">Save port</button></footer>');
};
savePort=function(){
  var k=(val('ok2')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(k.length!==5) return toast('A UN/LOCODE is five characters','For example INMUN or NLRTM.');
  if(!addPort(k,val('on2')||k,val('or2')||undefined,'added by hand'))
    return toast('Could not save that code');
  PORTS[k].country=val('oc2'); PORTS[k].lat=numval('olat'); PORTS[k].lon=numval('olon');
  closeModal(); render(); bump('master','Port saved, '+k);
  toast('Port saved',k+' '+val('on2')+' \u00B7 region '+PORTS[k].r);
};
/* reseed against the merged master */
seed();
S.files.forEach(function(f){ if(!PLANTS[f.plant]) f.plant='P1'; });
S.bids.forEach(function(b){ if(b.plant&&!PLANTS[b.plant]) b.plant='P1'; });
S.orders.forEach(function(o){ if(o.plant&&!PLANTS[o.plant]) o.plant='P1'; });
S.invoices.forEach(function(i){ recompute(i); if(i.status!=='paid') runValidation(i); });
S.rev=Date.now();
renderLogin();
</script>
